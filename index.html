<script>
const chartEl = document.getElementById('chart');

// These need to exist before ANYTHING else runs (including chart setup
// below), since createRsiChart() references barsData/currentTicker
// immediately when first called - having their declarations any later
// in the file throws a "used before initialization" error that halts
// the entire script.
let currentTicker = 'HPQ';
let currentTF = 'daily';
let barsData = [];

// Same reason as above: createRsiChart() calls applyRsiSettings()
// synchronously near the top of this script, which needs
// LINE_STYLE_MAP - defining it down with the rest of the drawing-tools
// style helpers (where it conceptually belongs) previously caused
// exactly this "used before initialization" crash, silently breaking
// the ENTIRE page (blank chart, empty watchlist, nothing loads) since
// it happened before any of the real initialization code ran.
const LINE_STYLE_MAP = {
  solid: LightweightCharts.LineStyle.Solid,
  dashed: LightweightCharts.LineStyle.Dashed,
  // Regular "Dotted" renders as tiny, tightly-packed dots that read as
  // near-identical to Dashed at a glance. SparseDotted uses the same
  // dot shape with much wider gaps, which is what actually reads as
  // visually distinct from a dashed line. Kept as the 'dotted' key
  // (existing saved settings/drawings already use this string to mean
  // SparseDotted - don't repoint it) and added 'tightDotted' as a
  // separate, additional choice for anything that wants the closer-
  // together dots instead - lets a "Line" style dropdown offer both
  // spacings distinctly rather than only ever meaning SparseDotted.
  dotted: LightweightCharts.LineStyle.SparseDotted,
  tightDotted: LightweightCharts.LineStyle.Dotted,
};

const chart = LightweightCharts.createChart(chartEl, {
  layout: {
    background: { color: '#ffffff' },
    textColor: '#131722',
    fontFamily: "-apple-system, 'Trebuchet MS', Roboto, Helvetica, Arial, sans-serif",
  },
  grid: {
    vertLines: { visible: false },
    horzLines: { visible: false },
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  // minimumWidth pins the right price-scale width so the main chart and
  // both indicator panes reserve the SAME axis width. Without it each pane
  // auto-sizes to its own labels (price ~"32.00" = 52px, RSI "120.00" =
  // 60px), so their plot areas differ in width and the same date lands at
  // a different x in each pane - the panes look horizontally out of sync
  // even when perfectly range-synced. 64 clears the widest label. NOTE:
  // minimumWidth is only honored at createChart time in this Lightweight
  // Charts build, not via runtime applyOptions - so it lives in the
  // creation options of all three charts (here, createRsiChart, createMacdChart).
  rightPriceScale: { borderColor: '#e0e3eb', mode: LightweightCharts.PriceScaleMode.Logarithmic, minimumWidth: 64 },
  timeScale: { borderColor: '#e0e3eb', timeVisible: false },
});

// Candles: hollow white body for up, solid red body for down. Wicks and
// borders are always black on both, regardless of direction.
const series = chart.addCandlestickSeries({
  upColor: '#ffffff',
  downColor: '#ef5350',
  borderUpColor: '#000000',
  borderDownColor: '#000000',
  wickUpColor: '#000000',
  wickDownColor: '#000000',
  lastValueVisible: false,
  // Without this, Lightweight Charts draws its own dashed "last price"
  // reference line at the last data point's close, spanning the FULL
  // chart width regardless of where the actual candles end - normally
  // barely noticeable near the right edge, but now that the future
  // placeholder bars leave a wide blank stretch to the right of the
  // real candles, that default line reads as an unwanted line
  // extending across the future space, same family of issue as the
  // MAs fixed above.
  priceLineVisible: false,
});

// EMA overlays, sharing the main price scale.
const emaSeries = {
  ema_10:  chart.addLineSeries({ color: '#000000', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_20:  chart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_50:  chart.addLineSeries({ color: '#26a69a', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_200: chart.addLineSeries({ color: '#ef5350', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
};

// Multi-timeframe EMA(10) overlays - e.g. showing the WEEKLY EMA 10 on
// top of a DAILY chart. Each is independently toggleable and off by
// default. Different timeframes use different time formats internally
// (date strings like "2026-08-07" for daily-and-up, Unix timestamps for
// intraday) - alignTimeToCurrentChart() below converts between them so
// an overlay always renders correctly regardless of which timeframe the
// main chart is currently showing.
const MTF_EMA_COLORS = {
  m5: '#e91e63', m15: '#fb8c00', hourly: '#8e24aa',
  daily: '#3949ab', weekly: '#6d4c41', monthly: '#00acc1', quarterly: '#7cb342',
};
const mtfEmaSeries = {};
const mtfEmaEnabled = {};
Object.keys(MTF_EMA_COLORS).forEach(tf => {
  mtfEmaSeries[tf] = chart.addLineSeries({
    color: MTF_EMA_COLORS[tf], lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false,
  });
  mtfEmaEnabled[tf] = false;
});

function dateStringToTimestamp(dateStr) {
  return Math.floor(new Date(dateStr + 'T00:00:00Z').getTime() / 1000);
}

// Converts a single time value from one timeframe's own format to
// another's (date string for daily-and-up, Unix timestamp for
// intraday) - used to sync pan/zoom between the main chart and RSI (or
// any future indicator pane) by actual CALENDAR time rather than raw
// bar index, since bar index doesn't mean the same thing across
// different timeframes (bar 100 on Daily is a completely different
// date than bar 100 on 15m) but a calendar date/time does.
function convertTimeBetweenTF(time, fromTF, toTF) {
  const fromIntraday = TIMEFRAME_META[fromTF].intraday;
  const toIntraday = TIMEFRAME_META[toTF].intraday;
  if (fromIntraday === toIntraday) return time;
  if (toIntraday) return dateStringToTimestamp(time);
  return new Date(time * 1000).toISOString().slice(0, 10);
}

// Converts a LOGICAL (bar-index) position - which can be fractional, or
// even negative / past the end of the array once the chart is zoomed
// out further than there's data to fill it - into a calendar time in
// `tf`'s own native format. Used instead of
// chart.timeScale().getVisibleRange() for cross-timeframe sync, because
// that returns null once the visible range extends past the actual
// loaded bars (there's no real bar there to report a time for), which
// was silently freezing the other pane's sync at that point. Here,
// positions past either end of `bars` are extrapolated using the
// array's own average bar-to-bar spacing, so sync keeps working exactly
// where a user would notice it break - fully zoomed out.
function logicalIndexToTFTime(idx, bars, tf) {
  const n = bars.length;
  if (n === 0) return null;
  const nums = bars.map(b => timeToNumeric(b.time));
  const step = n > 1 ? (nums[n - 1] - nums[0]) / (n - 1) : 86400;
  let numeric;
  if (idx <= 0) numeric = nums[0] + idx * step;
  else if (idx >= n - 1) numeric = nums[n - 1] + (idx - (n - 1)) * step;
  else {
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    numeric = lo === hi ? nums[lo] : nums[lo] + (idx - lo) * (nums[hi] - nums[lo]);
  }
  return TIMEFRAME_META[tf].intraday ? Math.round(numeric) : new Date(numeric * 1000).toISOString().slice(0, 10);
}

// Inverse of logicalIndexToTFTime - finds the (possibly fractional, or
// out-of-bounds/extrapolated) logical index in `bars` for a given
// calendar time. Used instead of chart.timeScale().setVisibleRange()
// when opening a NEW timeframe's initial view - setVisibleRange (time-
// based) does not reliably apply when called in the same tick as the
// series.setData() that just loaded the new timeframe's data (the
// chart's internal scale hasn't caught up to the new data yet, and
// unlike a plain redraw, waiting a single requestAnimationFrame was
// still not enough for it to settle - confirmed by direct testing).
// setVisibleLogicalRange (index-based) does not have this problem, so
// converting time -> index up front and using that instead sidesteps it
// entirely.
function timeToLogicalIndex(time, bars) {
  const n = bars.length;
  if (n === 0) return 0;
  const target = timeToNumeric(time);
  const nums = bars.map(b => timeToNumeric(b.time));
  const step = n > 1 ? (nums[n - 1] - nums[0]) / (n - 1) : 86400;
  if (target <= nums[0]) return step ? (target - nums[0]) / step : 0;
  if (target >= nums[n - 1]) return step ? (n - 1) + (target - nums[n - 1]) / step : n - 1;
  for (let i = 0; i < n - 1; i++) {
    if (nums[i] <= target && target <= nums[i + 1]) {
      const span = nums[i + 1] - nums[i];
      return span ? i + (target - nums[i]) / span : i;
    }
  }
  return n - 1;
}

// For ongoing pan/zoom sync between panes on different timeframes.
// Per EDGE (from/to independently, not the range as a whole):
// - When that edge's logical index is still within the loaded data
//   [0, bars.length-1], trust the source chart's own naturally-computed
//   getVisibleRange() for that edge - exact, matches real bar positions.
// - Once that edge extends PAST the data, fall back to
//   logicalIndexToTFTime's extrapolation instead.
//
// This has to be asymmetric because the two edges behave differently:
// the candlesticks have NO reserved space before the first real bar
// (nothing to scroll into), so getVisibleRange() correctly clamps the
// "from" edge to the true first-bar date once scrolled past it, and
// that clamped value is exactly what should be synced - extrapolating
// instead would make the OTHER pane run away into increasingly wrong,
// unrelated history even after this chart's own display had already
// frozen at its true boundary (confirmed as a real, reproducible bug).
// But the "to" edge DOES have reserved space (the future placeholder
// whitespace points) - once scrolled past even that, getVisibleRange()
// still returns a value, but a CLAMPED one that silently drops how much
// blank overscroll margin is actually being shown. Trusting that
// clamped "to" for sync makes the two panes' PIXEL WIDTHS diverge even
// though their reported dates stay close - confirmed directly: candles
// stopped at a fixed pixel while RSI's line kept extending further
// right past it, growing with every extra scroll step, because RSI's
// sync target kept getting the same clamped date main was already
// showing at rest, undercounting how far main had actually scrolled.
function sourceVisibleTime(sourceChart, range, bars, tf) {
  const n = bars.length;
  const clamped = sourceChart.timeScale().getVisibleRange();
  return {
    from: (range.from >= 0 && clamped) ? clamped.from : logicalIndexToTFTime(range.from, bars, tf),
    to: (range.to <= n - 1 && clamped) ? clamped.to : logicalIndexToTFTime(range.to, bars, tf),
  };
}

// Applies a source pane's just-changed visible logical range onto a
// destination pane, keeping both panes showing the same CALENDAR window.
// This is the single, pane-agnostic core of the cross-pane pan/zoom
// sync - the two directional handlers (main->indicator and
// indicator->main) are identical apart from which pane is source and
// which is destination, so both call this rather than copy-pasting the
// body (which is exactly the RSI-specific coupling that made adding a
// second indicator pane hard - see CHART_HANDOFF.md Section 0 item 3).
//
// A "pane" here is a plain descriptor of three getters:
// { chart(), bars(), getTF() }. All three are functions, not bare
// values, so the descriptor can be built ONCE and still read each pane's
// LIVE state on every event: `rsiChart` is reassigned (RSI can be
// toggled off to null and recreated), the `barsData`/`rsiBarsData`
// arrays are reassigned on every data load, and both `currentTF` and
// `rsiTF` change as the user switches timeframes.
//
// Same-timeframe fast path: when both panes are on the same timeframe,
// bar index means the same thing on both, so the range passes straight
// through untouched - this is what keeps a same-TF drag perfectly smooth
// (no per-frame calendar-time round-tripping, which snaps to whole-bar
// boundaries on daily-and-up and visibly jitters). Only when the
// timeframes differ do we convert through calendar time, edge-by-edge
// via sourceVisibleTime (asymmetric clamping - see its callers' notes)
// and position by logical index (setVisibleLogicalRange, never
// setVisibleRange - the latter silently clamps a target time beyond the
// destination's own loaded data; see timeToLogicalIndex's comment).
// Converts a calendar-time window into the logical range dst should show.
// tf is the timeframe the window's times are expressed in.
function paneRangeForWindow(dst, fromT, toT, tf) {
  const dstTF = dst.getTF();
  return {
    from: timeToLogicalIndex(convertTimeBetweenTF(fromT, tf, dstTF), dst.bars()),
    to: timeToLogicalIndex(convertTimeBetweenTF(toT, tf, dstTF), dst.bars()),
  };
}

// The pane descriptors the sync handlers pass to applyCrossPaneRange.
// Defined once here; their getters read live globals (see the comment on
// applyCrossPaneRange). Adding a new indicator pane = add its descriptor
// of the same { chart(), bars(), getTF() } shape to syncPanes below, and
// have its own timeScale subscription call broadcastRange(itsPane, range).
// That's the whole sync-wiring cost of a new pane now - the MACD pane
// (macdSyncPane) is exactly that: one more descriptor in the list.
const mainSyncPane = { chart: () => chart,     bars: () => barsData,     getTF: () => currentTF };
const rsiSyncPane  = { chart: () => rsiChart,  bars: () => rsiBarsData,  getTF: () => rsiTF };
const macdSyncPane = { chart: () => macdChart, bars: () => macdBarsData, getTF: () => macdTF };
const syncPanes = [mainSyncPane, rsiSyncPane, macdSyncPane];

// Broadcasts one pane's just-changed visible range to every OTHER pane
// that currently exists (a pane whose chart() is null is toggled off and
// skipped). Replaced the old pairwise main<->RSI model (per-direction
// booleans syncingFromMain/syncingFromRsi), which did not generalize: a
// change from RSI would reach main but not propagate on to MACD.
//
// ECHO SUPPRESSION - the part that keeps three panes from drifting apart
// under aggressive rapid wheel-zoom. When we set a range on a
// destination pane, that pane emits its OWN range-change event. If that
// echo were treated as a fresh user gesture it would re-broadcast a
// re-converted range back to the others, and because cross-timeframe
// conversion (e.g. daily<->weekly) is lossy, each round-trip accumulates
// error - which is exactly what showed up as MACD/RSI/main slowly
// sliding out of sync when a coarse-TF pane was zoomed hard. A single
// syncInProgress flag reset one frame later is NOT enough: the library
// fires those echoes over several LATER frames, past the reset. So we
// also record, per pane, the exact range we last APPLIED to it
// (lastAppliedRange), BEFORE calling setVisibleLogicalRange, and ignore
// any incoming range that matches it - recognising an echo by VALUE
// instead of by timing, which works no matter how many frames late it
// fires. syncInProgress still guards the synchronous re-entry; suppressSync
// still hard-mutes everything during a timeframe-switch transition.
let syncInProgress = false;
const lastAppliedRange = new WeakMap(); // pane -> {from,to} we last set on it
const lastAppliedAt = new WeakMap();    // pane -> timestamp (ms) we last set it
const ECHO_WINDOW_MS = 150;
function rangesClose(a, b) {
  return !!a && !!b && Math.abs(a.from - b.from) < 0.05 && Math.abs(a.to - b.to) < 0.05;
}
function recordApplied(pane, r) { lastAppliedRange.set(pane, r); lastAppliedAt.set(pane, performance.now()); }
function isEcho(pane, range) {
  // (a) BY VALUE - matches what we set (common, un-clamped case).
  if (rangesClose(range, lastAppliedRange.get(pane))) return true;
  // (b) BY RECENCY - we set this pane a moment ago and it's now reporting
  //     the range it actually settled on, which may DIFFER from what we
  //     asked if it clamped. Still an echo, not a user gesture.
  const setAt = lastAppliedAt.get(pane);
  return setAt != null && (performance.now() - setAt) < ECHO_WINDOW_MS;
}

// The main chart's data extent in calendar time - the HARD-LOCK bounds.
// No pane may pan/zoom to show a time outside [first bar, last bar] of the
// main chart's own data (last bar is the last future placeholder). This is
// what keeps every pane on an IDENTICAL calendar window: a coarser-TF pane
// (e.g. weekly) holds more history than main, but is not allowed to scroll
// back past main's first bar, so it can never show a window main can't.
function mainDataBounds() {
  const b = barsData;
  return b.length ? { loT: b[0].time, hiT: b[b.length - 1].time } : null;
}

// Broadcasts one pane's just-changed visible window to every OTHER live
// pane, keeping all panes on the same calendar window. Steps: recognise
// and drop echoes (isEcho); read the source's window in calendar time;
// clamp it to the main chart's data extent (the hard-lock), snapping the
// source pane back if it tried to go past; then apply the clamped window
// to every other pane. Replaced the old pairwise main<->RSI model, which
// did not generalize past two panes.
function broadcastRange(srcPane, range) {
  if (suppressSync || !range || syncInProgress) return;

  const srcTF = srcPane.getTF();
  const srcBars = srcPane.bars();

  // HARD-LOCK bounds as logical indices in the SOURCE's own bars: the source
  // may not pan/zoom to show times outside the main chart's data window.
  // minIdx/maxIdx are that window mapped into the source's indexing (for a
  // same-TF source that's just [0, lastBar]; for a coarser-TF source it's
  // the sub-range that overlaps main's data, so e.g. a weekly pane can't
  // scroll back past main's first daily bar).
  let minIdx = 0, maxIdx = srcBars.length - 1;
  const mb = mainDataBounds();
  if (mb) {
    minIdx = timeToLogicalIndex(convertTimeBetweenTF(mb.loT, currentTF, srcTF), srcBars);
    maxIdx = timeToLogicalIndex(convertTimeBetweenTF(mb.hiT, currentTF, srcTF), srcBars);
  }

  // Clamp the incoming range into [minIdx, maxIdx] PRESERVING WIDTH: when an
  // edge hits a bound, SLIDE the whole window instead of truncating that
  // edge. Truncating one edge while the other kept moving shrank the window,
  // which at a boundary turned a pan into a runaway zoom-in - "scroll out
  // fully, then drag left and it accelerates away" (the drag pushed `to`
  // past the last bar; `to` got pinned while `from` kept sliding in, so the
  // window collapsed toward a couple of bars). Sliding keeps the zoom level
  // fixed so a pan simply stops at the edge. Only shrink if the window is
  // wider than the whole allowed span.
  let from = range.from, to = range.to;
  const width = to - from;
  let clamped = false;
  if (from < minIdx) { from = minIdx; to = from + width; clamped = true; }
  if (to > maxIdx) { to = maxIdx; from = to - width; clamped = true; }
  if (from < minIdx) { from = minIdx; clamped = true; } // window wider than the allowed span
  const clampedRange = { from, to };

  // Echo suppression applies ONLY to in-bounds changes. An out-of-bounds
  // (clamped) source MUST spring back regardless of whether the event looks
  // like an echo; in-bounds echoes are still dropped so nothing bounces.
  if (!clamped && isEcho(srcPane, range)) return;
  syncInProgress = true;

  if (clamped) {
    recordApplied(srcPane, clampedRange);
    srcPane.chart().timeScale().setVisibleLogicalRange(clampedRange);
  }

  // Calendar times of the (clamped) window, only needed for cross-TF panes.
  const fromT = logicalIndexToTFTime(clampedRange.from, srcBars, srcTF);
  const toT = logicalIndexToTFTime(clampedRange.to, srcBars, srcTF);

  for (const dst of syncPanes) {
    if (dst === srcPane || !dst.chart()) continue;
    let target;
    if (dst.getTF() === srcTF) {
      // Same timeframe = identical bar indexing, so use the source's logical
      // range directly - exact, no calendar round-trip (whose rounding shows
      // up as "stretch" at extreme zoom).
      target = clampedRange;
    } else if (fromT != null && toT != null) {
      target = {
        from: timeToLogicalIndex(convertTimeBetweenTF(fromT, srcTF, dst.getTF()), dst.bars()),
        to: timeToLogicalIndex(convertTimeBetweenTF(toT, srcTF, dst.getTF()), dst.bars()),
      };
    }
    if (!target) continue;
    recordApplied(dst, target); // record BEFORE setting, so a sync echo is caught
    dst.chart().timeScale().setVisibleLogicalRange(target);
  }
  // Reset SYNCHRONOUSLY. syncInProgress only needs to block the re-entrant
  // broadcasts that firing setVisibleLogicalRange above triggers within
  // this same call stack; any echo that arrives on a LATER frame is caught
  // by isEcho() (value + recency) instead. The old requestAnimationFrame-
  // deferred reset was from before those echo guards existed - and under a
  // rapid wheel-zoom burst the rAF could be starved/throttled so the reset
  // never fired, leaving syncInProgress stuck true and every later
  // broadcast blocked -> the indicator panes froze while the main chart
  // kept zooming (the "zoom in until candles are less than chart width, it
  // fights then fails" bug). A synchronous reset can't get stuck.
  syncInProgress = false;
}

// Forces one indicator pane to the main chart's target logical range,
// converting through calendar time when the pane is on a different
// timeframe. Used by loadTimeframe's settle-then-reassert step (the
// suppressSync cascade fix), where the range is asserted explicitly
// rather than via broadcastRange because sync is muted at that moment.
// Factored out so each indicator pane is one call, not a copy-pasted
// block - the reassert logic was the RSI-specific duplication a second
// pane would otherwise have forced yet another copy of.
function reassertIndicatorRange(pane, targetFrom, targetTo, mainData, mainTF) {
  if (!pane.chart()) return;
  const paneTF = pane.getTF();
  let applied;
  if (paneTF === mainTF) {
    applied = { from: targetFrom, to: targetTo };
  } else {
    const fromT = logicalIndexToTFTime(targetFrom, mainData, mainTF);
    const toT = logicalIndexToTFTime(targetTo, mainData, mainTF);
    if (fromT == null || toT == null) return;
    applied = {
      from: timeToLogicalIndex(convertTimeBetweenTF(fromT, mainTF, paneTF), pane.bars()),
      to: timeToLogicalIndex(convertTimeBetweenTF(toT, mainTF, paneTF), pane.bars()),
    };
  }
  // Record it too, so once suppressSync lifts, this pane's echoed
  // range-change event is recognised as ours and not rebroadcast.
  lastAppliedRange.set(pane, applied);
  lastAppliedAt.set(pane, performance.now());
  pane.chart().timeScale().setVisibleLogicalRange(applied);
}

// Force every live indicator pane onto the main chart's current visible
// range. A belt-and-suspenders reconcile for the INITIAL PAGE LOAD, where
// the main chart's and each indicator's data fetches resolve in an
// unpredictable order (and briefly share the suppressSync flag), so an
// indicator can occasionally set its starting view before main's is
// settled - it then looks out of sync until the first scroll runs the
// sync. Scheduling this a few times after load guarantees final alignment,
// exactly as a manual scroll would. Idempotent and cheap.
function resyncIndicatorsToMain() {
  const r = chart.timeScale().getVisibleLogicalRange();
  if (!r || !barsData.length) return;
  if (rsiChart && rsiBarsData.length) reassertIndicatorRange(rsiSyncPane, r.from, r.to, barsData, currentTF);
  if (macdChart && macdBarsData.length) reassertIndicatorRange(macdSyncPane, r.from, r.to, barsData, currentTF);
}

// Builds a short, flat "last value carried forward" segment bridging
// the gap between an indicator's own last REAL (completed) bar and some
// later reference time - typically the main chart's current real
// boundary. Shows up whenever an indicator pane is on a coarser
// timeframe than the main chart and the current period hasn't closed
// yet (e.g. RSI on Quarterly won't have this quarter's own bar until
// the quarter ends, even though the main Daily chart already has
// today's bar) - without this, the indicator's line would just stop
// short of where the main chart's real candles do, with a distracting
// gap of nothing in between.
//
// Returns an empty array (nothing to draw) if targetTime isn't actually
// later than the indicator's last real point - the common case when an
// indicator shares the main chart's own timeframe, since there's no gap
// to fill.
//
// Deliberately generic (indicator-agnostic) rather than RSI-specific -
// any future indicator pane can call this the same way RSI does, using
// its own last computed point and its own series for the returned
// segment (a single Lightweight Charts LineSeries can't mix line styles
// within itself, so this segment always needs to render on a SEPARATE
// series from the indicator's real line, styled distinctly - RSI's own
// usage pairs this with rsiExtensionSeries, styled lighter/dotted via
// applyRsiSettings()).
function buildLastValueExtension(lastRealPoint, targetTime) {
  if (!lastRealPoint) return [];
  if (timeToNumeric(targetTime) <= timeToNumeric(lastRealPoint.time)) return [];
  return [
    { time: lastRealPoint.time, value: lastRealPoint.value },
    { time: targetTime, value: lastRealPoint.value },
  ];
}

// Converts a computed EMA series' time values to whatever format the
// CURRENTLY ACTIVE chart is using, so both can coexist on one timeScale.
function alignTimeToCurrentChart(data) {
  const currentIsIntraday = TIMEFRAME_META[currentTF].intraday;
  const sourceIsIntraday = typeof data[0].time === 'number';
  if (currentIsIntraday === sourceIsIntraday) return data;
  if (currentIsIntraday && !sourceIsIntraday) {
    // Overlaying a daily-or-higher EMA onto an intraday chart - convert
    // each date string to a timestamp at midnight UTC.
    return data.map(d => ({ time: dateStringToTimestamp(d.time), value: d.value }));
  }
  // Overlaying an intraday EMA onto a daily-or-higher chart - convert
  // timestamps to dates, keeping only the LAST value per calendar day
  // (a chart series requires unique, increasing time values).
  const byDate = {};
  data.forEach(d => {
    const dateStr = new Date(d.time * 1000).toISOString().slice(0, 10);
    byDate[dateStr] = d.value;
  });
  return Object.keys(byDate).sort().map(dateStr => ({ time: dateStr, value: byDate[dateStr] }));
}

function loadMtfEma(tf) {
  if (!mtfEmaEnabled[tf]) {
    mtfEmaSeries[tf].setData([]);
    return;
  }
  fetch(`${currentTicker.toLowerCase()}_${tf}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) { mtfEmaSeries[tf].setData([]); return; }
      // Truncate to that file's own last real bar first - it carries
      // the same future placeholder bars as the main chart's data, and
      // this overlay shouldn't run flat into them either.
      const realData = data.slice(0, lastRealBarIndex(data) + 1);
      const ema10 = calculateEMA(realData, 10, 'close');
      mtfEmaSeries[tf].setData(alignTimeToCurrentChart(ema10));
    })
    .catch(() => setStatus(`Could not load ${tf} EMA 10 overlay.`, true));
}

function refreshAllEnabledMtfEmas() {
  Object.keys(mtfEmaEnabled).forEach(tf => { if (mtfEmaEnabled[tf]) loadMtfEma(tf); });
}

// "Current TF" / "1 timeframe above" / "2 timeframes above" - these
// represent WHATEVER timeframe is 0/1/2 steps larger than the main
// chart's CURRENT timeframe, recalculated dynamically. E.g. viewing
// Daily, "1 above" is Weekly; switch the main chart to Weekly, and
// "1 above" becomes Monthly automatically - same checkbox, different
// underlying data. "Current TF" (offset 0) is the main chart's own
// timeframe - the same data as the Standard EMAs' EMA 10, just
// independently toggleable/colored here for consistency with the rest
// of this column.
const TF_ORDER = ['m5', 'm15', 'hourly', 'daily', 'weekly', 'monthly', 'quarterly'];
const RELATIVE_EMA_COLORS = { rel0: '#00897b', rel1: '#f9a825', rel2: '#455a64' };
const relEmaSeries = {};
const relEmaEnabled = { rel0: false, rel1: false, rel2: false };
const REL_EMA_OFFSETS = { rel0: 0, rel1: 1, rel2: 2 };
Object.keys(RELATIVE_EMA_COLORS).forEach(key => {
  relEmaSeries[key] = chart.addLineSeries({
    color: RELATIVE_EMA_COLORS[key], lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false,
  });
});

function getRelativeTF(offset) {
  const idx = TF_ORDER.indexOf(currentTF);
  const targetIdx = idx + offset;
  return targetIdx < TF_ORDER.length ? TF_ORDER[targetIdx] : null;
}

function loadRelEma(key, offset) {
  if (!relEmaEnabled[key]) {
    relEmaSeries[key].setData([]);
    return;
  }
  const targetTF = getRelativeTF(offset);
  if (!targetTF) {
    relEmaSeries[key].setData([]); // no higher timeframe exists (e.g. already on Quarterly)
    return;
  }
  fetch(`${currentTicker.toLowerCase()}_${targetTF}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) { relEmaSeries[key].setData([]); return; }
      // Same future-placeholder truncation as loadMtfEma above.
      const realData = data.slice(0, lastRealBarIndex(data) + 1);
      const ema10 = calculateEMA(realData, 10, 'close');
      relEmaSeries[key].setData(alignTimeToCurrentChart(ema10));
    })
    .catch(() => setStatus(`Could not load ${targetTF} EMA 10 overlay.`, true));
}

function refreshAllEnabledRelEmas() {
  Object.keys(relEmaEnabled).forEach(key => {
    if (relEmaEnabled[key]) loadRelEma(key, REL_EMA_OFFSETS[key]);
  });
}

// The EMA 10/20 crossover dots are drawn as a custom HTML overlay
// (#crossover-overlay), NOT native chart markers - so shapes beyond the
// library's four (circle/square/arrow-up/arrow-down) are possible, notably a
// cross/X. crossoverPoints holds the {time, value} of each crossover bar;
// renderCrossoverOverlay() positions a styled marker at each via the chart's
// own time+price-to-coordinate, re-run on every pan/zoom/resize (the same
// triggers as the earnings overlay). Independent on/off via crossoverVisible.
// The "Close above 20 EMA" event (close crossing up through the 20 EMA) uses
// the same overlay machinery, in its own #close-above-overlay.
let crossoverVisible = true;
let closeAboveVisible = true;

let earningsData = {};
let earningsVisible = true;

fetch('chart_earnings.json')
  .then(r => r.json())
  .then(data => {
    earningsData = data;
    renderEarningsOverlay();
  })
  .catch(() => setStatus('Could not load chart_earnings.json.', true));

// EMA 200 isn't in the exported data files (only 10/20/50/100 were
// pre-computed) - calculated here instead, directly from each bar's
// close price, using the same recursive formula (seed = first value,
// then price*k + prev*(1-k)) that the Python pipeline used, so the
// result matches what a server-side calculation would have produced.
// Also used for the volume EMA lines below (field='volume').
function calculateEMA(bars, period, field = 'close') {
  const k = 2 / (period + 1);
  let prev = null;
  return bars.map(bar => {
    prev = prev === null ? bar[field] : bar[field] * k + prev * (1 - k);
    return { time: bar.time, value: prev };
  });
}

// Layout: two stacked bands sharing the main chart's canvas - price on
// top (~75%), volume at the bottom (~25%). RSI is NOT part of this
// canvas - see the separate chart instance below, which avoids the
// axis-label-bleed problem entirely by using its own dedicated canvas.
chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });

const turnoverSeries = chart.addHistogramSeries({
  priceFormat: { type: 'volume' },
  priceScaleId: 'turnover',
  lastValueVisible: false,
  // Same reference-line issue as the candlestick series above - without
  // this, the last volume bar's own dashed price line stretches across
  // the future placeholder bars' zero-volume space.
  priceLineVisible: false,
});
chart.priceScale('turnover').applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });

const turnoverEmaSeries = chart.addLineSeries({
  color: '#5b8ff9',
  lineWidth: 1,
  lineStyle: LightweightCharts.LineStyle.Dashed,
  priceScaleId: 'turnover',
  priceLineVisible: false,
  lastValueVisible: false,
  crosshairMarkerVisible: false,
});

// RSI - a genuinely SEPARATE chart instance (its own canvas, own axis),
// not sharing the main chart's canvas at all. This is the standard way
// to build a true separate sub-panel with this library, since a single
// canvas's price-axis labels always span its FULL height regardless of
// scaleMargins - which is exactly what caused RSI's earlier bleed-into-
// the-price-axis problem.
//
// Rather than reusing one instance across hide/show cycles (which risks
// getting stuck if it's ever resized while its container is display:none),
// this instance is fully destroyed and recreated fresh every time RSI is
// toggled back on - see setRsiEnabled() below.
let rsiChartEl = document.getElementById('rsi-chart');
let rsiChart = null;
let rsiSeries = null;
// A second, lighter/dotted series overlaid on rsiSeries - bridges the
// visual gap between RSI's own last REAL (completed) bar and the main
// chart's current real boundary, which shows up whenever RSI is on a
// coarser timeframe than the main chart and the current period hasn't
// closed yet (e.g. RSI on Quarterly won't have this quarter's bar until
// it ends, even though the main Daily chart has today's). Carries the
// last real value forward flat, styled distinctly so it reads as
// provisional/not-yet-real rather than actual computed data. See
// buildLastValueExtension() - deliberately written generically so any
// future indicator pane can reuse the same pattern, not just RSI.
let rsiExtensionSeries = null;
// The per-direction sync guards that used to live here
// (syncingFromMain/syncingFromRsi) were replaced by the single
// syncInProgress flag + broadcastRange() up near applyCrossPaneRange -
// see that comment for the full rationale (they didn't generalize past
// two panes). suppressSync stays here: while true, broadcastRange no-ops
// unconditionally. Needed because right after a timeframe switch (any
// pane), the chart library's own reconciliation of the new data fires a
// CASCADE of intermediate range-change events over multiple frames - not
// just one. Silencing sync entirely during the transition, then
// explicitly forcing every pane to the correct final state once things
// settle, sidesteps the whole cascade rather than trying to out-guard it.
let suppressSync = false;
let rsiTF = 'daily'; // RSI's EFFECTIVE timeframe (the one actually plotted/synced)
// When true (the default), RSI mirrors the main chart's timeframe: rsiTF is
// kept equal to currentTF and follows it on every main-chart TF switch. The
// "Chart" button turns this on; picking a specific TF turns it off and pins
// RSI to that TF independently.
let rsiFollowChart = true;

// --- MACD pane state (the second indicator pane). Mirrors the RSI
// pane's globals. macdChart is null until createMacdChart() runs (and
// would be null again if a future on/off toggle tore it down, same as
// rsiChart). macdBarsData holds whatever timeframe's raw bars are
// currently plotted, so index/time math stays consistent - same
// contract as rsiBarsData. ---
let macdChart = null;
let macdLineSeries = null;    // MACD line (fast EMA - slow EMA)
let macdSignalSeries = null;  // signal line (EMA of the MACD line)
let macdHistSeries = null;    // histogram (MACD - signal)
let macdBarsData = [];
let macdTF = 'daily';         // MACD's EFFECTIVE timeframe (actually plotted/synced)
let macdFollowChart = true;   // mirror the main chart's timeframe by default (see rsiFollowChart)
let macdEnabled = true;       // on/off via the Indicators column, mirrors rsiEnabled
const macdChartEl = document.getElementById('macd-chart');

// --- RSI's own settings: the RSI line's color/thickness/line-type, and
// three optional reference lines (Upper/Lower/Middle), each with its
// own on/off + threshold value + its OWN independent color/thickness/
// line-type (each of the 3 levels can look completely different from
// the others). Persisted separately from the drawing-tools' own per-
// tool defaults (see TOOL_DEFAULTS_STORAGE_KEY above) - this is about
// the RSI INDICATOR itself, not anything drawn on it.
const RSI_SETTINGS_STORAGE_KEY = 'rsiSettings_v1';
const RSI_SETTINGS_FACTORY_DEFAULT = {
  line: { color: '#131722', lineWidth: 1, lineStyle: 'solid' },
  upper: { enabled: true, value: 60, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
  middle: { enabled: false, value: 50, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
  lower: { enabled: true, value: 40, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
  // The gap-bridging line (see buildLastValueExtension/rsiExtensionSeries)
  // that carries RSI's last real value forward to today when RSI's own
  // timeframe is coarser than the main chart's. An independent color
  // (not derived from the real line's own color) so it can be tuned
  // freely, e.g. straight to a light gray rather than a faded black.
  extension: { color: '#9a9ea6', lineWidth: 4, lineStyle: 'tightDotted' },
};

function loadRsiSettings() {
  try {
    const raw = localStorage.getItem(RSI_SETTINGS_STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    // Deep-merge over the factory default so a partially-saved/older
    // settings object (e.g. from before each level had its own style)
    // still gets sensible values for anything it's missing.
    return {
      line: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.line, saved && saved.line),
      upper: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.upper, saved && saved.upper),
      middle: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.middle, saved && saved.middle),
      lower: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.lower, saved && saved.lower),
      extension: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.extension, saved && saved.extension),
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(RSI_SETTINGS_FACTORY_DEFAULT));
  }
}

let rsiSettings = loadRsiSettings();

function persistRsiSettings() {
  try {
    localStorage.setItem(RSI_SETTINGS_STORAGE_KEY, JSON.stringify(rsiSettings));
  } catch (e) {
    // Best-effort, same as the drawing-tools defaults - fails silently
    // if storage is unavailable, still works for this session.
  }
}

// --- RSI pane layout: height (mouse-resizable) and position (top or
// bottom of the page, default bottom) - separate from rsiSettings
// above since this is about the PANE itself, not what's drawn in it.
// Applies immediately and persists right away (no separate "set as
// default" step - there's only ever one current layout, unlike the
// per-tool style defaults where "what I'm previewing" and "what future
// drawings use" are meaningfully different things).
const RSI_LAYOUT_STORAGE_KEY = 'rsiLayout_v1';
// priority (0-99): ordering among panes docked on the SAME side. Lower =
// nearer the main chart (RSI 10 sits right next to the chart, MACD 20
// sits beyond it). See applyRsiLayout / applyMacdLayout for how it maps to
// CSS `order`.
const RSI_LAYOUT_FACTORY_DEFAULT = { height: 150, position: 'bottom', priority: 10 };
const RSI_MIN_HEIGHT = 80;
const RSI_MAX_HEIGHT = 500;

function loadRsiLayout() {
  try {
    const raw = localStorage.getItem(RSI_LAYOUT_STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    return Object.assign({}, RSI_LAYOUT_FACTORY_DEFAULT, saved);
  } catch (e) {
    return Object.assign({}, RSI_LAYOUT_FACTORY_DEFAULT);
  }
}

let rsiLayout = loadRsiLayout();

function persistRsiLayout() {
  try {
    localStorage.setItem(RSI_LAYOUT_STORAGE_KEY, JSON.stringify(rsiLayout));
  } catch (e) {
    // Best-effort, same as the other localStorage-backed settings here.
  }
}

// Maps a pane's { position, priority } to a flexbox `order` relative to
// #main-chart-area (order 0). Panes docked at the top get negative order
// (above main), bottom get positive (below main). Within a side, LOWER
// priority sits NEARER the main chart: a bottom pane's order grows with
// priority (nearer chart = smaller order = higher up, just under main); a
// top pane's order shrinks (more negative) with priority (nearer chart =
// larger order = lower down, just above main). The +1 keeps priority 0 off
// main's own order 0. Any future indicator pane reuses this.
function paneOrderValue(layout) {
  const p = Math.max(0, Math.min(99, layout.priority == null ? 10 : layout.priority));
  return layout.position === 'top' ? -(p + 1) : (p + 1);
}

function applyRsiLayout() {
  const rsiContainer = document.getElementById('rsi-chart-container');
  if (!rsiContainer) return;
  rsiContainer.style.height = rsiLayout.height + 'px';
  rsiContainer.style.order = String(paneOrderValue(rsiLayout));
  // The resize handle always sits on whichever edge borders the main
  // chart, so dragging it always means "grow/shrink toward the main
  // chart" regardless of whether RSI is docked at the top or bottom.
  const handle = document.getElementById('rsi-resize-handle');
  if (handle) {
    if (rsiLayout.position === 'top') { handle.style.top = 'auto'; handle.style.bottom = '0'; }
    else { handle.style.top = '0'; handle.style.bottom = 'auto'; }
  }
  if (rsiChart) {
    rsiChart.applyOptions({ width: rsiChartEl.clientWidth, height: rsiChartEl.clientHeight });
  }
}

// Resizing the RSI pane shrinks/grows the MAIN chart's container too
// (both share the same flex column, so one taking more room means the
// other gets less) - but the chart library doesn't auto-redraw when
// its container resizes, it needs an explicit resize call, same as
// the window-resize handler already does elsewhere in this file. Kept
// separate from applyRsiLayout above (rather than folded into it)
// because THAT function also runs once during the very first page
// load, before mainPane/rsiPane/positionDailyBox exist yet - calling
// them that early would throw the same "used before initialization"
// crash fixed earlier in this project. This function is only ever
// called from user-triggered paths (dragging the resize handle,
// changing pane position, Restore Default), always after the full
// script - and those variables - have finished loading.
function resizeChartsForRsiLayout() {
  applyRsiLayout();
  chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  renderEarningsOverlay();
  mainPane.refreshOverlay();
  rsiPane.refreshOverlay();
  positionDailyBox();
}

// Drag-to-resize: mousedown on the handle, then track vertical mouse
// movement to grow/shrink the RSI pane's height, clamped to a sane
// range. Direction depends on which edge the handle is docked to (see
// applyRsiLayout above) - dragging always feels like "pull this edge
// toward/away from the main chart," whichever position RSI is in.
(function setupRsiResize() {
  const handle = document.getElementById('rsi-resize-handle');
  if (!handle) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = rsiLayout.height;
    const onMove = (ev) => {
      const dy = ev.clientY - startY;
      const delta = rsiLayout.position === 'top' ? dy : -dy;
      rsiLayout.height = Math.max(RSI_MIN_HEIGHT, Math.min(RSI_MAX_HEIGHT, startHeight + delta));
      resizeChartsForRsiLayout();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      persistRsiLayout();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// --- MACD pane layout: height + position (top/bottom), the direct mirror
// of the RSI layout system above (rsiLayout_v1 / applyRsiLayout / etc.).
// Persisted separately under macdLayout_v1. ---
const MACD_LAYOUT_STORAGE_KEY = 'macdLayout_v1';
const MACD_LAYOUT_FACTORY_DEFAULT = { height: 140, position: 'bottom', priority: 20 };
const MACD_MIN_HEIGHT = 80;
const MACD_MAX_HEIGHT = 500;
function loadMacdLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(MACD_LAYOUT_STORAGE_KEY) || 'null');
    return Object.assign({}, MACD_LAYOUT_FACTORY_DEFAULT, saved);
  } catch (e) { return Object.assign({}, MACD_LAYOUT_FACTORY_DEFAULT); }
}
let macdLayout = loadMacdLayout();
function persistMacdLayout() {
  try { localStorage.setItem(MACD_LAYOUT_STORAGE_KEY, JSON.stringify(macdLayout)); } catch (e) {}
}
function applyMacdLayout() {
  const el = document.getElementById('macd-chart-container');
  if (!el) return;
  el.style.height = macdLayout.height + 'px';
  el.style.order = String(paneOrderValue(macdLayout));
  const handle = document.getElementById('macd-resize-handle');
  if (handle) {
    if (macdLayout.position === 'top') { handle.style.top = 'auto'; handle.style.bottom = '0'; }
    else { handle.style.top = '0'; handle.style.bottom = 'auto'; }
  }
  if (macdChart) macdChart.applyOptions({ width: macdChartEl.clientWidth, height: macdChartEl.clientHeight });
}
// Resizes the main chart too (shared flex column) and refreshes overlays -
// same as resizeChartsForRsiLayout. Only called from user-triggered paths.
function resizeChartsForMacdLayout() {
  applyMacdLayout();
  chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  renderEarningsOverlay();
  mainPane.refreshOverlay();
  if (rsiChart) rsiPane.refreshOverlay();
  positionDailyBox();
}
(function setupMacdResize() {
  const handle = document.getElementById('macd-resize-handle');
  if (!handle) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = macdLayout.height;
    const onMove = (ev) => {
      const dy = ev.clientY - startY;
      const delta = macdLayout.position === 'top' ? dy : -dy;
      macdLayout.height = Math.max(MACD_MIN_HEIGHT, Math.min(MACD_MAX_HEIGHT, startHeight + delta));
      resizeChartsForMacdLayout();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      persistMacdLayout();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

let rsiUpperHandle = null, rsiLowerHandle = null, rsiMiddleHandle = null;

// (Re)applies rsiSettings to the current rsiSeries - the line's own
// style, and each reference line (removing/recreating it, since
// LightweightCharts price lines don't support toggling visibility
// directly - see the same pattern used for hline drawings elsewhere in
// this file). Called once when RSI's chart is (re)created, and again
// any time a setting changes in the panel.
function applyRsiSettings() {
  if (!rsiSeries) return;
  rsiSeries.applyOptions({
    color: rsiSettings.line.color,
    lineWidth: rsiSettings.line.lineWidth,
    lineStyle: LINE_STYLE_MAP[rsiSettings.line.lineStyle],
  });
  // Independently configurable via the "Extension Line" section of this
  // same settings panel - not derived from the real RSI line's own
  // color/width/style, so it can be tuned freely.
  if (rsiExtensionSeries) {
    rsiExtensionSeries.applyOptions({
      color: rsiSettings.extension.color,
      lineWidth: rsiSettings.extension.lineWidth,
      lineStyle: LINE_STYLE_MAP[rsiSettings.extension.lineStyle],
    });
  }

  if (rsiUpperHandle) { rsiSeries.removePriceLine(rsiUpperHandle); rsiUpperHandle = null; }
  if (rsiSettings.upper.enabled) {
    rsiUpperHandle = rsiSeries.createPriceLine({
      price: rsiSettings.upper.value, color: rsiSettings.upper.color,
      lineWidth: rsiSettings.upper.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.upper.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
  if (rsiMiddleHandle) { rsiSeries.removePriceLine(rsiMiddleHandle); rsiMiddleHandle = null; }
  if (rsiSettings.middle.enabled) {
    rsiMiddleHandle = rsiSeries.createPriceLine({
      price: rsiSettings.middle.value, color: rsiSettings.middle.color,
      lineWidth: rsiSettings.middle.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.middle.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
  if (rsiLowerHandle) { rsiSeries.removePriceLine(rsiLowerHandle); rsiLowerHandle = null; }
  if (rsiSettings.lower.enabled) {
    rsiLowerHandle = rsiSeries.createPriceLine({
      price: rsiSettings.lower.value, color: rsiSettings.lower.color,
      lineWidth: rsiSettings.lower.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.lower.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
}

function createRsiChart() {
  applyRsiLayout();
  rsiChartEl.innerHTML = ''; // clean slate in case a previous instance left anything behind
  rsiChart = LightweightCharts.createChart(rsiChartEl, {
    layout: {
      background: { color: '#ffffff' },
      textColor: '#131722',
      fontFamily: "-apple-system, 'Trebuchet MS', Roboto, Helvetica, Arial, sans-serif",
    },
    grid: {
      vertLines: { visible: false },
      horzLines: { visible: false },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#e0e3eb', minimumWidth: 64 }, // see main chart's note on minimumWidth
    timeScale: { visible: false },
    width: rsiChartEl.clientWidth,
    height: rsiChartEl.clientHeight,
  });
  rsiSeries = rsiChart.addLineSeries({
    priceLineVisible: false,
    lastValueVisible: false,
    autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
  });
  // Style set in applyRsiSettings() below, so it stays in sync with
  // whatever the user has RSI's own line color set to.
  rsiExtensionSeries = rsiChart.addLineSeries({
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
  });
  rsiUpperHandle = null; rsiLowerHandle = null; rsiMiddleHandle = null;
  applyRsiSettings();

  // Syncs pan/zoom with every other pane via the shared broadcastRange.
  // The same-TF-passthrough vs. cross-TF calendar-conversion logic, the
  // in-progress guard, and the deferred reset all live in
  // broadcastRange/applyCrossPaneRange now (see their comments) - this
  // subscription just says "when RSI's range changes, broadcast it".
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(range => broadcastRange(rsiSyncPane, range));

  loadRsiData(rsiTF);
}

// Fetches RSI's own data independently of whatever the main chart is
// currently showing, computes RSI(14) from it, and displays it. This
// is what powers RSI having its own timeframe selector.
function loadRsiData(tf) {
  rsiTF = tf;
  document.querySelectorAll('.rsi-tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === (rsiFollowChart ? 'chart' : tf)));
  if (!rsiChart) return;
  fetch(`${currentTicker.toLowerCase()}_${tf}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('rsi-no-data').classList.add('show');
        rsiSeries.setData([]);
        return;
      }
      document.getElementById('rsi-no-data').classList.remove('show');
      suppressSync = true;
      rsiBarsData = data;
      // The RSI line itself shouldn't run flat across the future
      // placeholder bars (same policy as the main chart's MAs), but the
      // chart still needs a whitespace point ({time} only, no value) for
      // each of them - same reasoning as the main chart's candlesticks
      // (see that comment in loadTimeframe) - otherwise this chart's
      // timeScale has literally no record of that time existing at all,
      // and any later setVisibleLogicalRange/setVisibleRange call
      // targeting a position in that space has nothing to anchor to.
      // Confirmed this was the actual root cause of RSI's pan/zoom sync
      // silently landing on the wrong range after a timeframe switch -
      // a genuine, reproducible bug, not a timing/settling issue.
      const rsiRealIdx = lastRealBarIndex(data);
      const rsiRealComputed = calculateRSI(data.slice(0, rsiRealIdx + 1), 14);
      rsiSeries.setData(rsiRealComputed.concat(data.slice(rsiRealIdx + 1).map(d => ({ time: d.time }))));
      // Bridges the gap to the main chart's current real boundary when
      // RSI's own timeframe is coarser and its current period hasn't
      // closed yet - see buildLastValueExtension's own comment. Guarded
      // on barsData actually having loaded - on initial page load, RSI's
      // OWN fetch (kicked off by createRsiChart(), early in the script)
      // can resolve before the main chart's loadTimeframe('daily') call
      // (much later in the script) does, leaving barsData still [] here.
      // barsData[lastRealBarIndex(barsData)] on an empty array is
      // undefined, and .time on that threw - caught by this function's
      // own .catch(), which showed the misleading "could not load"
      // status/no-data state even though rsiSeries.setData() just above
      // had already succeeded. loadTimeframe's own rsiTF === tf branch
      // recomputes this correctly once main's data actually arrives, so
      // skipping it here for that one moment is enough - confirmed this
      // was the actual cause of a real, reliably-reproducing bug, not
      // just a stale status message.
      if (barsData.length > 0) {
        rsiExtensionSeries.setData(buildLastValueExtension(
          rsiRealComputed[rsiRealComputed.length - 1],
          convertTimeBetweenTF(barsData[lastRealBarIndex(barsData)].time, currentTF, tf)
        ));
      }
      rsiPane.refreshForTimeframe();
      // Set RSI's initial view to match the main chart's CURRENT
      // calendar range (converted to RSI's own timeframe format), same
      // as the ongoing pan/zoom sync above - keeps this consistent
      // regardless of whether RSI's timeframe matches the main chart's.
      // Uses logicalIndexToTFTime (not getVisibleRange()) so this still
      // works correctly even if the main chart is currently zoomed out
      // past its own loaded data.
      const mainLogicalRange = chart.timeScale().getVisibleLogicalRange();
      const fromT = mainLogicalRange ? logicalIndexToTFTime(mainLogicalRange.from, barsData, currentTF) : null;
      const toT = mainLogicalRange ? logicalIndexToTFTime(mainLogicalRange.to, barsData, currentTF) : null;
      if (fromT != null && toT != null) {
        // timeToLogicalIndex + setVisibleLogicalRange rather than
        // setVisibleRange, called right after rsiSeries.setData() above -
        // see timeToLogicalIndex's own comment for why.
        const targetFrom = timeToLogicalIndex(convertTimeBetweenTF(fromT, currentTF, tf), data);
        const targetTo = timeToLogicalIndex(convertTimeBetweenTF(toT, currentTF, tf), data);
        rsiChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        // Same settle-then-reassert (2 frames AND a later timeout) as
        // loadTimeframe - see its own comment (and suppressSync's) for
        // why a single rAF isn't a wide enough window.
        const reassert = () => rsiChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        requestAnimationFrame(() => requestAnimationFrame(reassert));
        setTimeout(() => { reassert(); suppressSync = false; }, 250);
      } else {
        suppressSync = false;
      }
      updateOutputBox();
    })
    .catch(() => {
      document.getElementById('rsi-no-data').classList.add('show');
      setStatus(`Could not load ${currentTicker.toLowerCase()}_${tf}.json for RSI.`, true);
    });
}

document.querySelectorAll('.rsi-tf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.tf === 'chart') { rsiFollowChart = true; loadRsiData(currentTF); }
    else { rsiFollowChart = false; loadRsiData(btn.dataset.tf); }
  });
});

// ============================ MACD pane ============================
// The second indicator pane. Structurally a near-clone of the RSI pane
// (own chart instance, own timeframe, whitespace-padded future region,
// participates in the shared broadcastRange sync) - built this way
// deliberately to see how much of the RSI machinery actually generalizes.
// What reused cleanly: applyCrossPaneRange/broadcastRange (sync),
// lastRealBarIndex + the whitespace-padding pattern (future space),
// calculateEMA (the math), convertTimeBetweenTF/timeToLogicalIndex/
// logicalIndexToTFTime (the init-view positioning). What is still
// RSI-specific and had to be hand-mirrored rather than shared: the
// data-load + init-view function (loadMacdData ~= loadRsiData), the
// loadTimeframe recompute+reassert blocks, and switchTicker's reload.
// See CHART_HANDOFF.md for the full parity accounting.

// MACD line = fastEMA - slowEMA (of close); signal = EMA of the MACD
// line; histogram = MACD - signal. Computed over whatever bars are
// passed (callers pass REAL bars only, then whitespace-pad the future).
function calculateMACD(bars, fast = 12, slow = 26, signalPeriod = 9) {
  if (!bars.length) return { macd: [], signal: [], hist: [] };
  const emaFast = calculateEMA(bars, fast);
  const emaSlow = calculateEMA(bars, slow);
  const macd = bars.map((b, i) => ({ time: b.time, value: emaFast[i].value - emaSlow[i].value }));
  // Signal is an EMA of the MACD line itself - seeded the same way
  // calculateEMA seeds (first value = first point), kept inline since
  // calculateEMA works on bar objects with a named price field, not on
  // an already-computed {time,value} series.
  const k = 2 / (signalPeriod + 1);
  let prev = null;
  const signal = macd.map(m => {
    prev = prev === null ? m.value : m.value * k + prev * (1 - k);
    return { time: m.time, value: prev };
  });
  // Histogram carries no color here - color is applied at paint time
  // (paintMacdHist) from macdSettings, so a live color change in the
  // settings panel can re-tint the existing bars without recomputing.
  const hist = macd.map((m, i) => ({ time: m.time, value: m.value - signal[i].value }));
  return { macd, signal, hist };
}

// --- MACD's own settings: the MACD line, the signal line (each with
// color/thickness/line-type), and the histogram's up/down bar colors.
// Mirrors the RSI settings machinery (rsiSettings_v1) but for MACD.
// Persisted separately under macdSettings_v1. ---
const MACD_SETTINGS_STORAGE_KEY = 'macdSettings_v1';
const MACD_SETTINGS_FACTORY_DEFAULT = {
  macd:   { color: '#2962ff', lineWidth: 2, lineStyle: 'solid' },
  signal: { color: '#ff6d00', lineWidth: 1, lineStyle: 'solid' },
  hist:   { upColor: '#26a69a', downColor: '#ef5350' },
};
function loadMacdSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(MACD_SETTINGS_STORAGE_KEY) || 'null');
    return {
      macd:   Object.assign({}, MACD_SETTINGS_FACTORY_DEFAULT.macd,   saved && saved.macd),
      signal: Object.assign({}, MACD_SETTINGS_FACTORY_DEFAULT.signal, saved && saved.signal),
      hist:   Object.assign({}, MACD_SETTINGS_FACTORY_DEFAULT.hist,   saved && saved.hist),
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(MACD_SETTINGS_FACTORY_DEFAULT));
  }
}
let macdSettings = loadMacdSettings();
function persistMacdSettings() {
  try { localStorage.setItem(MACD_SETTINGS_STORAGE_KEY, JSON.stringify(macdSettings)); } catch (e) {}
}

// The last computed histogram values (no color) - kept so a settings
// change can re-tint the bars without refetching/recomputing.
let macdHistRaw = [];
function paintMacdHist(hist) {
  macdHistRaw = hist;
  if (!macdHistSeries) return;
  macdHistSeries.setData(hist.map(h => ({
    time: h.time, value: h.value,
    color: h.value >= 0 ? macdSettings.hist.upColor : macdSettings.hist.downColor,
  })));
}

// (Re)applies macdSettings to the live series - line color/width/style
// via applyOptions, histogram via a re-tint of the stored raw values.
function applyMacdSettings() {
  if (macdLineSeries) macdLineSeries.applyOptions({
    color: macdSettings.macd.color, lineWidth: macdSettings.macd.lineWidth,
    lineStyle: LINE_STYLE_MAP[macdSettings.macd.lineStyle],
  });
  if (macdSignalSeries) macdSignalSeries.applyOptions({
    color: macdSettings.signal.color, lineWidth: macdSettings.signal.lineWidth,
    lineStyle: LINE_STYLE_MAP[macdSettings.signal.lineStyle],
  });
  if (macdHistSeries) paintMacdHist(macdHistRaw);
}

function createMacdChart() {
  applyMacdLayout(); // apply saved height/position before (re)creating the chart
  macdChartEl.innerHTML = '';
  macdChart = LightweightCharts.createChart(macdChartEl, {
    layout: {
      background: { color: '#ffffff' },
      textColor: '#131722',
      fontFamily: "-apple-system, 'Trebuchet MS', Roboto, Helvetica, Arial, sans-serif",
    },
    grid: { vertLines: { visible: false }, horzLines: { visible: false } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#e0e3eb', minimumWidth: 64 }, // see main chart's note on minimumWidth
    timeScale: { visible: false },
    width: macdChartEl.clientWidth,
    height: macdChartEl.clientHeight,
  });
  // Histogram added FIRST so the two lines render on top of it. MACD
  // auto-scales around zero (unlike RSI's fixed 0-100), so no
  // autoscaleInfoProvider - the library's own auto-fit is what we want.
  macdHistSeries = macdChart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
  macdLineSeries = macdChart.addLineSeries({
    color: '#2962ff', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  });
  macdSignalSeries = macdChart.addLineSeries({
    color: '#ff6d00', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  });
  // MACD's half of the sync - same one line as RSI's now (see
  // broadcastRange). This runs inside createMacdChart so it re-subscribes
  // if the chart is ever torn down and recreated, same as RSI.
  macdChart.timeScale().subscribeVisibleLogicalRangeChange(range => broadcastRange(macdSyncPane, range));
  applyMacdSettings();  // apply any saved line styles to the fresh series
  loadMacdData(macdTF);
}

// Fetches MACD's own data independently of the main chart (its own
// timeframe selector), computes MACD, and displays it - the direct
// mirror of loadRsiData. Whitespace-pads the future region on the two
// LINE series (so this chart's timeScale reserves that time and sync
// positioning has something to anchor to - CHART_HANDOFF.md Section 7
// point 5); the histogram is real-bars-only, like the volume panel.
function loadMacdData(tf) {
  macdTF = tf;
  document.querySelectorAll('.macd-tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === (macdFollowChart ? 'chart' : tf)));
  if (!macdChart) return;
  fetch(`${currentTicker.toLowerCase()}_${tf}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('macd-no-data').classList.add('show');
        macdLineSeries.setData([]); macdSignalSeries.setData([]); macdHistSeries.setData([]);
        return;
      }
      document.getElementById('macd-no-data').classList.remove('show');
      suppressSync = true;
      macdBarsData = data;
      const realIdx = lastRealBarIndex(data);
      const realData = data.slice(0, realIdx + 1);
      const { macd, signal, hist } = calculateMACD(realData);
      const future = data.slice(realIdx + 1).map(d => ({ time: d.time }));
      macdLineSeries.setData(macd.concat(future));
      macdSignalSeries.setData(signal.concat(future));
      paintMacdHist(hist);
      // Initial view = the main chart's current calendar window converted
      // into MACD's own timeframe - identical approach to loadRsiData
      // (logicalIndexToTFTime, not getVisibleRange, so it's correct even
      // if main is zoomed past its own data; guarded on barsData having
      // loaded, since on first page-load MACD's fetch can resolve before
      // the main chart's does). loadTimeframe's own macdTF===tf branch
      // recomputes correctly once main's data arrives.
      const mainLogicalRange = chart.timeScale().getVisibleLogicalRange();
      const fromT = (mainLogicalRange && barsData.length) ? logicalIndexToTFTime(mainLogicalRange.from, barsData, currentTF) : null;
      const toT = (mainLogicalRange && barsData.length) ? logicalIndexToTFTime(mainLogicalRange.to, barsData, currentTF) : null;
      if (fromT != null && toT != null) {
        const targetFrom = timeToLogicalIndex(convertTimeBetweenTF(fromT, currentTF, tf), data);
        const targetTo = timeToLogicalIndex(convertTimeBetweenTF(toT, currentTF, tf), data);
        macdChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        // Same settle-then-reassert as loadRsiData/loadTimeframe.
        const reassert = () => macdChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        requestAnimationFrame(() => requestAnimationFrame(reassert));
        setTimeout(() => { reassert(); suppressSync = false; }, 250);
      } else {
        suppressSync = false;
      }
    })
    .catch(() => {
      document.getElementById('macd-no-data').classList.add('show');
      setStatus(`Could not load ${currentTicker.toLowerCase()}_${tf}.json for MACD.`, true);
    });
}
