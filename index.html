function calculateRSI(bars, period = 14) {
  const out = [];
  let avgGain = null, avgLoss = null;
  for (let i = 0; i < bars.length; i++) {
    if (i === 0) {
      // RSI is undefined for the very first bar (no prior close to diff
      // against), but the series still needs a point at bars[0] so its
      // logical index 0 lines up with bars[0] - same as the main chart
      // and MACD. WITHOUT this leading whitespace, RSI's data started at
      // bars[1], shifting its whole logical index by one, so a same-TF
      // range passthrough landed RSI one bar off from the other panes
      // (the persistent "RSI out of sync by 1 bar" - main/MACD compute a
      // value for every bar so they were never shifted). A whitespace
      // point ({time} only, no value) reserves the slot and draws nothing.
      out.push({ time: bars[i].time });
      continue;
    }
    const change = bars[i].close - bars[i - 1].close;
    const gain = Math.max(change, 0);
    const loss = Math.max(-change, 0);
    if (avgGain === null) {
      avgGain = gain;
      avgLoss = loss;
    } else {
      avgGain = (avgGain * (period - 1) + gain) / period;
      avgLoss = (avgLoss * (period - 1) + loss) / period;
    }
    const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
    const rsi = avgLoss === 0 ? 100 : 100 - 100 / (1 + rs);
    out.push({ time: bars[i].time, value: rsi });
  }
  return out;
}

const TIMEFRAME_META = {
  m5:        { intraday: true,  label: '5-Minute', short: '5m' },
  m15:       { intraday: true,  label: '15-Minute', short: '15m' },
  hourly:    { intraday: true,  label: 'Hourly', short: '1H' },
  daily:     { intraday: false, label: 'Daily', short: 'D' },
  weekly:    { intraday: false, label: 'Weekly', short: 'W' },
  monthly:   { intraday: false, label: 'Monthly', short: 'M' },
  quarterly: { intraday: false, label: 'Quarterly', short: 'Q' },
};

// Ordered lowest-to-highest, used by the "relative timeframe" column
// (3 higher / 2 higher / 1 higher / current only / 1 lower / 2 lower /
// 3 lower) to compute an offset from a drawing's home timeframe. Reuses
// the same TF_ORDER already defined above for the Relative M10s EMAs.

// New drawings show on every timeframe by default - this returns a
// fresh {tfKey: true, ...} object for each one (never share a single
// object across drawings, or unchecking one box would affect them all).
function defaultTimeframes() {
  const out = {};
  for (const key of Object.keys(TIMEFRAME_META)) out[key] = true;
  return out;
}

// Default relative-timeframe state: "2 higher" and "2 lower" both
// ticked (each side is radio-style/single-tick, but the two sides are
// independent of each other, so both can be on at once). A single
// tick per side rather than everything ticked at once (which looked
// like a real selection but wasn't a state any actual click could
// produce - confusing on a freshly-drawn shape). Since a range always
// includes the home timeframe it's measured from (see matchesRelativeTF
// below), this default still shows on the timeframe the drawing was
// drawn on, plus 1-2 higher and 1-2 lower.
function defaultRelativeTF() {
  return {
    current: false,
    higher1: false, higher2: true, higher3: false,
    lower1: false, lower2: true, lower3: false,
  };
}

// Whether a drawing's relative-timeframe column matches `tfKey`, given
// its fixed home timeframe (the timeframe active when it was created -
// this never changes, so "1 higher" etc. always means the same actual
// timeframe for a given drawing regardless of what's currently being
// viewed elsewhere). Missing relativeTF/homeTF (older drawings, or the
// feature never touched) imposes no restriction.
//
// "higherN"/"lowerN" are CUMULATIVE ranges, not single offsets -
// checking "3 higher" means "everything from home up to 3 higher"
// (covers +1, +2, and +3), not just the exact +3 timeframe in
// isolation. Matching uses whichever checked box has the LARGEST N on
// each side. The panel's own UI shows this as a radio-button-style
// single tick per side (picking "3" unticks "1"/"2" visually, since
// showing three ticked boxes for one range was confusing) - taking the
// max here means the meaning is identical either way, and this also
// still works correctly on older data saved before that UI change.
//
// Home itself (offset 0) matches if "current" is explicitly picked, OR
// if ANY higher/lower range is picked - a range is measured FROM home,
// so "2 higher" means "home plus up to 2 higher," not "2 higher,
// excluding home." "current" alone (no range picked) means "only
// home, nothing else."
function matchesRelativeTF(drawing, tfKey) {
  if (!drawing.relativeTF || !drawing.homeTF) return true;
  const homeIdx = TF_ORDER.indexOf(drawing.homeTF);
  const targetIdx = TF_ORDER.indexOf(tfKey);
  if (homeIdx === -1 || targetIdx === -1) return true;
  const offset = targetIdx - homeIdx;
  const rel = drawing.relativeTF;
  if (offset === 0) {
    const anyRangePicked = [1, 2, 3].some((n) => rel['higher' + n] !== false || rel['lower' + n] !== false);
    return rel.current !== false || anyRangePicked;
  }
  const side = offset > 0 ? 'higher' : 'lower';
  let maxChecked = 0;
  for (const n of [1, 2, 3]) {
    if (rel[side + n] !== false) maxChecked = n;
  }
  return Math.abs(offset) <= maxChecked;
}

// --- Per-tool-type "default" settings (Set as Default / Restore
// Default, in both the Style and Timeframe panels) ---
// Each of the 4 line tools (trendline/ray/hray/hline) remembers its OWN
// style default and its OWN timeframe default, independently - saving
// a style default for Ray doesn't touch Trend Line's, and saving a
// style default doesn't touch that tool's timeframe default or vice
// versa. Persisted to localStorage so it survives a page reload, not
// just this session; shared between the main chart and RSI panes,
// since it's about the TOOL, not which pane you happened to draw in.
const TOOL_DEFAULTS_STORAGE_KEY = 'chartToolDefaults_v1';

function loadToolDefaults() {
  try {
    const raw = localStorage.getItem(TOOL_DEFAULTS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    // localStorage can throw (private/incognito browsing, storage
    // disabled, quota) - fall back to an empty in-memory store so the
    // feature still works for this session, just without persistence.
    return {};
  }
}

let toolDefaultsCache = loadToolDefaults();

function persistToolDefaults() {
  try {
    localStorage.setItem(TOOL_DEFAULTS_STORAGE_KEY, JSON.stringify(toolDefaultsCache));
  } catch (e) {
    // Same as above - saving is best-effort, not required for the
    // feature to keep working within this session.
  }
}

const FACTORY_STYLE_DEFAULT_SHAPE = { color: '#2962ff', opacity: 1, lineWidth: 2, lineStyle: 'solid' };
const FACTORY_STYLE_DEFAULT_HLINE = { color: 'blue', colorHex: '#2962ff', opacity: 1, lineWidth: 2, lineStyle: 'solid' };

// Merges any saved style default over the built-in factory one, for
// the given tool type ('trendline'/'ray'/'hray'/'hline').
function getEffectiveStyleDefault(toolType) {
  const saved = toolDefaultsCache[toolType] && toolDefaultsCache[toolType].style;
  const factory = toolType === 'hline' ? FACTORY_STYLE_DEFAULT_HLINE : FACTORY_STYLE_DEFAULT_SHAPE;
  return Object.assign({}, factory, saved || {});
}

function setToolStyleDefault(toolType, styleObj) {
  toolDefaultsCache[toolType] = toolDefaultsCache[toolType] || {};
  toolDefaultsCache[toolType].style = styleObj;
  persistToolDefaults();
}

// Merges any saved timeframe default over the built-in factory one.
// Always returns FRESH timeframes/relativeTF objects (never a shared
// reference to the cached default), since each drawing needs its own
// independent copy - sharing one object across drawings would mean
// editing one drawing's checkboxes silently changes them all.
function getEffectiveTimeframeDefault(toolType) {
  const saved = toolDefaultsCache[toolType] && toolDefaultsCache[toolType].timeframe;
  return {
    timeframes: Object.assign({}, defaultTimeframes(), saved && saved.timeframes),
    // Off by default - only the "relative to home" column restricts a
    // new drawing's visibility out of the box; the absolute "Show on"
    // column is available but starts bypassed until explicitly turned
    // on (or a saved default says otherwise).
    timeframesColumnEnabled: saved && saved.timeframesColumnEnabled !== undefined ? saved.timeframesColumnEnabled : false,
    relativeTF: Object.assign({}, defaultRelativeTF(), saved && saved.relativeTF),
    relativeTFColumnEnabled: saved && saved.relativeTFColumnEnabled !== undefined ? saved.relativeTFColumnEnabled : true,
  };
}

function setToolTimeframeDefault(toolType, tfObj) {
  toolDefaultsCache[toolType] = toolDefaultsCache[toolType] || {};
  toolDefaultsCache[toolType].timeframe = tfObj;
  persistToolDefaults();
}


let markers = [];
let crossoverPoints = [];
let closeAbovePoints = [];
let watchlistData = [];
let currentVolumeEma3 = [];
let currentVolumeEma20 = [];

function formatVolume(value) {
  if (value == null || isNaN(value)) return '—';
  const abs = Math.abs(value);
  if (abs >= 1e9) return (value / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (value / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (value / 1e3).toFixed(2) + 'K';
  return value.toFixed(0);
}

// Updates the LT/AT(3)/AT(20) box for whichever bar index is given.
// Called with the last bar by default, and from the crosshair-move
// handler below whenever the user hovers a different bar.
// Updates the ticker/timeframe header line to reflect whichever bar the
// crosshair is over (or the latest bar by default): change and % change
// vs. that bar's own PREVIOUS close (not the start of the visible
// range), the bar's total range INCLUDING any overnight gap from the
// prior close, and that bar's volume.
// Finds the index of the last REAL bar in a bars array - now that
// every timeframe's data extends past "today" with flat, zero-volume
// placeholder bars (giving blank chart space to draw into, with known
// future earnings dates marked on it), `array.length - 1` no longer
// reliably means "the latest actual trading bar." Scans backward from
// the end for the first bar that isn't a flat placeholder. Falls back
// to the true last index if every bar looks like a placeholder (an
// all-zero-volume array, or an empty one), so callers can still safely
// index into it without a separate empty check.
function lastRealBarIndex(bars) {
  for (let i = bars.length - 1; i >= 0; i--) {
    if (bars[i].volume !== 0) return i;
  }
  return bars.length - 1;
}

function updateHeadlineStats(index) {
  const bar = barsData[index];
  if (!bar) return;
  const prevBar = barsData[index - 1];
  const prevClose = prevBar ? prevBar.close : bar.open;
  const change = bar.close - prevClose;
  const pct = (change / prevClose) * 100;
  const rangeWithGap = prevBar
    ? Math.max(bar.high, prevBar.close) - Math.min(bar.low, prevBar.close)
    : bar.high - bar.low;
  const sign = change >= 0 ? '+' : '-';
  const label = TIMEFRAME_META[currentTF].label;
  document.getElementById('legend-headline').innerHTML =
    `${currentTicker} · ${label} &nbsp; ${sign}${Math.abs(change).toFixed(2)} (${sign}${Math.abs(pct).toFixed(2)}%)` +
    ` &nbsp; ${sign}${rangeWithGap.toFixed(2)} &nbsp; Vol: ${formatVolume(bar.volume)}`;
}

function updateTurnoverBox(index) {
  const bar = barsData[index];
  if (!bar) return;
  document.getElementById('turnover-lt').textContent = formatVolume(bar.volume);
  document.getElementById('turnover-at3').textContent = formatVolume(currentVolumeEma3[index] ? currentVolumeEma3[index].value : null);
  document.getElementById('turnover-at20').textContent = formatVolume(currentVolumeEma20[index] ? currentVolumeEma20[index].value : null);
}

// A dot wherever line A crosses line B between consecutive bars. Shared by both
// event indicators: the EMA 10/20 cross (ema_10 vs ema_20, either direction)
// and Close-above-20-EMA (close vs ema_20, upward only). We keep the four
// values around the crossing and solve for the exact intersection at RENDER
// time in PIXEL space (see renderEventOverlay). Doing it in pixel space - not
// price space - is what makes the dot land on the crossing regardless of the
// (logarithmic) price scale: the chart draws the lines as straight pixel
// segments, and a price-space interpolation converted to a coordinate does NOT
// lie on that segment on a log scale (it was off by ~16px vertically).
function computeCrossPoints(data, keyA, keyB, upOnly) {
  const out = [];
  for (let i = 1; i < data.length; i++) {
    const pa = data[i - 1][keyA], pb = data[i - 1][keyB];
    const ca = data[i][keyA], cb = data[i][keyB];
    if (pa == null || pb == null || ca == null || cb == null) continue;
    const up = pa <= pb && ca > cb;
    const down = pa >= pb && ca < cb;
    if (upOnly ? !up : !(up || down)) continue;
    out.push({ prevTime: data[i - 1].time, time: data[i].time, pa, pb, ca, cb });
  }
  return out;
}

// Builds the marker glyph as inline SVG so any shape is possible - including
// the cross/X, which the native marker system (circle/square/arrows only)
// can't draw.
function crossoverShapeSVG(shape, color) {
  const a = 'width="100%" height="100%" viewBox="0 0 10 10" preserveAspectRatio="xMidYMid meet"';
  switch (shape) {
    case 'square':    return `<svg ${a}><rect x="1" y="1" width="8" height="8" fill="${color}"/></svg>`;
    case 'arrowUp':   return `<svg ${a}><polygon points="5,1 1,9 9,9" fill="${color}"/></svg>`;
    case 'arrowDown': return `<svg ${a}><polygon points="1,1 9,1 5,9" fill="${color}"/></svg>`;
    case 'cross':     return `<svg ${a}><path d="M2,2 L8,8 M8,2 L2,8" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/></svg>`;
    case 'plus':      return `<svg ${a}><path d="M5,1 L5,9 M1,5 L9,5" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/></svg>`;
    case 'circle':
    default:          return `<svg ${a}><circle cx="5" cy="5" r="4" fill="${color}"/></svg>`;
  }
}
// Positions a styled marker at every crossing in `points`, at the exact PIXEL
// intersection of the two segments (immune to the log scale). Shared by both
// event overlays; `styleId` selects colour/shape/size from indicatorStyles.
function renderEventOverlay(containerId, points, visible, styleId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  if (!visible || !points.length || !barsData.length) return;
  const st = indicatorStyles[styleId];
  const px = 6 + (st.size || 1) * 3; // size 1..4 -> 9..18px
  const priceScaleWidth = chart.priceScale('right').width();
  const maxX = chartEl.clientWidth - priceScaleWidth;
  const ts = chart.timeScale();
  // Any series on the right price scale converts price->y identically.
  const toY = (price) => emaSeries.ema_10.priceToCoordinate(price);
  for (const pt of points) {
    const xPrev = ts.timeToCoordinate(pt.prevTime);
    const xCur = ts.timeToCoordinate(pt.time);
    const ypa = toY(pt.pa), yca = toY(pt.ca), ypb = toY(pt.pb), ycb = toY(pt.cb);
    let x, y;
    if (xPrev !== null && xCur !== null &&
        ypa !== null && yca !== null && ypb !== null && ycb !== null) {
      // Intersect the two drawn PIXEL segments A:(xPrev,ypa)->(xCur,yca) and
      // B:(xPrev,ypb)->(xCur,ycb). s is the fraction along the shared x-span
      // where their y's meet - the exact on-screen crossing.
      const denom = (yca - ypa) - (ycb - ypb);
      let s = denom !== 0 ? (ypb - ypa) / denom : 0;
      s = Math.max(0, Math.min(1, s));
      x = xPrev + s * (xCur - xPrev);
      y = ypa + s * (yca - ypa);
    } else {
      // Crossing straddles the visible edge: anchor on whichever bar is on
      // screen rather than dropping the dot entirely.
      x = (xCur !== null) ? xCur : xPrev;
      y = (xCur !== null) ? yca : ypa;
    }
    if (x === null || y === null || x < 0 || x > maxX) continue;
    const el = document.createElement('div');
    el.className = 'crossover-marker';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = px + 'px';
    el.style.height = px + 'px';
    el.innerHTML = crossoverShapeSVG(st.shape, st.color);
    container.appendChild(el);
  }
}
function renderCrossoverOverlay() {
  renderEventOverlay('crossover-overlay', crossoverPoints, crossoverVisible, 'ema_cross');
}
function renderCloseAboveOverlay() {
  renderEventOverlay('close-above-overlay', closeAbovePoints, closeAboveVisible, 'close_above_20');
}
function renderEventOverlaysNow() {
  renderCrossoverOverlay();
  renderCloseAboveOverlay();
}

// Renders both event overlays now AND again after the chart repaints. The dots'
// Y is a PRICE coordinate, and a visible-range-change fires its subscription
// synchronously BEFORE the chart repaints its (auto-scaled) vertical axis - so
// a render in that callback uses the pre-repaint scale and lands ~one frame
// stale. The double-rAF re-render runs after the repaint has settled the price
// scale, so the dots snap onto the crossing. Debounced so a burst of pan/zoom
// events only schedules one settle pass.
let eventOverlaySettleRaf = null;
function refreshEventOverlays() {
  renderEventOverlaysNow();
  if (eventOverlaySettleRaf !== null) cancelAnimationFrame(eventOverlaySettleRaf);
  eventOverlaySettleRaf = requestAnimationFrame(() => {
    eventOverlaySettleRaf = requestAnimationFrame(() => {
      eventOverlaySettleRaf = null;
      renderEventOverlaysNow();
    });
  });
}

// Manual (user/Claude-added) markers stay on the candlestick series,
// since aboveBar/belowBar positioning is meant relative to a candle.
// Crossover dots live separately on the EMA 10 line - see above.
function refreshMarkers() {
  const manual = markers.map(m => ({ time: m.time, position: m.position, shape: m.shape, color: m.color, text: m.text }));
  series.setMarkers(manual);
}

// Matches each earnings date to the bar it falls within (exact match
// for daily bars, nearest prior bar for weekly/monthly/quarterly since
// those bars span a whole period rather than a single day). Only shown
// on daily-and-above timeframes - not intraday, where "which bar"
// stops being a meaningful question for a single earnings date.
function findEarningsBarTimes(data) {
  const entries = earningsData[currentTicker];
  if (!entries) return [];
  const out = [];
  for (const e of entries) {
    for (let i = data.length - 1; i >= 0; i--) {
      if (data[i].time <= e.date) { out.push(data[i].time); break; }
    }
  }
  return out;
}

// Draws earnings triangles as plain HTML elements positioned at an
// exact pixel distance from the bottom of the chart - NOT using
// Lightweight Charts' own marker/scale system. After repeated attempts
// to get a consistent fixed height using the library's built-in scale
// margins didn't produce predictable, verifiable results, this gives
// direct control: the X position comes from the chart's own
// time-to-pixel conversion (so it stays correctly aligned with the
// data), but the Y position is a plain, fixed CSS value - guaranteed
// to always be the same distance from the bottom, regardless of
// ticker, timeframe, or how Lightweight Charts internally scales
// anything else.
function renderEarningsOverlay() {
  const container = document.getElementById('earnings-overlay');
  container.innerHTML = '';
  if (!earningsVisible || !barsData.length) return;
  if (TIMEFRAME_META[currentTF].intraday) return;

  // The right edge of the actual PLOTTABLE chart area sits before the
  // price-axis label gutter (e.g. "15.42"), not at the full width of
  // the chart element - that gutter is included in chartEl's own
  // width. Also leaving room for the badge's own rendered width (it's

}

// =====================================================================
// Rich Road Candles - per-candle recolouring by classification
// ---------------------------------------------------------------------
// Classifies each REAL candle into one of six types and recolours it
// (body + border + wick) accordingly, via per-bar colour fields on the
// candlestick series (paintCandles). Every threshold AND every colour is
// user-adjustable in the Rich Road settings panel (renderRichRoadPanel).
//
// NOTE ON INTERPRETATION (the source criteria are partly qualitative, so
// these are sensible, fully-adjustable defaults):
//   - "move" = the candle BODY move, (close-open)/open*100 (signed).
//   - "body ratio" = |close-open| / (high-low).
//   - "open within X% of the low" = (open-low)/low*100 <= wick tolerance.
//   - Precedence (first match wins): Red CB (bearish >= redMove) -> High CB
//     -> Low CB -> DC -> DC2 (close above EMA10 or EMA20) -> Neutral CB.
// =====================================================================
const RICHROAD_KEY = 'richRoadCandles_v1';
const RICHROAD_FACTORY = {
  enabled: true,
  // All six types ON so EVERY candle is painted by Rich Road (otherwise a
  // disabled type falls back to the plain candlestick look - white up /
  // red down - which is misleading). During this definition phase only the
  // type we're actively working on keeps its real colour; the rest are set
  // to white below so the worked-on type stands out. Restore each real
  // colour as we finalize that type.
  enabledTypes: { highCB: true, lowCB: true, dc: true, dc2: true, redCB: true, neutralCB: true },
  // Per-type volume requirement (High CB / Low CB only). Off by default so
  // classification matches the original RichRoad MA v3 (which has no volume
  // filter); it's a user-added enhancement, toggleable per type in the panel.
  // When on, that type only qualifies if the bar ALSO prints enough volume
  // on the day - see the volume gate in classifyCandle and the
  // volMultiplier / volEmaPeriod params below.
  useVolume: { highCB: false, lowCB: false },
  colors: {
    highCB:    '#ffffff', // real: #2e1a9c navy (validated) - white while testing DC
    lowCB:     '#ffffff', // real: #3d5afe blue (locked)    - white while testing DC
    dc:        '#43a047', // green - demand candle  <-- WORKING ON THIS
    dc2:       '#ffffff', // real: #12a186 (teal)  - white during definition phase
    redCB:     '#ffffff', // real: #f2334d (red)   - white during definition phase
    neutralCB: '#ffffff', // white - no conviction
  },
  params: {
    // Values below match the original "RichRoad MA v3" indicator's Inputs.
    highAutoMove:  9.5, // "High_CB Override % Change" - auto-qualifies High CB regardless of structure
    highMinMove:   4.8, // "High_CB Min % Change" - min move% for structural High CB
    highBodyRatio: 0.8, // "Strong Body Ratio" - min body-to-range ratio for High CB
    highWickTol:   5,   // "Open Near Low Tolerance %" - max (open-low)/low % for High CB
    lowMinMove:    3,   // min move% for Low CB
    dcBodyRatio:   0.7, // "Acceptable Body Ratio" - min body ratio for DC
    dcWickTol:     5,   // "Open Near Low Tolerance %" - max (open-low)/low % for DC
    redMove:       4,   // min down-move% for Red CB
    // Volume gate (High CB / Low CB, when their Require volume box is on):
    // the bar must print volume >= volMultiplier x its own volume EMA
    // (period volEmaPeriod) on the day. Both adjustable in the panel.
    volEmaPeriod:  20,
    volMultiplier: 1.5,
  },
};
function loadRichRoad() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(RICHROAD_KEY) || '{}') || {}; } catch (e) { saved = {}; }
  return {
    enabled: saved.enabled != null ? saved.enabled : RICHROAD_FACTORY.enabled,
    enabledTypes: Object.assign({}, RICHROAD_FACTORY.enabledTypes, saved.enabledTypes || {}),
    useVolume: Object.assign({}, RICHROAD_FACTORY.useVolume, saved.useVolume || {}),
    colors: Object.assign({}, RICHROAD_FACTORY.colors, saved.colors || {}),

// Returns one of the six colour keys for a real bar, or null if unclassifiable.
function classifyCandle(bar, volEma) {
  const { open, high, low, close, ema_10, ema_20, volume } = bar;
  if (open == null || close == null || high == null || low == null) return null;
  const p = richRoad.params;
  const range = high - low;
  const bodyRatio = range > 0 ? Math.abs(close - open) / range : 0;
  const movePct = open > 0 ? (close - open) / open * 100 : 0;      // signed body move
  const lowerWickPct = low > 0 ? (open - low) / low * 100 : 0;     // open above the low
  const bullish = close >= open;

  // Volume gate for a candle type. When that type's "Require volume" box
  // is on, the bar must print volume >= volMultiplier x its own volume EMA
  // (period volEmaPeriod) - volEma is that bar's precomputed EMA value,
  // passed in from paintCandles. Off, or missing volume data, means the
  // gate doesn't restrict.
  function volumeOk(typeKey) {
    if (!richRoad.useVolume[typeKey]) return true;
    if (volEma == null || volume == null) return false;
    return volume >= p.volMultiplier * volEma;
  }

  // High CB AUTO-QUALIFY: any candle whose body move is >= the auto
  // threshold is a High CB regardless of structure, volume, or anything
  // else. Checked first, so nothing below can override or gate it.
  if (movePct >= p.highAutoMove) return 'highCB';

  // Red CB: bearish with a down move >= threshold.
  if (!bullish && -movePct >= p.redMove) return 'redCB';

  if (bullish) {
    // High CB (structural): a move below the auto threshold, but with a
    // strong body opening near its low - and enough volume when required.
    // If the volume gate fails, it falls through to the checks below.
    if (volumeOk('highCB') && movePct >= p.highMinMove && bodyRatio >= p.highBodyRatio && lowerWickPct <= p.highWickTol) return 'highCB';
    // Low CB: moderate move (with its own optional volume requirement).
    if (movePct >= p.lowMinMove && volumeOk('lowCB')) return 'lowCB';
    // DC: below the move threshold but strong structure.
    if (bodyRatio >= p.dcBodyRatio && lowerWickPct <= p.dcWickTol) return 'dc';
  }
  // DC2: closes above the 10 or 20 EMA (breakout / continuation).
  if ((ema_10 != null && close > ema_10) || (ema_20 != null && close > ema_20)) return 'dc2';
  return 'neutralCB';
}

// (Re)builds the candlestick data - future bars as whitespace, real bars with

function paintCandles() {
  if (!barsData.length) return;
  const realIdx = lastRealBarIndex(barsData);
  // Volume EMA over the REAL bars at the user-set period - the volume gate
  // in classifyCandle compares each bar's volume against its own EMA value.
  // Computed here (not reusing currentVolumeEma20) so the Rich Road volume
  // period stays independent of the volume panel's own EMA.
  const realData = barsData.slice(0, realIdx + 1);
  const volEma = calculateEMA(realData, Math.max(1, Math.round(richRoad.params.volEmaPeriod || 20)), 'volume');
  const data = barsData.map((d, i) => {
    if (i > realIdx) return { time: d.time }; // future placeholder -> whitespace
    if (!richRoad.enabled) return d;
    const type = classifyCandle(d, volEma[i] ? volEma[i].value : null);
    // Skip if unclassified OR that type is switched off in the settings panel.
    if (!type || !richRoad.enabledTypes[type]) return d;
    // Colour fills the candle BODY; the outline (border) and wick stay black.
    return Object.assign({}, d, { color: richRoad.colors[type], borderColor: '#000000', wickColor: '#000000' });
  });
  series.setData(data);
}

// Rich Road settings panel (Set/Restore Default like RSI/MACD). Colours get a
// picker + the 12-swatch palette; thresholds get number inputs. All apply live.
let richRoadPanelOpen = false;
let richRoadPanelPos = null; // {x,y} where it was opened, so re-renders stay put
function renderRichRoadPanel(clientX, clientY) {
  // Panel attaches to <body> (like the other indicators' style popups), NOT
  // #richroad-overlay: that overlay lives inside the positioned main-chart-area,
  // so an absolutely-positioned child was measured from the chart's origin and
  // landed off-screen. On <body>, left/top are viewport-relative.
  const existing = document.getElementById('richroad-panel');
  if (existing) existing.remove();
  if (!richRoadPanelOpen) return;
  // Anchor at the cursor (like the other indicators' style popups), not centred.
  if (clientX != null && clientY != null) richRoadPanelPos = { x: clientX, y: clientY };
  const pos = richRoadPanelPos || { x: Math.round(window.innerWidth / 2), y: 90 };

  const panel = document.createElement('div');
  panel.id = 'richroad-panel';
  panel.className = 'drawing-settings-panel rsi-settings-panel settings-2col';
  panel.style.zIndex = '1000'; // sit above the legend / Indicators dropdown (like the style popups)
  panel.addEventListener('mousedown', (e) => e.stopPropagation());
  panel.addEventListener('click', (e) => e.stopPropagation());
  const dh = document.createElement('div');
  dh.className = 'panel-drag-handle'; dh.textContent = 'Rich Road Candles';
  panel.appendChild(dh); makeDraggable(panel, dh);

  const body = document.createElement('div');

  let section = null;
  function addSection(text) {

    section.appendChild(h); body.appendChild(section);

  function addRow(labelText, inputEl) {

  }
  // A candle type: an on/off checkbox (enabledTypes[key]) + colour picker + the
  // 12-swatch palette. Switching a type off leaves its candles at default.
  function addTypeRow(key, labelText) {
    // Name on its OWN line, then the checkbox + colour picker + palette
    // beneath it - all left-aligned to the same edge so every type's
    // colours start under the first letter of the name and span the same
    // width (uniform across rows), rather than being offset by the
    // varying name width in a label-left / controls-right layout.
    const block = document.createElement('div');
    block.style.marginBottom = '10px';
    const name = document.createElement('div');
    name.textContent = labelText;
    name.style.color = 'var(--text-dim)';
    name.style.marginBottom = '3px';
    block.appendChild(name);

    const top = document.createElement('div');
    top.style.display = 'flex'; top.style.alignItems = 'center'; top.style.gap = '6px'; top.style.marginBottom = '4px';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = richRoad.enabledTypes[key];
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = richRoad.colors[key]; ci.disabled = !richRoad.enabledTypes[key];
    let sync;
    cb.addEventListener('mousedown', (e) => e.stopPropagation());
    cb.addEventListener('change', () => { richRoad.enabledTypes[key] = cb.checked; ci.disabled = !cb.checked; paintCandles(); });
    ci.addEventListener('input', () => { richRoad.colors[key] = ci.value; sync(); paintCandles(); });
    top.appendChild(cb); top.appendChild(ci);

    const grid = document.createElement('div'); grid.className = 'color-swatch-grid';
    const els = [];
    sync = () => { const cur = (richRoad.colors[key] || '').toLowerCase(); els.forEach(e => e.classList.toggle('selected', e.dataset.color.toLowerCase() === cur)); };
    IND_PALETTE.forEach((hex) => {
      const sw = document.createElement('button'); sw.className = 'color-swatch';
      sw.style.background = hex; sw.dataset.color = hex; sw.title = hex;
      sw.addEventListener('mousedown', (e) => e.stopPropagation());
      sw.addEventListener('click', (e) => { e.stopPropagation(); if (!richRoad.enabledTypes[key]) return; ci.value = hex; richRoad.colors[key] = hex; sync(); paintCandles(); });
      els.push(sw); grid.appendChild(sw);
    });
    block.appendChild(top); block.appendChild(grid);
    (section || body).appendChild(block); sync();
  }
  function addNumRow(labelText, get, set, step, min, max) {
    const inp = document.createElement('input'); inp.type = 'number'; inp.value = get();
    // step="any" so the field accepts ANY typed value. A fixed step (0.5,
    // 0.1, ...) makes the browser flag an off-step entry with a red "!"
    // validation marker even though our change handler parses and applies
    // it fine - these are free tuning fields, so no step constraint. min/max
    // still enforced where meaningful (e.g. body ratio 0-1, period >= 1).
    inp.step = 'any';
    if (min != null) inp.min = min; if (max != null) inp.max = max;
    inp.style.flex = '1';
    inp.addEventListener('mousedown', (e) => e.stopPropagation());
    inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (!isNaN(v)) { set(v); paintCandles(); } });
    addRow(labelText, inp);
  }
  function addCheckRow(labelText, get, set) {
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!get();
    cb.style.marginLeft = 'auto';
    cb.addEventListener('mousedown', (e) => e.stopPropagation());
    cb.addEventListener('change', () => { set(cb.checked); paintCandles(); });
    addRow(labelText, cb);
  }

  addSection('Candle types — on/off + colour');
  addTypeRow('highCB', 'High CB');
  addTypeRow('lowCB', 'Low CB');
  addTypeRow('dc', 'DC');
  addTypeRow('dc2', 'DC2 (breakout)');
  addTypeRow('redCB', 'Red CB');
  addTypeRow('neutralCB', 'Neutral');

  addSection('High CB thresholds');
  addCheckRow('Require volume', () => richRoad.useVolume.highCB, (v) => richRoad.useVolume.highCB = v);
  addNumRow('Auto-qualify move %', () => richRoad.params.highAutoMove, (v) => richRoad.params.highAutoMove = v, '0.1');
  addNumRow('Min move %', () => richRoad.params.highMinMove, (v) => richRoad.params.highMinMove = v, '0.1');
  addNumRow('Min body ratio (0-1)', () => richRoad.params.highBodyRatio, (v) => richRoad.params.highBodyRatio = v, '0.05', '0', '1');
  addNumRow('Open near low tolerance %', () => richRoad.params.highWickTol, (v) => richRoad.params.highWickTol = v, '0.5');

  addSection('Low CB / DC / Red CB');
  addCheckRow('Low CB require volume', () => richRoad.useVolume.lowCB, (v) => richRoad.useVolume.lowCB = v);
  addNumRow('Low CB min move %', () => richRoad.params.lowMinMove, (v) => richRoad.params.lowMinMove = v, '0.1');
  addNumRow('DC min body ratio (0-1)', () => richRoad.params.dcBodyRatio, (v) => richRoad.params.dcBodyRatio = v, '0.05', '0', '1');
  addNumRow('DC open near low tolerance %', () => richRoad.params.dcWickTol, (v) => richRoad.params.dcWickTol = v, '0.5');
  addNumRow('Red CB down move %', () => richRoad.params.redMove, (v) => richRoad.params.redMove = v, '0.1');

  addSection('Volume');
  addNumRow('Volume EMA period', () => richRoad.params.volEmaPeriod, (v) => richRoad.params.volEmaPeriod = Math.max(1, Math.round(v)), '1', '1');
  addNumRow('Volume multiple (× EMA)', () => richRoad.params.volMultiplier, (v) => richRoad.params.volMultiplier = v, '0.1', '0');

  const actions = document.createElement('div'); actions.className = 'panel-actions-row';
  const setBtn = document.createElement('button'); setBtn.textContent = 'Set as Default';
  setBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  setBtn.addEventListener('click', (e) => { e.stopPropagation(); persistRichRoad(); setStatus('Saved Rich Road Candles as the default.', false); });
  actions.appendChild(setBtn);
  const resBtn = document.createElement('button'); resBtn.textContent = 'Restore Default';
  resBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  resBtn.addEventListener('click', (e) => { e.stopPropagation(); const wasOn = richRoad.enabled; richRoad = loadRichRoad(); richRoad.enabled = wasOn; paintCandles(); renderRichRoadPanel(); });
  actions.appendChild(resBtn);
  panel.appendChild(actions);
  document.body.appendChild(panel);
  // Clamp so the whole panel stays on-screen. It is wider than the style popups
  // and the base .drawing-settings-panel class centres it via translateX(-50%),
  // so the horizontal bounds are half-width margins on each side.
  const w = panel.offsetWidth, h = panel.offsetHeight, margin = 8;
  const minLeft = w / 2 + margin, maxLeft = window.innerWidth - w / 2 - margin;
  const left = maxLeft < minLeft ? window.innerWidth / 2 : Math.max(minLeft, Math.min(pos.x, maxLeft));
  const top = Math.max(margin, Math.min(pos.y, window.innerHeight - h - margin));
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}

function loadTimeframe(tf) {
  const cfg = TIMEFRAME_META[tf];
  const file = `${currentTicker.toLowerCase()}_${tf}.json`;
  fetch(file)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('main-no-data').classList.add('show');
        setStatus(`No data available for ${cfg.label}.`, true);
        return;
      }
      document.getElementById('main-no-data').classList.remove('show');

      // Silenced until the view is explicitly re-asserted below, once
      // things have settled - see suppressSync's own comment for why.
      suppressSync = true;

      // If this is an actual timeframe change (not the initial load, and
      // not switchTicker() reloading the SAME timeframe for a different
      // ticker), remember the current view's left edge so the new
      // timeframe can open showing the same calendar start date instead
      // of resetting to the generic "half real, half future" default -
      // e.g. switching Daily -> Weekly while scrolled back to March
      // should still start at March, not jump back to a recent default
      // view. Captured BEFORE currentTF/barsData below get overwritten.
      // Uses logicalIndexToTFTime (not getVisibleRange()) so this still
      // works even if currently zoomed out past the old timeframe's own
      // data.
      const oldTF = currentTF;
      const isTimeframeChange = tf !== oldTF;
      let prevStartTime = null;
      if (isTimeframeChange) {
        const prevRange = chart.timeScale().getVisibleLogicalRange();
        if (prevRange && barsData.length) prevStartTime = logicalIndexToTFTime(prevRange.from, barsData, oldTF);
      }

      currentTF = tf;
      barsData = data;

      // Moving averages (price EMAs and the volume/turnover EMA) should
      // stop at the last REAL bar, not run flat across the future
      // placeholder bars appended for annotation space - only earnings
      // markers are meant to occupy that future space (see
      // renderEarningsOverlay). realData is used for every MA-style
      // series below.
      const realIdx = lastRealBarIndex(data);
      const realData = data.slice(0, realIdx + 1);

      // The candlestick series still needs an entry for every future
      // bar (so the time axis reserves that space to scroll/draw into),
      // but NOT as real OHLC - a flat open=high=low=close candle still
      // gets a rendered body/border, and ~75+ of those back-to-back at
      // the same price visually merge into one solid horizontal line.
      // Lightweight Charts' "whitespace" points (bare {time}, no OHLC)
      // reserve the time slot without drawing anything.
      // Candlestick data (with optional Rich Road per-candle colouring) is
      // built by paintCandles(), which reads barsData - set just above.
      paintCandles();
      for (const key of Object.keys(emaSeries)) {
        if (key === 'ema_200') continue; // computed separately below, not in the data file
        emaSeries[key].setData(realData.filter(d => d[key] != null).map(d => ({ time: d.time, value: d[key] })));
      }
      emaSeries.ema_200.setData(calculateEMA(realData, 200));
      turnoverSeries.setData(data.map(d => ({ time: d.time, value: d.volume, color: volumeBarColor(d) })));
      currentVolumeEma3 = calculateEMA(realData, 3, 'volume');
      currentVolumeEma20 = calculateEMA(realData, 20, 'volume');
      turnoverEmaSeries.setData(currentVolumeEma20);
      // Only when RSI is following the main chart's own timeframe -
      // this used to run unconditionally, silently overwriting RSI's
      // plotted line with the MAIN chart's data even while RSI had its
      // own INDEPENDENT timeframe selected (e.g. RSI pinned to Weekly
      // while switching the main chart Daily -> Hourly would blow away
      // RSI's weekly-computed line with hourly RSI values) - a real,
      // separate bug surfaced while chasing the pan/zoom sync issue:
      // rsiBarsData/rsiTF still described the old (correct) independent
      // data, but the actual plotted series had just been silently
      // swapped out from under it, making any position/range math
      // against rsiBarsData meaningless.
      // In "Chart" mode RSI mirrors the main chart's timeframe, so point its
      // effective TF at the new one - the recompute below then runs (rsiTF
      // now === tf) and RSI re-plots on the new timeframe automatically.
      if (rsiSeries && rsiFollowChart) {
        rsiTF = tf;
        document.querySelectorAll('.rsi-tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === 'chart'));
      }
      if (rsiSeries && rsiTF === tf) {
        // Whitespace points for the future bars too - see the matching
        // comment in loadRsiData for why this isn't optional.
        const rsiComputed = calculateRSI(realData, 14);
        rsiSeries.setData(rsiComputed.concat(data.slice(realIdx + 1).map(d => ({ time: d.time }))));
        // Same timeframe as main, so there's normally no gap to bridge
        // (buildLastValueExtension correctly returns [] in that case) -
        // still needs calling here to CLEAR a stale extension segment
        // left over from before RSI was switched to match main.
        rsiExtensionSeries.setData(buildLastValueExtension(rsiComputed[rsiComputed.length - 1], data[realIdx].time));
        // Keep rsiBarsData describing what's ACTUALLY plotted now, same
        // reasoning as the guard above - every index/time calculation
        // elsewhere (ongoing sync, RSI's own timeframe switch) trusts
        // rsiBarsData to match rsiSeries' real data.
        rsiBarsData = data;
      }

      // Same recompute for MACD when it's following the main chart's
      // timeframe - mirror of the RSI block above (this hand-mirroring,
      // rather than a shared helper, is one of the parity gaps the MACD
      // build surfaced). Only overwrites MACD's plotted data when its own
      // timeframe matches, so a MACD pinned to a different TF is left alone.
      if (macdChart && macdFollowChart) {
        macdTF = tf;
        document.querySelectorAll('.macd-tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === 'chart'));
      }
      if (macdChart && macdTF === tf) {
        const { macd, signal, hist } = calculateMACD(realData);
        const future = data.slice(realIdx + 1).map(d => ({ time: d.time }));
        macdLineSeries.setData(macd.concat(future));
        macdSignalSeries.setData(signal.concat(future));
        paintMacdHist(hist);
        macdBarsData = data;
      }

      chart.applyOptions({ timeScale: { timeVisible: cfg.intraday, borderColor: '#e0e3eb' } });
      // Default view: CANDLES_EACH_SIDE candles either side of the last real
      // bar - the same window "Reset chart" gives. Applied on initial load
      // AND on every timeframe change, so the number of candles shown is
      // consistent (this replaced the older "preserve start date across a TF
      // switch" / "half real, half future" behaviour - git history has it if
      // that's ever wanted back). Re-asserted once more below after
      // everything settles - see suppressSync.
      const w0 = candleWindowAround(realIdx);
      let targetFrom = w0.from, targetTo = w0.to;
      chart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });

      updateHeadlineStats(lastRealBarIndex(data));
      updateTurnoverBox(lastRealBarIndex(barsData));

      markers = [];
      crossoverPoints = computeCrossPoints(data, 'ema_10', 'ema_20', false);
      closeAbovePoints = computeCrossPoints(data, 'close', 'ema_20', true);
      renderEventOverlaysNow();
      renderEarningsOverlay();
      positionDailyBox();
      refreshMarkers();
      mainPane.refreshForTimeframe();
      updateOutputBox();

      document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
      refreshAllEnabledMtfEmas();
      refreshAllEnabledRelEmas();

      // Right after a big data swap like this, the chart library fires a
      // CASCADE of several intermediate range-change events over the
      // next several frames as it internally reconciles the new data -
      // not just the one from the setVisibleLogicalRange call above, and
      // NOT confined to requestAnimationFrame timing: direct instrumentation
      // (wrapping setVisibleRange/setVisibleLogicalRange to log every call)
      // caught the chart library's OWN internal code calling
      // setVisibleRange with a stale value ~10ms after a 2-frame
      // rAF-based settle had already re-asserted the correct one -
      // consistent with a ResizeObserver-driven internal correction,
      // which runs on its own schedule rather than paint frames. Sync
      // was suppressed for all of it. Re-asserting once after 2 frames
      // AND once more after a plain delay (past that resize-observer
      // window) makes sure OUR value is the one that wins the last word.
      const applyFinalRange = () => {
        chart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        reassertIndicatorRange(rsiSyncPane, targetFrom, targetTo, data, tf);
        reassertIndicatorRange(macdSyncPane, targetFrom, targetTo, data, tf);
        // Re-render the event dots now the vertical price scale has settled.
        // The first render in loadTimeframe's body runs before autoscale is
        // final, which (unlike the fixed-y earnings badges) would leave the
        // dots off the crossing until the next pan. Re-asserting the same range
        // may not fire the range-change subscription, so call directly.
        renderEventOverlaysNow();
      };
      requestAnimationFrame(() => requestAnimationFrame(applyFinalRange));
      setTimeout(() => { applyFinalRange(); suppressSync = false; }, 250);
    })
    .catch(err => {
      document.getElementById('main-no-data').classList.add('show');
      setStatus(`Could not load ${file} — make sure it's in the same folder as this HTML file.`, true);
    });
}

// Always shows the latest DAILY figures in the top-right box, regardless
// of whichever timeframe is currently active on the main chart - a
// completely independent fetch from whatever loadTimeframe() is doing.
function loadDailySnapshot(ticker) {
  fetch(`${ticker.toLowerCase()}_daily.json`)
    .then(r => r.json())
    .then(data => {
      const last = data[lastRealBarIndex(data)];
      const ema3 = calculateEMA(data, 3, 'volume');
      const ema20 = calculateEMA(data, 20, 'volume');
      const idx = lastRealBarIndex(data);
      document.getElementById('turnover-daily-lt').textContent = formatVolume(last.volume);
      document.getElementById('turnover-daily-at3').textContent = formatVolume(ema3[idx] ? ema3[idx].value : null);
      document.getElementById('turnover-daily-at20').textContent = formatVolume(ema20[idx] ? ema20[idx].value : null);
    })
    .catch(() => setStatus(`Could not load ${ticker.toLowerCase()}_daily.json for the daily snapshot box.`, true));
}

function switchTicker(ticker) {
  currentTicker = ticker;
  document.querySelectorAll('.watch-row').forEach(row => row.classList.toggle('active', row.dataset.ticker === ticker));
  const stock = watchlistData.find(s => s.ticker === ticker);
  if (stock) {
    document.getElementById('header-symbol').innerHTML = `${stock.ticker} <span class="name">${stock.name}</span>`;
  }
  loadTimeframe(currentTF);
  loadDailySnapshot(ticker);
  // Reload each indicator on its effective TF - the chart's TF when following,
  // otherwise its own pinned TF (don't reset a pinned indicator on ticker switch).
  if (rsiChart) loadRsiData(rsiFollowChart ? currentTF : rsiTF);
  if (macdChart) loadMacdData(macdFollowChart ? currentTF : macdTF);
  refreshAllEnabledMtfEmas();
  refreshAllEnabledRelEmas();
}

function renderWatchlist() {
  const container = document.getElementById('watchlist-rows');
  container.innerHTML = '';
  for (const stock of watchlistData) {
    const row = document.createElement('div');
    row.className = 'watch-row' + (stock.ticker === currentTicker ? ' active' : '');
    row.dataset.ticker = stock.ticker;
    const changeClass = stock.change_pct >= 0 ? 'change-up' : 'change-down';
    const sign = stock.change_pct >= 0 ? '+' : '';
    row.innerHTML = `
      <div class="row-top"><span class="ticker">${stock.ticker}</span><span class="last">$${stock.last.toFixed(2)}</span></div>
      <div class="row-bottom"><span>${stock.sector}</span><span class="${changeClass}">${sign}${stock.change_pct.toFixed(2)}%</span></div>
    `;
    row.addEventListener('click', () => switchTicker(stock.ticker));
    container.appendChild(row);
  }
}

// Column master checkboxes - turning a column off remembers each row's
// individual checked state and restores exactly that (not just "all
// on") when turned back on. Uses each row's own checkbox 'change' event
// (already wired above) rather than duplicating the enable/disable
// logic here.
const columnMemory = {};
document.querySelectorAll('.ind-col').forEach((col, colIndex) => {
  const master = col.querySelector('.col-master');
  const rowCheckboxes = [...col.querySelectorAll('.ind-row input[type="checkbox"]')];
  master.addEventListener('change', () => {
    if (!master.checked) {
      columnMemory[colIndex] = rowCheckboxes.map(cb => cb.checked);
      rowCheckboxes.forEach(cb => {
        if (cb.checked) {
          cb.checked = false;
          cb.dispatchEvent(new Event('change'));
        }
      });
    } else {
      const saved = columnMemory[colIndex];
      rowCheckboxes.forEach((cb, i) => {
        const shouldBeChecked = saved ? saved[i] : cb.checked;
        if (cb.checked !== shouldBeChecked) {
          cb.checked = shouldBeChecked;
          cb.dispatchEvent(new Event('change'));
        }
      });
    }
  });
});

document.querySelectorAll('.tf-btn').forEach(btn => {

// Toggle individual EMA / turnover-EMA lines on and off from the legend.
const toggleableSeries = { ...emaSeries, turnover: turnoverSeries, turnover_ema: turnoverEmaSeries };
document.querySelectorAll('#legend .ind-row[data-series]').forEach(row => {
  const key = row.dataset.series;
  const checkbox = row.querySelector('input');
  checkbox.addEventListener('change', () => {
    if (key === 'earnings') {
      earningsVisible = checkbox.checked;
      renderEarningsOverlay();
    } else if (key === 'rsi') {
      setRsiEnabled(checkbox.checked);
    } else if (key === 'macd') {
      setMacdEnabled(checkbox.checked);
    } else if (key === 'turnoverbox') {
      turnoverStyle.visible = checkbox.checked;
      applyTurnoverStyle();
      persistTurnoverStyle();
    } else if (key === 'ema_cross') {
      crossoverVisible = checkbox.checked;
      renderCrossoverOverlay();
    } else if (key === 'close_above_20') {
      closeAboveVisible = checkbox.checked;
      renderCloseAboveOverlay();
    } else if (key === 'richroad') {
      richRoad.enabled = checkbox.checked;
      paintCandles();
    } else {
      toggleableSeries[key].applyOptions({ visible: checkbox.checked });
    }
    row.classList.toggle('off', !checkbox.checked);
    updateOutputBox();
  });
});

// Clicking an indicator's NAME opens its style popup. preventDefault stops
// the wrapping <label> from also toggling the visibility checkbox. This loop
// only wires rows whose id is a styleable indicator (in INDICATOR_KIND);

// Makes `panelEl` draggable by mousedown-dragging on `handleEl`.
// Shared by all three floating panels (Style, Timeframe, RSI
// Settings) so they can always be pulled fully on-screen, however
// they were originally positioned (anchored to a corner, centered via
// transform, etc).
function makeDraggable(panelEl, handleEl) {
  handleEl.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    // Convert whatever positioning got it here (a centering transform,
    // a right-anchored offset, ...) into explicit top-left pixels
    // BEFORE the drag starts, using its actual on-screen box - so it
    // doesn't jump the moment you start dragging.
    const rect = panelEl.getBoundingClientRect();
    const parentRect = panelEl.offsetParent.getBoundingClientRect();
    const startLeft = rect.left - parentRect.left;
    const startTop = rect.top - parentRect.top;
    panelEl.style.left = startLeft + 'px';
    panelEl.style.top = startTop + 'px';
    panelEl.style.right = 'auto';
    panelEl.style.transform = 'none';

    const startX = e.clientX, startY = e.clientY;
    const onMove = (ev) => {
      panelEl.style.left = (startLeft + (ev.clientX - startX)) + 'px';
      panelEl.style.top = (startTop + (ev.clientY - startY)) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
