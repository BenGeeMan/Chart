<script>
const chartEl = document.getElementById('chart');

// These need to exist before ANYTHING else runs (including chart setup
// below), since createRsiChart() references barsData/currentTicker
// immediately when first called - having their declarations any later
// in the file throws a "used before initialization" error that halts
// the entire script.
let currentTicker = 'HPQ';
let currentTF = 'daily';
let barsData = [];

// Same reason as above: createRsiChart() calls applyRsiSettings()
// synchronously near the top of this script, which needs
// LINE_STYLE_MAP - defining it down with the rest of the drawing-tools
// style helpers (where it conceptually belongs) previously caused
// exactly this "used before initialization" crash, silently breaking
// the ENTIRE page (blank chart, empty watchlist, nothing loads) since
// it happened before any of the real initialization code ran.
const LINE_STYLE_MAP = {
  solid: LightweightCharts.LineStyle.Solid,
  dashed: LightweightCharts.LineStyle.Dashed,
  // Regular "Dotted" renders as tiny, tightly-packed dots that read as
  // near-identical to Dashed at a glance. SparseDotted uses the same
  // dot shape with much wider gaps, which is what actually reads as
  // visually distinct from a dashed line.
  dotted: LightweightCharts.LineStyle.SparseDotted,
};

const chart = LightweightCharts.createChart(chartEl, {
  layout: {
    background: { color: '#ffffff' },
    textColor: '#131722',
    fontFamily: "-apple-system, 'Trebuchet MS', Roboto, Helvetica, Arial, sans-serif",
  },
  grid: {
    vertLines: { visible: false },
    horzLines: { visible: false },
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#e0e3eb', mode: LightweightCharts.PriceScaleMode.Logarithmic },
  timeScale: { borderColor: '#e0e3eb', timeVisible: false },
});

// Candles: hollow white body for up, solid red body for down. Wicks and
// borders are always black on both, regardless of direction.
const series = chart.addCandlestickSeries({
  upColor: '#ffffff',
  downColor: '#ef5350',
  borderUpColor: '#000000',
  borderDownColor: '#000000',
  wickUpColor: '#000000',
  wickDownColor: '#000000',
  lastValueVisible: false,
  // Without this, Lightweight Charts draws its own dashed "last price"
  // reference line at the last data point's close, spanning the FULL
  // chart width regardless of where the actual candles end - normally
  // barely noticeable near the right edge, but now that the future
  // placeholder bars leave a wide blank stretch to the right of the
  // real candles, that default line reads as an unwanted line
  // extending across the future space, same family of issue as the
  // MAs fixed above.
  priceLineVisible: false,
});

// EMA overlays, sharing the main price scale.
const emaSeries = {
  ema_10:  chart.addLineSeries({ color: '#000000', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_20:  chart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_50:  chart.addLineSeries({ color: '#26a69a', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
  ema_200: chart.addLineSeries({ color: '#ef5350', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
};

// Multi-timeframe EMA(10) overlays - e.g. showing the WEEKLY EMA 10 on
// top of a DAILY chart. Each is independently toggleable and off by
// default. Different timeframes use different time formats internally
// (date strings like "2026-08-07" for daily-and-up, Unix timestamps for
// intraday) - alignTimeToCurrentChart() below converts between them so
// an overlay always renders correctly regardless of which timeframe the
// main chart is currently showing.
const MTF_EMA_COLORS = {
  m5: '#e91e63', m15: '#fb8c00', hourly: '#8e24aa',
  daily: '#3949ab', weekly: '#6d4c41', monthly: '#00acc1', quarterly: '#7cb342',
};
const mtfEmaSeries = {};
const mtfEmaEnabled = {};
Object.keys(MTF_EMA_COLORS).forEach(tf => {
  mtfEmaSeries[tf] = chart.addLineSeries({
    color: MTF_EMA_COLORS[tf], lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false,
  });
  mtfEmaEnabled[tf] = false;
});

function dateStringToTimestamp(dateStr) {
  return Math.floor(new Date(dateStr + 'T00:00:00Z').getTime() / 1000);
}

// Converts a single time value from one timeframe's own format to
// another's (date string for daily-and-up, Unix timestamp for
// intraday) - used to sync pan/zoom between the main chart and RSI (or
// any future indicator pane) by actual CALENDAR time rather than raw
// bar index, since bar index doesn't mean the same thing across
// different timeframes (bar 100 on Daily is a completely different
// date than bar 100 on 15m) but a calendar date/time does.
function convertTimeBetweenTF(time, fromTF, toTF) {
  const fromIntraday = TIMEFRAME_META[fromTF].intraday;
  const toIntraday = TIMEFRAME_META[toTF].intraday;
  if (fromIntraday === toIntraday) return time;
  if (toIntraday) return dateStringToTimestamp(time);
  return new Date(time * 1000).toISOString().slice(0, 10);
}

// Converts a LOGICAL (bar-index) position - which can be fractional, or
// even negative / past the end of the array once the chart is zoomed
// out further than there's data to fill it - into a calendar time in
// `tf`'s own native format. Used instead of
// chart.timeScale().getVisibleRange() for cross-timeframe sync, because
// that returns null once the visible range extends past the actual
// loaded bars (there's no real bar there to report a time for), which
// was silently freezing the other pane's sync at that point. Here,
// positions past either end of `bars` are extrapolated using the
// array's own average bar-to-bar spacing, so sync keeps working exactly
// where a user would notice it break - fully zoomed out.
function logicalIndexToTFTime(idx, bars, tf) {
  const n = bars.length;
  if (n === 0) return null;
  const nums = bars.map(b => timeToNumeric(b.time));
  const step = n > 1 ? (nums[n - 1] - nums[0]) / (n - 1) : 86400;
  let numeric;
  if (idx <= 0) numeric = nums[0] + idx * step;
  else if (idx >= n - 1) numeric = nums[n - 1] + (idx - (n - 1)) * step;
  else {
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    numeric = lo === hi ? nums[lo] : nums[lo] + (idx - lo) * (nums[hi] - nums[lo]);
  }
  return TIMEFRAME_META[tf].intraday ? Math.round(numeric) : new Date(numeric * 1000).toISOString().slice(0, 10);
}

// Inverse of logicalIndexToTFTime - finds the (possibly fractional, or
// out-of-bounds/extrapolated) logical index in `bars` for a given
// calendar time. Used instead of chart.timeScale().setVisibleRange()
// when opening a NEW timeframe's initial view - setVisibleRange (time-
// based) does not reliably apply when called in the same tick as the
// series.setData() that just loaded the new timeframe's data (the
// chart's internal scale hasn't caught up to the new data yet, and
// unlike a plain redraw, waiting a single requestAnimationFrame was
// still not enough for it to settle - confirmed by direct testing).
// setVisibleLogicalRange (index-based) does not have this problem, so
// converting time -> index up front and using that instead sidesteps it
// entirely.
function timeToLogicalIndex(time, bars) {
  const n = bars.length;
  if (n === 0) return 0;
  const target = timeToNumeric(time);
  const nums = bars.map(b => timeToNumeric(b.time));
  const step = n > 1 ? (nums[n - 1] - nums[0]) / (n - 1) : 86400;
  if (target <= nums[0]) return step ? (target - nums[0]) / step : 0;
  if (target >= nums[n - 1]) return step ? (n - 1) + (target - nums[n - 1]) / step : n - 1;
  for (let i = 0; i < n - 1; i++) {
    if (nums[i] <= target && target <= nums[i + 1]) {
      const span = nums[i + 1] - nums[i];
      return span ? i + (target - nums[i]) / span : i;
    }
  }
  return n - 1;
}

// For ongoing pan/zoom sync between panes on different timeframes.
// Per EDGE (from/to independently, not the range as a whole):
// - When that edge's logical index is still within the loaded data
//   [0, bars.length-1], trust the source chart's own naturally-computed
//   getVisibleRange() for that edge - exact, matches real bar positions.
// - Once that edge extends PAST the data, fall back to
//   logicalIndexToTFTime's extrapolation instead.
//
// This has to be asymmetric because the two edges behave differently:
// the candlesticks have NO reserved space before the first real bar
// (nothing to scroll into), so getVisibleRange() correctly clamps the
// "from" edge to the true first-bar date once scrolled past it, and
// that clamped value is exactly what should be synced - extrapolating
// instead would make the OTHER pane run away into increasingly wrong,
// unrelated history even after this chart's own display had already
// frozen at its true boundary (confirmed as a real, reproducible bug).
// But the "to" edge DOES have reserved space (the future placeholder
// whitespace points) - once scrolled past even that, getVisibleRange()
// still returns a value, but a CLAMPED one that silently drops how much
// blank overscroll margin is actually being shown. Trusting that
// clamped "to" for sync makes the two panes' PIXEL WIDTHS diverge even
// though their reported dates stay close - confirmed directly: candles
// stopped at a fixed pixel while RSI's line kept extending further
// right past it, growing with every extra scroll step, because RSI's
// sync target kept getting the same clamped date main was already
// showing at rest, undercounting how far main had actually scrolled.
function sourceVisibleTime(sourceChart, range, bars, tf) {
  const n = bars.length;
  const clamped = sourceChart.timeScale().getVisibleRange();
  return {
    from: (range.from >= 0 && clamped) ? clamped.from : logicalIndexToTFTime(range.from, bars, tf),
    to: (range.to <= n - 1 && clamped) ? clamped.to : logicalIndexToTFTime(range.to, bars, tf),
  };
}

// Builds a short, flat "last value carried forward" segment bridging
// the gap between an indicator's own last REAL (completed) bar and some
// later reference time - typically the main chart's current real
// boundary. Shows up whenever an indicator pane is on a coarser
// timeframe than the main chart and the current period hasn't closed
// yet (e.g. RSI on Quarterly won't have this quarter's own bar until
// the quarter ends, even though the main Daily chart already has
// today's bar) - without this, the indicator's line would just stop
// short of where the main chart's real candles do, with a distracting
// gap of nothing in between.
//
// Returns an empty array (nothing to draw) if targetTime isn't actually
// later than the indicator's last real point - the common case when an
// indicator shares the main chart's own timeframe, since there's no gap
// to fill.
//
// Deliberately generic (indicator-agnostic) rather than RSI-specific -
// any future indicator pane can call this the same way RSI does, using
// its own last computed point and its own series for the returned
// segment (a single Lightweight Charts LineSeries can't mix line styles
// within itself, so this segment always needs to render on a SEPARATE
// series from the indicator's real line, styled distinctly - RSI's own
// usage pairs this with rsiExtensionSeries, styled lighter/dotted via
// applyRsiSettings()).
function buildLastValueExtension(lastRealPoint, targetTime) {
  if (!lastRealPoint) return [];
  if (timeToNumeric(targetTime) <= timeToNumeric(lastRealPoint.time)) return [];
  return [
    { time: lastRealPoint.time, value: lastRealPoint.value },
    { time: targetTime, value: lastRealPoint.value },
  ];
}

// Converts a computed EMA series' time values to whatever format the
// CURRENTLY ACTIVE chart is using, so both can coexist on one timeScale.
function alignTimeToCurrentChart(data) {
  const currentIsIntraday = TIMEFRAME_META[currentTF].intraday;
  const sourceIsIntraday = typeof data[0].time === 'number';
  if (currentIsIntraday === sourceIsIntraday) return data;
  if (currentIsIntraday && !sourceIsIntraday) {
    // Overlaying a daily-or-higher EMA onto an intraday chart - convert
    // each date string to a timestamp at midnight UTC.
    return data.map(d => ({ time: dateStringToTimestamp(d.time), value: d.value }));
  }
  // Overlaying an intraday EMA onto a daily-or-higher chart - convert
  // timestamps to dates, keeping only the LAST value per calendar day
  // (a chart series requires unique, increasing time values).
  const byDate = {};
  data.forEach(d => {
    const dateStr = new Date(d.time * 1000).toISOString().slice(0, 10);
    byDate[dateStr] = d.value;
  });
  return Object.keys(byDate).sort().map(dateStr => ({ time: dateStr, value: byDate[dateStr] }));
}

function loadMtfEma(tf) {
  if (!mtfEmaEnabled[tf]) {
    mtfEmaSeries[tf].setData([]);
    return;
  }
  fetch(`${currentTicker.toLowerCase()}_${tf}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) { mtfEmaSeries[tf].setData([]); return; }
      // Truncate to that file's own last real bar first - it carries
      // the same future placeholder bars as the main chart's data, and
      // this overlay shouldn't run flat into them either.
      const realData = data.slice(0, lastRealBarIndex(data) + 1);
      const ema10 = calculateEMA(realData, 10, 'close');
      mtfEmaSeries[tf].setData(alignTimeToCurrentChart(ema10));
    })
    .catch(() => setStatus(`Could not load ${tf} EMA 10 overlay.`, true));
}

function refreshAllEnabledMtfEmas() {
  Object.keys(mtfEmaEnabled).forEach(tf => { if (mtfEmaEnabled[tf]) loadMtfEma(tf); });
}

// "Current TF" / "1 timeframe above" / "2 timeframes above" - these
// represent WHATEVER timeframe is 0/1/2 steps larger than the main
// chart's CURRENT timeframe, recalculated dynamically. E.g. viewing
// Daily, "1 above" is Weekly; switch the main chart to Weekly, and
// "1 above" becomes Monthly automatically - same checkbox, different
// underlying data. "Current TF" (offset 0) is the main chart's own
// timeframe - the same data as the Standard EMAs' EMA 10, just
// independently toggleable/colored here for consistency with the rest
// of this column.
const TF_ORDER = ['m5', 'm15', 'hourly', 'daily', 'weekly', 'monthly', 'quarterly'];
const RELATIVE_EMA_COLORS = { rel0: '#00897b', rel1: '#f9a825', rel2: '#455a64' };
const relEmaSeries = {};
const relEmaEnabled = { rel0: false, rel1: false, rel2: false };
const REL_EMA_OFFSETS = { rel0: 0, rel1: 1, rel2: 2 };
Object.keys(RELATIVE_EMA_COLORS).forEach(key => {
  relEmaSeries[key] = chart.addLineSeries({
    color: RELATIVE_EMA_COLORS[key], lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false,
  });
});

function getRelativeTF(offset) {
  const idx = TF_ORDER.indexOf(currentTF);
  const targetIdx = idx + offset;
  return targetIdx < TF_ORDER.length ? TF_ORDER[targetIdx] : null;
}

function loadRelEma(key, offset) {
  if (!relEmaEnabled[key]) {
    relEmaSeries[key].setData([]);
    return;
  }
  const targetTF = getRelativeTF(offset);
  if (!targetTF) {
    relEmaSeries[key].setData([]); // no higher timeframe exists (e.g. already on Quarterly)
    return;
  }
  fetch(`${currentTicker.toLowerCase()}_${targetTF}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) { relEmaSeries[key].setData([]); return; }
      // Same future-placeholder truncation as loadMtfEma above.
      const realData = data.slice(0, lastRealBarIndex(data) + 1);
      const ema10 = calculateEMA(realData, 10, 'close');
      relEmaSeries[key].setData(alignTimeToCurrentChart(ema10));
    })
    .catch(() => setStatus(`Could not load ${targetTF} EMA 10 overlay.`, true));
}

function refreshAllEnabledRelEmas() {
  Object.keys(relEmaEnabled).forEach(key => {
    if (relEmaEnabled[key]) loadRelEma(key, REL_EMA_OFFSETS[key]);
  });
}

// Dedicated, fully transparent series that ONLY exists to host the EMA
// 10/20 crossover dots. Kept separate from the actual EMA 10/20 lines so
// its visibility (and checkbox) is independent - the dots are an event
// indicator in their own right, not a decoration on the EMA 10 line.
const crossoverSeries = chart.addLineSeries({
  color: 'rgba(0,0,0,0)',
  lineWidth: 1,
  priceLineVisible: false,
  lastValueVisible: false,
  crosshairMarkerVisible: false,
});

let earningsData = {};
let earningsVisible = true;

fetch('chart_earnings.json')
  .then(r => r.json())
  .then(data => {
    earningsData = data;
    renderEarningsOverlay();
  })
  .catch(() => setStatus('Could not load chart_earnings.json.', true));

// EMA 200 isn't in the exported data files (only 10/20/50/100 were
// pre-computed) - calculated here instead, directly from each bar's
// close price, using the same recursive formula (seed = first value,
// then price*k + prev*(1-k)) that the Python pipeline used, so the
// result matches what a server-side calculation would have produced.
// Also used for the volume EMA lines below (field='volume').
function calculateEMA(bars, period, field = 'close') {
  const k = 2 / (period + 1);
  let prev = null;
  return bars.map(bar => {
    prev = prev === null ? bar[field] : bar[field] * k + prev * (1 - k);
    return { time: bar.time, value: prev };
  });
}

// Layout: two stacked bands sharing the main chart's canvas - price on
// top (~75%), volume at the bottom (~25%). RSI is NOT part of this
// canvas - see the separate chart instance below, which avoids the
// axis-label-bleed problem entirely by using its own dedicated canvas.
chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });

const turnoverSeries = chart.addHistogramSeries({
  priceFormat: { type: 'volume' },
  priceScaleId: 'turnover',
  lastValueVisible: false,
  // Same reference-line issue as the candlestick series above - without
  // this, the last volume bar's own dashed price line stretches across
  // the future placeholder bars' zero-volume space.
  priceLineVisible: false,
});
chart.priceScale('turnover').applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });

const turnoverEmaSeries = chart.addLineSeries({
  color: '#5b8ff9',
  lineWidth: 1,
  lineStyle: LightweightCharts.LineStyle.Dashed,
  priceScaleId: 'turnover',
  priceLineVisible: false,
  lastValueVisible: false,
  crosshairMarkerVisible: false,
});

// RSI - a genuinely SEPARATE chart instance (its own canvas, own axis),
// not sharing the main chart's canvas at all. This is the standard way
// to build a true separate sub-panel with this library, since a single
// canvas's price-axis labels always span its FULL height regardless of
// scaleMargins - which is exactly what caused RSI's earlier bleed-into-
// the-price-axis problem.
//
// Rather than reusing one instance across hide/show cycles (which risks
// getting stuck if it's ever resized while its container is display:none),
// this instance is fully destroyed and recreated fresh every time RSI is
// toggled back on - see setRsiEnabled() below.
let rsiChartEl = document.getElementById('rsi-chart');
let rsiChart = null;
let rsiSeries = null;
// A second, lighter/dotted series overlaid on rsiSeries - bridges the
// visual gap between RSI's own last REAL (completed) bar and the main
// chart's current real boundary, which shows up whenever RSI is on a
// coarser timeframe than the main chart and the current period hasn't
// closed yet (e.g. RSI on Quarterly won't have this quarter's bar until
// it ends, even though the main Daily chart has today's). Carries the
// last real value forward flat, styled distinctly so it reads as
// provisional/not-yet-real rather than actual computed data. See
// buildLastValueExtension() - deliberately written generically so any
// future indicator pane can reuse the same pattern, not just RSI.
let rsiExtensionSeries = null;
let syncingFromMain = false, syncingFromRsi = false;
// While true, BOTH sync handlers below no-op unconditionally. Needed
// because right after a timeframe switch (either pane), the chart
// library's own internal reconciliation of the new data fires a
// CASCADE of several intermediate, transitional range-change events
// over multiple frames - not just one - as candlesticks/EMAs/etc. each
// settle. The existing per-direction syncingFromMain/syncingFromRsi
// guards only protect against a single immediate bounce-back; with a
// multi-event cascade, an unrelated event can slip through the gap
// between one guard resetting and the next one being set, corrupting
// the range with a stale intermediate value (confirmed via direct
// console instrumentation - a real, reproducible sequence of ~10
// overlapping fire/bounce events). Silencing sync entirely during the
// transition, then explicitly forcing both panes to the correct final
// state once things settle, sidesteps the whole cascade rather than
// trying to out-guard it.
let suppressSync = false;
let rsiTF = 'daily'; // RSI's own timeframe - independent of the main chart's

// --- RSI's own settings: the RSI line's color/thickness/line-type, and
// three optional reference lines (Upper/Lower/Middle), each with its
// own on/off + threshold value + its OWN independent color/thickness/
// line-type (each of the 3 levels can look completely different from
// the others). Persisted separately from the drawing-tools' own per-
// tool defaults (see TOOL_DEFAULTS_STORAGE_KEY above) - this is about
// the RSI INDICATOR itself, not anything drawn on it.
const RSI_SETTINGS_STORAGE_KEY = 'rsiSettings_v1';
const RSI_SETTINGS_FACTORY_DEFAULT = {
  line: { color: '#131722', lineWidth: 1, lineStyle: 'solid' },
  upper: { enabled: true, value: 60, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
  middle: { enabled: false, value: 50, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
  lower: { enabled: true, value: 40, color: '#9a9ea6', lineWidth: 2, lineStyle: 'dashed' },
};

function loadRsiSettings() {
  try {
    const raw = localStorage.getItem(RSI_SETTINGS_STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    // Deep-merge over the factory default so a partially-saved/older
    // settings object (e.g. from before each level had its own style)
    // still gets sensible values for anything it's missing.
    return {
      line: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.line, saved && saved.line),
      upper: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.upper, saved && saved.upper),
      middle: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.middle, saved && saved.middle),
      lower: Object.assign({}, RSI_SETTINGS_FACTORY_DEFAULT.lower, saved && saved.lower),
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(RSI_SETTINGS_FACTORY_DEFAULT));
  }
}

let rsiSettings = loadRsiSettings();

function persistRsiSettings() {
  try {
    localStorage.setItem(RSI_SETTINGS_STORAGE_KEY, JSON.stringify(rsiSettings));
  } catch (e) {
    // Best-effort, same as the drawing-tools defaults - fails silently
    // if storage is unavailable, still works for this session.
  }
}

// --- RSI pane layout: height (mouse-resizable) and position (top or
// bottom of the page, default bottom) - separate from rsiSettings
// above since this is about the PANE itself, not what's drawn in it.
// Applies immediately and persists right away (no separate "set as
// default" step - there's only ever one current layout, unlike the
// per-tool style defaults where "what I'm previewing" and "what future
// drawings use" are meaningfully different things).
const RSI_LAYOUT_STORAGE_KEY = 'rsiLayout_v1';
const RSI_LAYOUT_FACTORY_DEFAULT = { height: 150, position: 'bottom' };
const RSI_MIN_HEIGHT = 80;
const RSI_MAX_HEIGHT = 500;

function loadRsiLayout() {
  try {
    const raw = localStorage.getItem(RSI_LAYOUT_STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    return Object.assign({}, RSI_LAYOUT_FACTORY_DEFAULT, saved);
  } catch (e) {
    return Object.assign({}, RSI_LAYOUT_FACTORY_DEFAULT);
  }
}

let rsiLayout = loadRsiLayout();

function persistRsiLayout() {
  try {
    localStorage.setItem(RSI_LAYOUT_STORAGE_KEY, JSON.stringify(rsiLayout));
  } catch (e) {
    // Best-effort, same as the other localStorage-backed settings here.
  }
}

function applyRsiLayout() {
  const rsiContainer = document.getElementById('rsi-chart-container');
  if (!rsiContainer) return;
  rsiContainer.style.height = rsiLayout.height + 'px';
  rsiContainer.style.order = rsiLayout.position === 'top' ? '-1' : '0';
  // The resize handle always sits on whichever edge borders the main
  // chart, so dragging it always means "grow/shrink toward the main
  // chart" regardless of whether RSI is docked at the top or bottom.
  const handle = document.getElementById('rsi-resize-handle');
  if (handle) {
    if (rsiLayout.position === 'top') { handle.style.top = 'auto'; handle.style.bottom = '0'; }
    else { handle.style.top = '0'; handle.style.bottom = 'auto'; }
  }
  if (rsiChart) {
    rsiChart.applyOptions({ width: rsiChartEl.clientWidth, height: rsiChartEl.clientHeight });
  }
}

// Resizing the RSI pane shrinks/grows the MAIN chart's container too
// (both share the same flex column, so one taking more room means the
// other gets less) - but the chart library doesn't auto-redraw when
// its container resizes, it needs an explicit resize call, same as
// the window-resize handler already does elsewhere in this file. Kept
// separate from applyRsiLayout above (rather than folded into it)
// because THAT function also runs once during the very first page
// load, before mainPane/rsiPane/positionDailyBox exist yet - calling
// them that early would throw the same "used before initialization"
// crash fixed earlier in this project. This function is only ever
// called from user-triggered paths (dragging the resize handle,
// changing pane position, Restore Default), always after the full
// script - and those variables - have finished loading.
function resizeChartsForRsiLayout() {
  applyRsiLayout();
  chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  renderEarningsOverlay();
  mainPane.refreshOverlay();
  rsiPane.refreshOverlay();
  positionDailyBox();
}

// Drag-to-resize: mousedown on the handle, then track vertical mouse
// movement to grow/shrink the RSI pane's height, clamped to a sane
// range. Direction depends on which edge the handle is docked to (see
// applyRsiLayout above) - dragging always feels like "pull this edge
// toward/away from the main chart," whichever position RSI is in.
(function setupRsiResize() {
  const handle = document.getElementById('rsi-resize-handle');
  if (!handle) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = rsiLayout.height;
    const onMove = (ev) => {
      const dy = ev.clientY - startY;
      const delta = rsiLayout.position === 'top' ? dy : -dy;
      rsiLayout.height = Math.max(RSI_MIN_HEIGHT, Math.min(RSI_MAX_HEIGHT, startHeight + delta));
      resizeChartsForRsiLayout();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      persistRsiLayout();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

let rsiUpperHandle = null, rsiLowerHandle = null, rsiMiddleHandle = null;

// (Re)applies rsiSettings to the current rsiSeries - the line's own
// style, and each reference line (removing/recreating it, since
// LightweightCharts price lines don't support toggling visibility
// directly - see the same pattern used for hline drawings elsewhere in
// this file). Called once when RSI's chart is (re)created, and again
// any time a setting changes in the panel.
function applyRsiSettings() {
  if (!rsiSeries) return;
  rsiSeries.applyOptions({
    color: rsiSettings.line.color,
    lineWidth: rsiSettings.line.lineWidth,
    lineStyle: LINE_STYLE_MAP[rsiSettings.line.lineStyle],
  });
  // Tracks RSI's own line color (lighter) and a dotted style, regardless
  // of what line style the user picked for the real line - this segment
  // means something different (not-yet-real data), so it should always
  // look visually distinct rather than following the user's solid/
  // dashed/dotted choice for the real line.
  if (rsiExtensionSeries) {
    rsiExtensionSeries.applyOptions({
      color: colorWithOpacity(rsiSettings.line.color, 0.4),
      lineWidth: rsiSettings.line.lineWidth,
      lineStyle: LINE_STYLE_MAP.dotted,
    });
  }

  if (rsiUpperHandle) { rsiSeries.removePriceLine(rsiUpperHandle); rsiUpperHandle = null; }
  if (rsiSettings.upper.enabled) {
    rsiUpperHandle = rsiSeries.createPriceLine({
      price: rsiSettings.upper.value, color: rsiSettings.upper.color,
      lineWidth: rsiSettings.upper.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.upper.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
  if (rsiMiddleHandle) { rsiSeries.removePriceLine(rsiMiddleHandle); rsiMiddleHandle = null; }
  if (rsiSettings.middle.enabled) {
    rsiMiddleHandle = rsiSeries.createPriceLine({
      price: rsiSettings.middle.value, color: rsiSettings.middle.color,
      lineWidth: rsiSettings.middle.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.middle.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
  if (rsiLowerHandle) { rsiSeries.removePriceLine(rsiLowerHandle); rsiLowerHandle = null; }
  if (rsiSettings.lower.enabled) {
    rsiLowerHandle = rsiSeries.createPriceLine({
      price: rsiSettings.lower.value, color: rsiSettings.lower.color,
      lineWidth: rsiSettings.lower.lineWidth, lineStyle: LINE_STYLE_MAP[rsiSettings.lower.lineStyle],
      axisLabelVisible: true, title: '',
    });
  }
}

function createRsiChart() {
  applyRsiLayout();
  rsiChartEl.innerHTML = ''; // clean slate in case a previous instance left anything behind
  rsiChart = LightweightCharts.createChart(rsiChartEl, {
    layout: {
      background: { color: '#ffffff' },
      textColor: '#131722',
      fontFamily: "-apple-system, 'Trebuchet MS', Roboto, Helvetica, Arial, sans-serif",
    },
    grid: {
      vertLines: { visible: false },
      horzLines: { visible: false },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#e0e3eb' },
    timeScale: { visible: false },
    width: rsiChartEl.clientWidth,
    height: rsiChartEl.clientHeight,
  });
  rsiSeries = rsiChart.addLineSeries({
    priceLineVisible: false,
    lastValueVisible: false,
    autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
  });
  // Style set in applyRsiSettings() below, so it stays in sync with
  // whatever the user has RSI's own line color set to.
  rsiExtensionSeries = rsiChart.addLineSeries({
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
  });
  rsiUpperHandle = null; rsiLowerHandle = null; rsiMiddleHandle = null;
  applyRsiSettings();

  // Syncs pan/zoom to the main chart. When both panes share the same
  // timeframe (the common case), the logical (bar-index) range is
  // passed straight through - exact, no rounding. Converting through
  // calendar-date strings instead here would lose sub-bar precision for
  // daily-and-up timeframes (a date string has no fractional-day
  // component), snapping the range to whole-bar boundaries on every
  // single drag frame and making the chart visibly stretch/jitter
  // instead of panning smoothly. Only fall back to time-based
  // conversion (convertTimeBetweenTF) when RSI's own independent
  // timeframe selector actually differs from the main chart's, since
  // bar index isn't comparable across different timeframes at all.
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (suppressSync || !range || syncingFromMain) return;
    syncingFromRsi = true;
    if (rsiTF === currentTF) {
      chart.timeScale().setVisibleLogicalRange(range);
    } else {
      const { from: fromT, to: toT } = sourceVisibleTime(rsiChart, range, rsiBarsData, rsiTF);
      if (fromT != null && toT != null) {
        // setVisibleLogicalRange, not setVisibleRange - see
        // sourceVisibleTime's comment on the "to" edge: a calendar time
        // beyond the DESTINATION chart's own loaded data has nothing
        // for setVisibleRange to anchor to, so it silently clamps
        // instead of showing the requested overscroll - confirmed
        // directly (asked for a date a year past main's last bar, main
        // still clamped to its own last bar). timeToLogicalIndex extends
        // past the array via the same extrapolation math regardless,
        // and setVisibleLogicalRange has no such clamping problem.
        chart.timeScale().setVisibleLogicalRange({
          from: timeToLogicalIndex(convertTimeBetweenTF(fromT, rsiTF, currentTF), barsData),
          to: timeToLogicalIndex(convertTimeBetweenTF(toT, rsiTF, currentTF), barsData),
        });
      }
    }
    // Resetting this synchronously right after the call above assumes
    // the main chart's own range-change event (which the guard exists
    // to suppress) fires SYNCHRONOUSLY within that call - true most of
    // the time, but confirmed FALSE right after a series.setData() call
    // (e.g. a timeframe switch just finished loading): the resulting
    // event can fire on a LATER frame, by which point this flag had
    // already flipped back to false, so it went unguarded and bounced a
    // stale value back to this chart, corrupting the just-set range.
    // Deferring the reset by a frame keeps the guard up through that
    // window too.
    requestAnimationFrame(() => { syncingFromRsi = false; });
  });

  loadRsiData(rsiTF);
}

// Fetches RSI's own data independently of whatever the main chart is
// currently showing, computes RSI(14) from it, and displays it. This
// is what powers RSI having its own timeframe selector.
function loadRsiData(tf) {
  rsiTF = tf;
  document.querySelectorAll('.rsi-tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
  if (!rsiChart) return;
  fetch(`${currentTicker.toLowerCase()}_${tf}.json`)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('rsi-no-data').classList.add('show');
        rsiSeries.setData([]);
        return;
      }
      document.getElementById('rsi-no-data').classList.remove('show');
      suppressSync = true;
      rsiBarsData = data;
      // The RSI line itself shouldn't run flat across the future
      // placeholder bars (same policy as the main chart's MAs), but the
      // chart still needs a whitespace point ({time} only, no value) for
      // each of them - same reasoning as the main chart's candlesticks
      // (see that comment in loadTimeframe) - otherwise this chart's
      // timeScale has literally no record of that time existing at all,
      // and any later setVisibleLogicalRange/setVisibleRange call
      // targeting a position in that space has nothing to anchor to.
      // Confirmed this was the actual root cause of RSI's pan/zoom sync
      // silently landing on the wrong range after a timeframe switch -
      // a genuine, reproducible bug, not a timing/settling issue.
      const rsiRealIdx = lastRealBarIndex(data);
      const rsiRealComputed = calculateRSI(data.slice(0, rsiRealIdx + 1), 14);
      rsiSeries.setData(rsiRealComputed.concat(data.slice(rsiRealIdx + 1).map(d => ({ time: d.time }))));
      // Bridges the gap to the main chart's current real boundary when
      // RSI's own timeframe is coarser and its current period hasn't
      // closed yet - see buildLastValueExtension's own comment.
      rsiExtensionSeries.setData(buildLastValueExtension(
        rsiRealComputed[rsiRealComputed.length - 1],
        convertTimeBetweenTF(barsData[lastRealBarIndex(barsData)].time, currentTF, tf)
      ));
      rsiPane.refreshForTimeframe();
      // Set RSI's initial view to match the main chart's CURRENT
      // calendar range (converted to RSI's own timeframe format), same
      // as the ongoing pan/zoom sync above - keeps this consistent
      // regardless of whether RSI's timeframe matches the main chart's.
      // Uses logicalIndexToTFTime (not getVisibleRange()) so this still
      // works correctly even if the main chart is currently zoomed out
      // past its own loaded data.
      const mainLogicalRange = chart.timeScale().getVisibleLogicalRange();
      const fromT = mainLogicalRange ? logicalIndexToTFTime(mainLogicalRange.from, barsData, currentTF) : null;
      const toT = mainLogicalRange ? logicalIndexToTFTime(mainLogicalRange.to, barsData, currentTF) : null;
      if (fromT != null && toT != null) {
        // timeToLogicalIndex + setVisibleLogicalRange rather than
        // setVisibleRange, called right after rsiSeries.setData() above -
        // see timeToLogicalIndex's own comment for why.
        const targetFrom = timeToLogicalIndex(convertTimeBetweenTF(fromT, currentTF, tf), data);
        const targetTo = timeToLogicalIndex(convertTimeBetweenTF(toT, currentTF, tf), data);
        rsiChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        // Same settle-then-reassert (2 frames AND a later timeout) as
        // loadTimeframe - see its own comment (and suppressSync's) for
        // why a single rAF isn't a wide enough window.
        const reassert = () => rsiChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        requestAnimationFrame(() => requestAnimationFrame(reassert));
        setTimeout(() => { reassert(); suppressSync = false; }, 250);
      } else {
        suppressSync = false;
      }
      updateOutputBox();
    })
    .catch(() => {
      document.getElementById('rsi-no-data').classList.add('show');
      setStatus(`Could not load ${currentTicker.toLowerCase()}_${tf}.json for RSI.`, true);
    });
}

document.querySelectorAll('.rsi-tf-btn').forEach(btn => {
  btn.addEventListener('click', () => loadRsiData(btn.dataset.tf));
});

// The main chart's half of the sync is set up ONCE (it survives RSI
// being destroyed/recreated) - guarded so it does nothing if rsiChart
// doesn't currently exist (RSI is switched off). Same same-timeframe
// fast path as RSI's half above - exact logical-range passthrough when
// possible, calendar-time conversion only when timeframes differ.
chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  if (suppressSync || !range || syncingFromRsi || !rsiChart) return;
  syncingFromMain = true;
  if (rsiTF === currentTF) {
    rsiChart.timeScale().setVisibleLogicalRange(range);
  } else {
    const { from: fromT, to: toT } = sourceVisibleTime(chart, range, barsData, currentTF);
    if (fromT != null && toT != null) {
      // setVisibleLogicalRange, not setVisibleRange - see the matching
      // comment on the other sync direction above.
      rsiChart.timeScale().setVisibleLogicalRange({
        from: timeToLogicalIndex(convertTimeBetweenTF(fromT, currentTF, rsiTF), rsiBarsData),
        to: timeToLogicalIndex(convertTimeBetweenTF(toT, currentTF, rsiTF), rsiBarsData),
      });
    }
  }
  // Deferred reset - see the matching comment on RSI's half of the sync
  // (above, in createRsiChart) for why a synchronous reset isn't safe.
  requestAnimationFrame(() => { syncingFromMain = false; });
});

createRsiChart();

function calculateRSI(bars, period = 14) {
  const out = [];
  let avgGain = null, avgLoss = null;
  for (let i = 0; i < bars.length; i++) {
    if (i === 0) continue;
    const change = bars[i].close - bars[i - 1].close;
    const gain = Math.max(change, 0);
    const loss = Math.max(-change, 0);
    if (avgGain === null) {
      avgGain = gain;
      avgLoss = loss;
    } else {
      avgGain = (avgGain * (period - 1) + gain) / period;
      avgLoss = (avgLoss * (period - 1) + loss) / period;
    }
    const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
    const rsi = avgLoss === 0 ? 100 : 100 - 100 / (1 + rs);
    out.push({ time: bars[i].time, value: rsi });
  }
  return out;
}

const TIMEFRAME_META = {
  m5:        { intraday: true,  label: '5-Minute', short: '5m' },
  m15:       { intraday: true,  label: '15-Minute', short: '15m' },
  hourly:    { intraday: true,  label: 'Hourly', short: '1H' },
  daily:     { intraday: false, label: 'Daily', short: 'D' },
  weekly:    { intraday: false, label: 'Weekly', short: 'W' },
  monthly:   { intraday: false, label: 'Monthly', short: 'M' },
  quarterly: { intraday: false, label: 'Quarterly', short: 'Q' },
};

// Ordered lowest-to-highest, used by the "relative timeframe" column
// (3 higher / 2 higher / 1 higher / current only / 1 lower / 2 lower /
// 3 lower) to compute an offset from a drawing's home timeframe. Reuses
// the same TF_ORDER already defined above for the Relative M10s EMAs.

// New drawings show on every timeframe by default - this returns a
// fresh {tfKey: true, ...} object for each one (never share a single
// object across drawings, or unchecking one box would affect them all).
function defaultTimeframes() {
  const out = {};
  for (const key of Object.keys(TIMEFRAME_META)) out[key] = true;
  return out;
}

// Default relative-timeframe state: "2 higher" and "2 lower" both
// ticked (each side is radio-style/single-tick, but the two sides are
// independent of each other, so both can be on at once). A single
// tick per side rather than everything ticked at once (which looked
// like a real selection but wasn't a state any actual click could
// produce - confusing on a freshly-drawn shape). Since a range always
// includes the home timeframe it's measured from (see matchesRelativeTF
// below), this default still shows on the timeframe the drawing was
// drawn on, plus 1-2 higher and 1-2 lower.
function defaultRelativeTF() {
  return {
    current: false,
    higher1: false, higher2: true, higher3: false,
    lower1: false, lower2: true, lower3: false,
  };
}

// Whether a drawing's relative-timeframe column matches `tfKey`, given
// its fixed home timeframe (the timeframe active when it was created -
// this never changes, so "1 higher" etc. always means the same actual
// timeframe for a given drawing regardless of what's currently being
// viewed elsewhere). Missing relativeTF/homeTF (older drawings, or the
// feature never touched) imposes no restriction.
//
// "higherN"/"lowerN" are CUMULATIVE ranges, not single offsets -
// checking "3 higher" means "everything from home up to 3 higher"
// (covers +1, +2, and +3), not just the exact +3 timeframe in
// isolation. Matching uses whichever checked box has the LARGEST N on
// each side. The panel's own UI shows this as a radio-button-style
// single tick per side (picking "3" unticks "1"/"2" visually, since
// showing three ticked boxes for one range was confusing) - taking the
// max here means the meaning is identical either way, and this also
// still works correctly on older data saved before that UI change.
//
// Home itself (offset 0) matches if "current" is explicitly picked, OR
// if ANY higher/lower range is picked - a range is measured FROM home,
// so "2 higher" means "home plus up to 2 higher," not "2 higher,
// excluding home." "current" alone (no range picked) means "only
// home, nothing else."
function matchesRelativeTF(drawing, tfKey) {
  if (!drawing.relativeTF || !drawing.homeTF) return true;
  const homeIdx = TF_ORDER.indexOf(drawing.homeTF);
  const targetIdx = TF_ORDER.indexOf(tfKey);
  if (homeIdx === -1 || targetIdx === -1) return true;
  const offset = targetIdx - homeIdx;
  const rel = drawing.relativeTF;
  if (offset === 0) {
    const anyRangePicked = [1, 2, 3].some((n) => rel['higher' + n] !== false || rel['lower' + n] !== false);
    return rel.current !== false || anyRangePicked;
  }
  const side = offset > 0 ? 'higher' : 'lower';
  let maxChecked = 0;
  for (const n of [1, 2, 3]) {
    if (rel[side + n] !== false) maxChecked = n;
  }
  return Math.abs(offset) <= maxChecked;
}

// --- Per-tool-type "default" settings (Set as Default / Restore
// Default, in both the Style and Timeframe panels) ---
// Each of the 4 line tools (trendline/ray/hray/hline) remembers its OWN
// style default and its OWN timeframe default, independently - saving
// a style default for Ray doesn't touch Trend Line's, and saving a
// style default doesn't touch that tool's timeframe default or vice
// versa. Persisted to localStorage so it survives a page reload, not
// just this session; shared between the main chart and RSI panes,
// since it's about the TOOL, not which pane you happened to draw in.
const TOOL_DEFAULTS_STORAGE_KEY = 'chartToolDefaults_v1';

function loadToolDefaults() {
  try {
    const raw = localStorage.getItem(TOOL_DEFAULTS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    // localStorage can throw (private/incognito browsing, storage
    // disabled, quota) - fall back to an empty in-memory store so the
    // feature still works for this session, just without persistence.
    return {};
  }
}

let toolDefaultsCache = loadToolDefaults();

function persistToolDefaults() {
  try {
    localStorage.setItem(TOOL_DEFAULTS_STORAGE_KEY, JSON.stringify(toolDefaultsCache));
  } catch (e) {
    // Same as above - saving is best-effort, not required for the
    // feature to keep working within this session.
  }
}

const FACTORY_STYLE_DEFAULT_SHAPE = { color: '#2962ff', opacity: 1, lineWidth: 2, lineStyle: 'solid' };
const FACTORY_STYLE_DEFAULT_HLINE = { color: 'blue', colorHex: '#2962ff', opacity: 1, lineWidth: 2, lineStyle: 'solid' };

// Merges any saved style default over the built-in factory one, for
// the given tool type ('trendline'/'ray'/'hray'/'hline').
function getEffectiveStyleDefault(toolType) {
  const saved = toolDefaultsCache[toolType] && toolDefaultsCache[toolType].style;
  const factory = toolType === 'hline' ? FACTORY_STYLE_DEFAULT_HLINE : FACTORY_STYLE_DEFAULT_SHAPE;
  return Object.assign({}, factory, saved || {});
}

function setToolStyleDefault(toolType, styleObj) {
  toolDefaultsCache[toolType] = toolDefaultsCache[toolType] || {};
  toolDefaultsCache[toolType].style = styleObj;
  persistToolDefaults();
}

// Merges any saved timeframe default over the built-in factory one.
// Always returns FRESH timeframes/relativeTF objects (never a shared
// reference to the cached default), since each drawing needs its own
// independent copy - sharing one object across drawings would mean
// editing one drawing's checkboxes silently changes them all.
function getEffectiveTimeframeDefault(toolType) {
  const saved = toolDefaultsCache[toolType] && toolDefaultsCache[toolType].timeframe;
  return {
    timeframes: Object.assign({}, defaultTimeframes(), saved && saved.timeframes),
    // Off by default - only the "relative to home" column restricts a
    // new drawing's visibility out of the box; the absolute "Show on"
    // column is available but starts bypassed until explicitly turned
    // on (or a saved default says otherwise).
    timeframesColumnEnabled: saved && saved.timeframesColumnEnabled !== undefined ? saved.timeframesColumnEnabled : false,
    relativeTF: Object.assign({}, defaultRelativeTF(), saved && saved.relativeTF),
    relativeTFColumnEnabled: saved && saved.relativeTFColumnEnabled !== undefined ? saved.relativeTFColumnEnabled : true,
  };
}

function setToolTimeframeDefault(toolType, tfObj) {
  toolDefaultsCache[toolType] = toolDefaultsCache[toolType] || {};
  toolDefaultsCache[toolType].timeframe = tfObj;
  persistToolDefaults();
}


let markers = [];
let crossoverMarkers = [];
let watchlistData = [];
let currentVolumeEma3 = [];
let currentVolumeEma20 = [];

function formatVolume(value) {
  if (value == null || isNaN(value)) return '—';
  const abs = Math.abs(value);
  if (abs >= 1e9) return (value / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (value / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (value / 1e3).toFixed(2) + 'K';
  return value.toFixed(0);
}

// Updates the LT/AT(3)/AT(20) box for whichever bar index is given.
// Called with the last bar by default, and from the crosshair-move
// handler below whenever the user hovers a different bar.
// Updates the ticker/timeframe header line to reflect whichever bar the
// crosshair is over (or the latest bar by default): change and % change
// vs. that bar's own PREVIOUS close (not the start of the visible
// range), the bar's total range INCLUDING any overnight gap from the
// prior close, and that bar's volume.
// Finds the index of the last REAL bar in a bars array - now that
// every timeframe's data extends past "today" with flat, zero-volume
// placeholder bars (giving blank chart space to draw into, with known
// future earnings dates marked on it), `array.length - 1` no longer
// reliably means "the latest actual trading bar." Scans backward from
// the end for the first bar that isn't a flat placeholder. Falls back
// to the true last index if every bar looks like a placeholder (an
// all-zero-volume array, or an empty one), so callers can still safely
// index into it without a separate empty check.
function lastRealBarIndex(bars) {
  for (let i = bars.length - 1; i >= 0; i--) {
    if (bars[i].volume !== 0) return i;
  }
  return bars.length - 1;
}

function updateHeadlineStats(index) {
  const bar = barsData[index];
  if (!bar) return;
  const prevBar = barsData[index - 1];
  const prevClose = prevBar ? prevBar.close : bar.open;
  const change = bar.close - prevClose;
  const pct = (change / prevClose) * 100;
  const rangeWithGap = prevBar
    ? Math.max(bar.high, prevBar.close) - Math.min(bar.low, prevBar.close)
    : bar.high - bar.low;
  const sign = change >= 0 ? '+' : '-';
  const label = TIMEFRAME_META[currentTF].label;
  document.getElementById('legend-headline').innerHTML =
    `${currentTicker} · ${label} &nbsp; ${sign}${Math.abs(change).toFixed(2)} (${sign}${Math.abs(pct).toFixed(2)}%)` +
    ` &nbsp; ${sign}${rangeWithGap.toFixed(2)} &nbsp; Vol: ${formatVolume(bar.volume)}`;
}

function updateTurnoverBox(index) {
  const bar = barsData[index];
  if (!bar) return;
  document.getElementById('turnover-lt').textContent = formatVolume(bar.volume);
  document.getElementById('turnover-at3').textContent = formatVolume(currentVolumeEma3[index] ? currentVolumeEma3[index].value : null);
  document.getElementById('turnover-at20').textContent = formatVolume(currentVolumeEma20[index] ? currentVolumeEma20[index].value : null);
}

// A dot wherever the 10 EMA crosses the 20 EMA (either direction) -
// computed straight from the ema_10/ema_20 values already in the data,
// same crossover logic used in the original Python pipeline. Applied
// directly to the EMA 10 line series (not the candlestick series), so
// the dot renders precisely on the line's actual value at that point,
// not just "somewhere within that bar."
function computeCrossoverMarkers(data) {
  const out = [];
  for (let i = 1; i < data.length; i++) {
    const prev10 = data[i - 1].ema_10, prev20 = data[i - 1].ema_20;
    const cur10 = data[i].ema_10, cur20 = data[i].ema_20;
    if (prev10 == null || prev20 == null || cur10 == null || cur20 == null) continue;
    const crossedUp = prev10 <= prev20 && cur10 > cur20;
    const crossedDown = prev10 >= prev20 && cur10 < cur20;
    if (crossedUp || crossedDown) {
      out.push({ time: data[i].time, position: 'inBar', shape: 'circle', color: '#ff9800', text: '' });
    }
  }
  return out;
}

// Manual (user/Claude-added) markers stay on the candlestick series,
// since aboveBar/belowBar positioning is meant relative to a candle.
// Crossover dots live separately on the EMA 10 line - see above.
function refreshMarkers() {
  const manual = markers.map(m => ({ time: m.time, position: m.position, shape: m.shape, color: m.color, text: m.text }));
  series.setMarkers(manual);
}

// Matches each earnings date to the bar it falls within (exact match
// for daily bars, nearest prior bar for weekly/monthly/quarterly since
// those bars span a whole period rather than a single day). Only shown
// on daily-and-above timeframes - not intraday, where "which bar"
// stops being a meaningful question for a single earnings date.
function findEarningsBarTimes(data) {
  const entries = earningsData[currentTicker];
  if (!entries) return [];
  const out = [];
  for (const e of entries) {
    for (let i = data.length - 1; i >= 0; i--) {
      if (data[i].time <= e.date) { out.push(data[i].time); break; }
    }
  }
  return out;
}

// Draws earnings triangles as plain HTML elements positioned at an
// exact pixel distance from the bottom of the chart - NOT using
// Lightweight Charts' own marker/scale system. After repeated attempts
// to get a consistent fixed height using the library's built-in scale
// margins didn't produce predictable, verifiable results, this gives
// direct control: the X position comes from the chart's own
// time-to-pixel conversion (so it stays correctly aligned with the
// data), but the Y position is a plain, fixed CSS value - guaranteed
// to always be the same distance from the bottom, regardless of
// ticker, timeframe, or how Lightweight Charts internally scales
// anything else.
function renderEarningsOverlay() {
  const container = document.getElementById('earnings-overlay');
  container.innerHTML = '';
  if (!earningsVisible || !barsData.length) return;
  if (TIMEFRAME_META[currentTF].intraday) return;

  // The right edge of the actual PLOTTABLE chart area sits before the
  // price-axis label gutter (e.g. "15.42"), not at the full width of
  // the chart element - that gutter is included in chartEl's own
  // width. Also leaving room for the badge's own rendered width (it's
  // centered via translateX(-50%), so half of it can extend past its
  // center point even when that center point looks "in bounds").
  const priceScaleWidth = chart.priceScale('right').width();
  const badgeHalfWidth = 8;
  const maxX = chartEl.clientWidth - priceScaleWidth - badgeHalfWidth;

  const barTimes = findEarningsBarTimes(barsData);
  for (const barTime of barTimes) {
    const x = chart.timeScale().timeToCoordinate(barTime);
    if (x === null || x < badgeHalfWidth || x > maxX) continue;
    const el = document.createElement('div');
    el.className = 'earnings-badge';
    el.textContent = 'E';
    el.style.left = x + 'px';
    container.appendChild(el);
  }
}

function loadTimeframe(tf) {
  const cfg = TIMEFRAME_META[tf];
  const file = `${currentTicker.toLowerCase()}_${tf}.json`;
  fetch(file)
    .then(r => r.json())
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('main-no-data').classList.add('show');
        setStatus(`No data available for ${cfg.label}.`, true);
        return;
      }
      document.getElementById('main-no-data').classList.remove('show');

      // Silenced until the view is explicitly re-asserted below, once
      // things have settled - see suppressSync's own comment for why.
      suppressSync = true;

      // If this is an actual timeframe change (not the initial load, and
      // not switchTicker() reloading the SAME timeframe for a different
      // ticker), remember the current view's left edge so the new
      // timeframe can open showing the same calendar start date instead
      // of resetting to the generic "half real, half future" default -
      // e.g. switching Daily -> Weekly while scrolled back to March
      // should still start at March, not jump back to a recent default
      // view. Captured BEFORE currentTF/barsData below get overwritten.
      // Uses logicalIndexToTFTime (not getVisibleRange()) so this still
      // works even if currently zoomed out past the old timeframe's own
      // data.
      const oldTF = currentTF;
      const isTimeframeChange = tf !== oldTF;
      let prevStartTime = null;
      if (isTimeframeChange) {
        const prevRange = chart.timeScale().getVisibleLogicalRange();
        if (prevRange && barsData.length) prevStartTime = logicalIndexToTFTime(prevRange.from, barsData, oldTF);
      }

      currentTF = tf;
      barsData = data;

      // Moving averages (price EMAs and the volume/turnover EMA) should
      // stop at the last REAL bar, not run flat across the future
      // placeholder bars appended for annotation space - only earnings
      // markers are meant to occupy that future space (see
      // renderEarningsOverlay). realData is used for every MA-style
      // series below.
      const realIdx = lastRealBarIndex(data);
      const realData = data.slice(0, realIdx + 1);

      // The candlestick series still needs an entry for every future
      // bar (so the time axis reserves that space to scroll/draw into),
      // but NOT as real OHLC - a flat open=high=low=close candle still
      // gets a rendered body/border, and ~75+ of those back-to-back at
      // the same price visually merge into one solid horizontal line.
      // Lightweight Charts' "whitespace" points (bare {time}, no OHLC)
      // reserve the time slot without drawing anything.
      const seriesData = data.map((d, i) => (i <= realIdx ? d : { time: d.time }));
      series.setData(seriesData);
      for (const key of Object.keys(emaSeries)) {
        if (key === 'ema_200') continue; // computed separately below, not in the data file
        emaSeries[key].setData(realData.filter(d => d[key] != null).map(d => ({ time: d.time, value: d[key] })));
      }
      emaSeries.ema_200.setData(calculateEMA(realData, 200));
      turnoverSeries.setData(data.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.close >= d.open ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)',
      })));
      currentVolumeEma3 = calculateEMA(realData, 3, 'volume');
      currentVolumeEma20 = calculateEMA(realData, 20, 'volume');
      turnoverEmaSeries.setData(currentVolumeEma20);
      // Only when RSI is following the main chart's own timeframe -
      // this used to run unconditionally, silently overwriting RSI's
      // plotted line with the MAIN chart's data even while RSI had its
      // own INDEPENDENT timeframe selected (e.g. RSI pinned to Weekly
      // while switching the main chart Daily -> Hourly would blow away
      // RSI's weekly-computed line with hourly RSI values) - a real,
      // separate bug surfaced while chasing the pan/zoom sync issue:
      // rsiBarsData/rsiTF still described the old (correct) independent
      // data, but the actual plotted series had just been silently
      // swapped out from under it, making any position/range math
      // against rsiBarsData meaningless.
      if (rsiSeries && rsiTF === tf) {
        // Whitespace points for the future bars too - see the matching
        // comment in loadRsiData for why this isn't optional.
        const rsiComputed = calculateRSI(realData, 14);
        rsiSeries.setData(rsiComputed.concat(data.slice(realIdx + 1).map(d => ({ time: d.time }))));
        // Same timeframe as main, so there's normally no gap to bridge
        // (buildLastValueExtension correctly returns [] in that case) -
        // still needs calling here to CLEAR a stale extension segment
        // left over from before RSI was switched to match main.
        rsiExtensionSeries.setData(buildLastValueExtension(rsiComputed[rsiComputed.length - 1], data[realIdx].time));
        // Keep rsiBarsData describing what's ACTUALLY plotted now, same
        // reasoning as the guard above - every index/time calculation
        // elsewhere (ongoing sync, RSI's own timeframe switch) trusts
        // rsiBarsData to match rsiSeries' real data.
        rsiBarsData = data;
      }

      chart.applyOptions({ timeScale: { timeVisible: cfg.intraday, borderColor: '#e0e3eb' } });
      // targetFrom/targetTo (logical indices into `data`) are re-asserted
      // once more below, after everything settles - see suppressSync.
      let targetFrom, targetTo;
      if (prevStartTime != null) {
        // Reopen at the same calendar start date as before the switch,
        // converted into the new timeframe's own time format, still
        // extending through to the last (future) bar. Uses
        // timeToLogicalIndex + setVisibleLogicalRange rather than
        // setVisibleRange - see timeToLogicalIndex's own comment for why.
        const newStartTime = convertTimeBetweenTF(prevStartTime, oldTF, tf);
        targetFrom = timeToLogicalIndex(newStartTime, data);
        targetTo = data.length - 1;
      } else {
        // No previous view to inherit from (initial page load) -
        // fitContent() would zoom out to fit EVERY loaded bar, including
        // all the flat future placeholder bars now appended for blank
        // drawing space - that squashes the real candles down to make
        // room for a wide stretch of empty flat line. Instead, default
        // to showing an even split: as many real recent bars as there
        // are future ones, so the initial view naturally looks like
        // "half real data, half open space to draw into," with the
        // option to scroll further into either side afterward.
        const futureCount = data.length - 1 - realIdx;
        const realBarsToShow = Math.max(futureCount, 20);
        targetFrom = Math.max(0, realIdx - realBarsToShow);
        targetTo = data.length - 1;
      }
      chart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });

      updateHeadlineStats(lastRealBarIndex(data));
      updateTurnoverBox(lastRealBarIndex(barsData));

      markers = [];
      crossoverMarkers = computeCrossoverMarkers(data);
      crossoverSeries.setData(data.filter(d => d.ema_10 != null).map(d => ({ time: d.time, value: d.ema_10 })));
      crossoverSeries.setMarkers(crossoverMarkers);
      renderEarningsOverlay();
      positionDailyBox();
      refreshMarkers();
      mainPane.refreshForTimeframe();
      updateOutputBox();

      document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
      refreshAllEnabledMtfEmas();
      refreshAllEnabledRelEmas();

      // Right after a big data swap like this, the chart library fires a
      // CASCADE of several intermediate range-change events over the
      // next several frames as it internally reconciles the new data -
      // not just the one from the setVisibleLogicalRange call above, and
      // NOT confined to requestAnimationFrame timing: direct instrumentation
      // (wrapping setVisibleRange/setVisibleLogicalRange to log every call)
      // caught the chart library's OWN internal code calling
      // setVisibleRange with a stale value ~10ms after a 2-frame
      // rAF-based settle had already re-asserted the correct one -
      // consistent with a ResizeObserver-driven internal correction,
      // which runs on its own schedule rather than paint frames. Sync
      // was suppressed for all of it. Re-asserting once after 2 frames
      // AND once more after a plain delay (past that resize-observer
      // window) makes sure OUR value is the one that wins the last word.
      const applyFinalRange = () => {
        chart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
        if (rsiChart) {
          if (rsiTF === tf) {
            rsiChart.timeScale().setVisibleLogicalRange({ from: targetFrom, to: targetTo });
          } else {
            const fromT = logicalIndexToTFTime(targetFrom, data, tf);
            const toT = logicalIndexToTFTime(targetTo, data, tf);
            if (fromT != null && toT != null) {
              rsiChart.timeScale().setVisibleLogicalRange({
                from: timeToLogicalIndex(convertTimeBetweenTF(fromT, tf, rsiTF), rsiBarsData),
                to: timeToLogicalIndex(convertTimeBetweenTF(toT, tf, rsiTF), rsiBarsData),
              });
            }
          }
        }
      };
      requestAnimationFrame(() => requestAnimationFrame(applyFinalRange));
      setTimeout(() => { applyFinalRange(); suppressSync = false; }, 250);
    })
    .catch(err => {
      document.getElementById('main-no-data').classList.add('show');
      setStatus(`Could not load ${file} — make sure it's in the same folder as this HTML file.`, true);
    });
}

// Always shows the latest DAILY figures in the top-right box, regardless
// of whichever timeframe is currently active on the main chart - a
// completely independent fetch from whatever loadTimeframe() is doing.
function loadDailySnapshot(ticker) {
  fetch(`${ticker.toLowerCase()}_daily.json`)
    .then(r => r.json())
    .then(data => {
      const last = data[lastRealBarIndex(data)];
      const ema3 = calculateEMA(data, 3, 'volume');
      const ema20 = calculateEMA(data, 20, 'volume');
      const idx = lastRealBarIndex(data);
      document.getElementById('turnover-daily-lt').textContent = formatVolume(last.volume);
      document.getElementById('turnover-daily-at3').textContent = formatVolume(ema3[idx] ? ema3[idx].value : null);
      document.getElementById('turnover-daily-at20').textContent = formatVolume(ema20[idx] ? ema20[idx].value : null);
    })
    .catch(() => setStatus(`Could not load ${ticker.toLowerCase()}_daily.json for the daily snapshot box.`, true));
}

function switchTicker(ticker) {
  currentTicker = ticker;
  document.querySelectorAll('.watch-row').forEach(row => row.classList.toggle('active', row.dataset.ticker === ticker));
  const stock = watchlistData.find(s => s.ticker === ticker);
  if (stock) {
    document.getElementById('header-symbol').innerHTML = `${stock.ticker} <span class="name">${stock.name}</span>`;
  }
  loadTimeframe(currentTF);
  loadDailySnapshot(ticker);
  if (rsiChart) loadRsiData(currentTF);
  refreshAllEnabledMtfEmas();
  refreshAllEnabledRelEmas();
}

function renderWatchlist() {
  const container = document.getElementById('watchlist-rows');
  container.innerHTML = '';
  for (const stock of watchlistData) {
    const row = document.createElement('div');
    row.className = 'watch-row' + (stock.ticker === currentTicker ? ' active' : '');
    row.dataset.ticker = stock.ticker;
    const changeClass = stock.change_pct >= 0 ? 'change-up' : 'change-down';
    const sign = stock.change_pct >= 0 ? '+' : '';
    row.innerHTML = `
      <div class="row-top"><span class="ticker">${stock.ticker}</span><span class="last">$${stock.last.toFixed(2)}</span></div>
      <div class="row-bottom"><span>${stock.sector}</span><span class="${changeClass}">${sign}${stock.change_pct.toFixed(2)}%</span></div>
    `;
    row.addEventListener('click', () => switchTicker(stock.ticker));
    container.appendChild(row);
  }
}

fetch('chart_watchlist.json')
  .then(r => r.json())
  .then(data => {
    watchlistData = data;
    renderWatchlist();
  })
  .catch(() => setStatus('Could not load chart_watchlist.json.', true));

document.getElementById('indicators-toggle').addEventListener('click', () => {
  document.getElementById('legend').classList.toggle('expanded');
});

// Close the indicators panel when clicking anywhere outside it - the
// toggle button itself is inside #legend too, so this doesn't conflict
// with its own click handler above.
document.addEventListener('click', (e) => {
  const legend = document.getElementById('legend');
  if (legend.classList.contains('expanded') && !legend.contains(e.target)) {
    legend.classList.remove('expanded');
  }
});

// Column master checkboxes - turning a column off remembers each row's
// individual checked state and restores exactly that (not just "all
// on") when turned back on. Uses each row's own checkbox 'change' event
// (already wired above) rather than duplicating the enable/disable
// logic here.
const columnMemory = {};
document.querySelectorAll('.ind-col').forEach((col, colIndex) => {
  const master = col.querySelector('.col-master');
  const rowCheckboxes = [...col.querySelectorAll('.ind-row input[type="checkbox"]')];
  master.addEventListener('change', () => {
    if (!master.checked) {
      columnMemory[colIndex] = rowCheckboxes.map(cb => cb.checked);
      rowCheckboxes.forEach(cb => {
        if (cb.checked) {
          cb.checked = false;
          cb.dispatchEvent(new Event('change'));
        }
      });
    } else {
      const saved = columnMemory[colIndex];
      rowCheckboxes.forEach((cb, i) => {
        const shouldBeChecked = saved ? saved[i] : cb.checked;
        if (cb.checked !== shouldBeChecked) {
          cb.checked = shouldBeChecked;
          cb.dispatchEvent(new Event('change'));
        }
      });
    }
  });
});

document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', () => loadTimeframe(btn.dataset.tf));
});

// Toggle individual EMA / turnover-EMA lines on and off from the legend.
const toggleableSeries = { ...emaSeries, ema_cross: crossoverSeries, turnover: turnoverSeries, turnover_ema: turnoverEmaSeries };
document.querySelectorAll('#legend .ind-row[data-series]').forEach(row => {
  const key = row.dataset.series;
  const checkbox = row.querySelector('input');
  checkbox.addEventListener('change', () => {
    if (key === 'earnings') {
      earningsVisible = checkbox.checked;
      renderEarningsOverlay();
    } else if (key === 'rsi') {
      setRsiEnabled(checkbox.checked);
    } else {
      toggleableSeries[key].applyOptions({ visible: checkbox.checked });
    }
    row.classList.toggle('off', !checkbox.checked);
    updateOutputBox();
  });
});

// Multi-timeframe EMA 10 overlays - each one fetches its own timeframe's
// data on demand rather than just toggling visibility on an already-set
// series, since the data isn't loaded at all until first switched on.
document.querySelectorAll('#legend .ind-row[data-mtf-ema]').forEach(row => {
  const tf = row.dataset.mtfEma;
  const checkbox = row.querySelector('input');
  checkbox.addEventListener('change', () => {
    mtfEmaEnabled[tf] = checkbox.checked;
    loadMtfEma(tf);
    row.classList.toggle('off', !checkbox.checked);
    updateOutputBox();
  });
});

// "1/2 timeframes above" - same idea as above, but the target
// timeframe is recalculated relative to whatever the main chart is
// currently showing rather than being fixed.
document.querySelectorAll('#legend .ind-row[data-rel-ema]').forEach(row => {
  const key = row.dataset.relEma;

// RSI is now a genuinely separate chart instance below the main one -
// toggling it just shows/hides that whole section and lets the main
// chart's own container (flex: 1) naturally expand or shrink to fill
// the freed space, then resizes both chart instances to match.
let rsiEnabled = true;

let rsiSettingsPanelOpen = false;

// Makes `panelEl` draggable by mousedown-dragging on `handleEl`.
// Shared by all three floating panels (Style, Timeframe, RSI
// Settings) so they can always be pulled fully on-screen, however
// they were originally positioned (anchored to a corner, centered via
// transform, etc).
function makeDraggable(panelEl, handleEl) {
  handleEl.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    // Convert whatever positioning got it here (a centering transform,
    // a right-anchored offset, ...) into explicit top-left pixels
    // BEFORE the drag starts, using its actual on-screen box - so it
    // doesn't jump the moment you start dragging.
    const rect = panelEl.getBoundingClientRect();
    const parentRect = panelEl.offsetParent.getBoundingClientRect();
    const startLeft = rect.left - parentRect.left;
    const startTop = rect.top - parentRect.top;
    panelEl.style.left = startLeft + 'px';
    panelEl.style.top = startTop + 'px';
    panelEl.style.right = 'auto';
    panelEl.style.transform = 'none';

    const startX = e.clientX, startY = e.clientY;
    const onMove = (ev) => {
      panelEl.style.left = (startLeft + (ev.clientX - startX)) + 'px';
      panelEl.style.top = (startTop + (ev.clientY - startY)) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// Renders the RSI settings panel (⚙ button near the "RSI (14)" label).
// Changes apply LIVE to the current RSI display immediately (so you see
// the effect right away), but do NOT persist as "the default" for the
// next page load until "Set as Default" is explicitly clicked - same
// two-step pattern as the drawing tools' own Style/Timeframe panels
// (live preview vs. saved default are two different things).
function renderRsiSettingsPanel() {
  const container = document.getElementById('rsi-settings-overlay');
  if (!container) return;
  container.innerHTML = '';
  if (!rsiSettingsPanelOpen) return;

  const panel = document.createElement('div');
  panel.className = 'drawing-settings-panel rsi-settings-panel';
  // Centered within the spacious main chart area (this overlay's own
  // parent) - transform-based centering so it stays centered
  // regardless of the panel's actual height (which varies now that
  // each level has its own style controls).
  panel.style.top = '50%';
  panel.style.left = '50%';

  panel.addEventListener('mousedown', (e) => e.stopPropagation());
  panel.addEventListener('click', (e) => e.stopPropagation());

  function applyLive() {

  function makeStyleRows(styleObj) {
    const colorInput = document.createElement('input');
    colorInput.type = 'color';

    colorInput.addEventListener('input', () => { styleObj.color = colorInput.value; applyLive(); });

    const widthSelect = document.createElement('select');
    [1, 2, 3, 4].forEach((v) => {
      const opt = document.createElement('option');
      opt.value = String(v); opt.textContent = v + 'px';
      if (v === styleObj.lineWidth) opt.selected = true;

    });

    addRow('Thickness', widthSelect);

    const styleSelect = document.createElement('select');
    [['solid', 'Solid'], ['dashed', 'Dashed'], ['dotted', 'Dotted']].forEach(([v, label]) => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = label;
      if (v === styleObj.lineStyle) opt.selected = true;

    styleSelect.addEventListener('change', () => { styleObj.lineStyle = styleSelect.value; applyLive(); });
    addRow('Line', styleSelect);
  }

  addSectionHeader('Pane');
  const positionRow = document.createElement('div');
  positionRow.className = 'row';
  const positionLabel = document.createElement('label');
  positionLabel.textContent = 'Position';
  positionRow.appendChild(positionLabel);
  const positionSelect = document.createElement('select');
  [['bottom', 'Bottom'], ['top', 'Top']].forEach(([v, label]) => {
    const opt = document.createElement('option');

    rsiLayout.position = positionSelect.value;
    resizeChartsForRsiLayout();

  panel.appendChild(positionRow);

  addSectionHeader('RSI Line');
  makeStyleRows(rsiSettings.line);

  // Each level gets its own On/Off + threshold value, PLUS its own
  // independent color/thickness/line-type - no longer a shared style

  // different if you want them to.
  function addLevelSection(key, labelText) {
    addSectionHeader(labelText);

    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = 'On/Value';

    valueInput.type = 'number';
    valueInput.min = '0'; valueInput.max = '100'; valueInput.step = '1';
    valueInput.value = rsiSettings[key].value;
    valueInput.disabled = !cb.checked;

    cb.addEventListener('mousedown', (e) => e.stopPropagation());
    cb.addEventListener('change', () => {
      rsiSettings[key].enabled = cb.checked;
      valueInput.disabled = !cb.checked;

    valueInput.addEventListener('mousedown', (e) => e.stopPropagation());
    valueInput.addEventListener('change', () => {
