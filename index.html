function setRsiEnabled(enabled) {
  rsiEnabled = enabled;
  document.getElementById('rsi-chart-container').classList.toggle('hidden', !enabled);
  chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  if (enabled) {
    // createRsiChart() creates rsiChart/rsiSeries synchronously (the
    // only async part is the price-data fetch inside loadRsiData at
    // its end), so rsiPane.attach() can safely wire up to them right
    // after createRsiChart() returns.
    requestAnimationFrame(() => { createRsiChart(); rsiPane.attach(); });
  } else if (rsiChart) {
    // If a draw was in progress on RSI, drop it before the chart goes
    // away - the toolbar is shared now, so leaving a tool armed with
    // nowhere for its second click to land would be confusing.
    if (sharedToolState.lockedPane === 'rsi') sharedToolState.setTool('none');
    // Clear rsiPane's own bookkeeping/overlay BEFORE the chart itself
    // is destroyed - the series/handles it references are about to be
    // removed wholesale by rsiChart.remove() anyway.
    rsiPane.reset();
    rsiChart.remove();
    rsiChart = null;
    rsiSeries = null;
    rsiExtensionSeries = null;
  }
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : 'ok';
}

function parseAttrs(rest) {
  const attrs = {};
  const re = /(\w+)=("(?:[^"\\]|\\.)*"|\S+)/g;
  let m;
  while ((m = re.exec(rest)) !== null) {
    let val = m[2];
    if (val.startsWith('"')) val = val.slice(1, -1);
    attrs[m[1]] = val;
  }
  return attrs;
}

// --- Drawing tools: Trend Line, Horizontal Line, Ray, Horizontal Ray ---
// Horizontal Line reuses the existing LINE/priceLines mechanism (it's
// functionally identical to that protocol command). The other three are
// genuinely new shape types, each rendered as a dedicated 2-point line
// series. Rays extend to the edge of the currently LOADED data (not
// truly infinite, but as far as we have data for) - Horizontal Ray
// always extends rightward, matching the usual "project forward"
// convention; a regular Ray extends in whichever direction its second
// point implies, preserving the original slope via extrapolation.
//
// EVERYTHING BELOW is written to work against ANY chart pane, not just
// the main chart - createDrawingPane() is a self-contained factory that
// takes a small config (how to get the chart/series/container for a
// pane, its own bars array, whether its price scale is logarithmic) and
// returns a fully working set of drawing tools for that pane: its own
// selection state, its own drawings. mainPane and rsiPane below are
// two instances of the exact same code, both driven by ONE shared
// toolbar (sharedToolState, defined near where they're created) -
// there's a single set of tool buttons, and whichever pane you click
// into after arming a tool is the one that receives the draw. To add
// drawing tools to a future indicator pane: give it its own overlay
// <div> in the HTML (copy #rsi-drawing-overlay as a template - no new
// toolbar needed, the existing one already covers it), then call
// createDrawingPane({...}) for it the same way rsiPane is set up,
// passing the same sharedToolState object - no changes needed to the
// factory itself.

function timeToNumeric(t) {
  return typeof t === 'number' ? t : Math.floor(new Date(t + 'T00:00:00Z').getTime() / 1000);
}

function extrapolatePrice(time1, price1, time2, price2, targetTime, isLog) {
  const t1 = timeToNumeric(time1), t2 = timeToNumeric(time2), tt = timeToNumeric(targetTime);
  if (t2 === t1) return price2;
  // A straight line on a LOGARITHMIC price scale is straight in
  // LOG(price) space, not raw price - extrapolating with plain linear
  // price math computes a mathematically correct straight line in the
  // wrong space, so points that should lie on it (like the real second
  // click that defined the slope) end up visibly off it. isLog is
  // false for panes like RSI that use a normal linear 0-100 scale,
  // where plain linear math is already correct.
  if (isLog && price1 > 0 && price2 > 0) {
    const lp1 = Math.log(price1), lp2 = Math.log(price2);
    const slope = (lp2 - lp1) / (t2 - t1);
    return Math.exp(lp1 + slope * (tt - t1));
  }
  const slope = (price2 - price1) / (t2 - t1);
  return price1 + slope * (tt - t1);
}

// --- Style helpers shared by the settings panel (color/transparency/
// thickness/line-type) added below. Pane-agnostic: they only touch the
// drawing/priceLine data objects passed in, never a chart directly. ---
function colorWithOpacity(hex, opacity) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const r = parseInt(m[1].slice(0, 2), 16), g = parseInt(m[1].slice(2, 4), 16), b = parseInt(m[1].slice(4, 6), 16);
  return `rgba(${r},${g},${b},${opacity == null ? 1 : opacity})`;
}

function hexToRgbString(hex) {
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m) return hex;
  return `rgb(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)})`;
}

// Converts a drawing's stored time to whatever format the given bars
// array actually uses (date string for daily-and-up, Unix timestamp for
// intraday) - the same conversion the multi-timeframe EMA overlays
// already use (dateStringToTimestamp / date-extraction, both defined
// near the top of this file), applied here so a drawing made on one
// timeframe still renders sensibly - and stays draggable/hit-testable -
// on any other. When converting a date to intraday, snaps to the
// NEAREST actual loaded bar rather than raw midnight UTC, so
// findBarIndex() still finds a real bar to work with rather than
// landing between two bars.
//
// Returns null if the date falls entirely outside the currently loaded
// intraday window - intraday data typically covers far less history
// than daily+, so a long-range drawing's dates are very often outside
// it. Snapping to the nearest edge bar regardless (the original
// approach) meant two far-apart dates could BOTH collapse onto the
// SAME edge bar, turning what should be a long diagonal line into a
// near-vertical one. Callers treat null as "not representable on this
// pane's current timeframe" and skip rendering that point/shape rather
// than drawing something misleading.
function resolveDrawingTime(time, bars) {
  if (!bars.length) return time;
  const targetIsIntraday = typeof bars[0].time === 'number';
  const sourceIsIntraday = typeof time === 'number';
  if (targetIsIntraday === sourceIsIntraday) return time;
  if (targetIsIntraday) {
    const targetTs = dateStringToTimestamp(time);
    const firstBar = bars[0].time, lastBar = bars[bars.length - 1].time;
    const oneDay = 24 * 3600;
    if (targetTs < firstBar - oneDay || targetTs > lastBar + oneDay) return null;
    let best = bars[0], bestDiff = Math.abs(bars[0].time - targetTs);
    for (const b of bars) {
      const diff = Math.abs(b.time - targetTs);
      if (diff < bestDiff) { best = b; bestDiff = diff; }
    }
    return best.time;
  }
  return new Date(time * 1000).toISOString().slice(0, 10);
}

// Returns the two rendered {time, value} endpoints for a shape - for
// Ray/Horizontal Ray this includes the same edge-extrapolation used at
// render time, so hit-testing always lines up with what's actually
// drawn. `bars` is the pane's own bars array (main chart vs RSI can be
// showing different timeframes with different data) - also used to
// resolve the drawing's stored time into whatever format these bars
// use, via resolveDrawingTime, so a shape drawn on one timeframe still
// renders correctly when viewed on another.
function getShapePoints(drawing, bars, isLog) {
  let p1, p2;
  const t1 = resolveDrawingTime(drawing.time1, bars);
  if (t1 === null) return null;
  if (drawing.type === 'trendline') {
    const t2 = resolveDrawingTime(drawing.time2, bars);
    if (t2 === null) return null;
    p1 = { time: t1, value: drawing.price1 };
    p2 = { time: t2, value: drawing.price2 };
  } else if (drawing.type === 'ray') {
    const t2 = resolveDrawingTime(drawing.time2, bars);
    if (t2 === null) return null;
    const goingRight = timeToNumeric(t2) >= timeToNumeric(t1);
    const edgeTime = bars.length ? (goingRight ? bars[bars.length - 1].time : bars[0].time) : t2;
    const edgePrice = extrapolatePrice(t1, drawing.price1, t2, drawing.price2, edgeTime, isLog);
    p1 = { time: t1, value: drawing.price1 };
    p2 = { time: edgeTime, value: edgePrice };
  } else if (drawing.type === 'hray') {
    const edgeTime = bars.length ? bars[bars.length - 1].time : t1;
    p1 = { time: t1, value: drawing.price1 };
    p2 = { time: edgeTime, value: drawing.price1 };
  }
  return [p1, p2].sort((a, b) => timeToNumeric(a.time) - timeToNumeric(b.time));
}

// Like getShapePoints, but always returns the shape's REAL, directly-
// stored points rather than any auto-extrapolated edge. Used only to
// position selection UI (the move handle, Style/Delete toolbar) - a
// steep Ray's extrapolated edge can land at a price way outside the
// visible chart even though the ray itself correctly draws out to it,
// which was putting those controls far off in empty space. The user's
// actual two clicks are always somewhere near the visible chart, so
// anchoring UI to those instead keeps it sane regardless of how
// steep/far the ray extends. `bars` is used the same way as in
// getShapePoints, to resolve stored times into the current format -
// also returns null if either point can't be resolved here, same as
// getShapePoints.
function getAnchorPoints(drawing, bars) {
  const t1 = resolveDrawingTime(drawing.time1, bars);
  if (t1 === null) return null;
  if (drawing.type === 'hray') {
    return [{ time: t1, value: drawing.price1 }, { time: t1, value: drawing.price1 }];
  }
  const t2 = resolveDrawingTime(drawing.time2, bars);
  if (t2 === null) return null;
  return [
    { time: t1, value: drawing.price1 },
    { time: t2, value: drawing.price2 },
  ].sort((a, b) => timeToNumeric(a.time) - timeToNumeric(b.time));
}

// --- Distance from a point to a line segment, in pixel space - used to
// hit-test clicks against already-drawn shapes. Pane-agnostic. ---
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// Cheap style-only updates (color/opacity/thickness/line-type) via each
// object's own stored series/priceLine handle - pane-agnostic, since
// the handle itself already belongs to whichever chart created it.
function applyShapeStyle(d) {
  if (!d.series) return;
  d.series.applyOptions({
    color: colorWithOpacity(d.color, d.opacity != null ? d.opacity : 1),
    lineWidth: d.lineWidth || 2,
    lineStyle: LINE_STYLE_MAP[d.lineStyle || 'solid'],
  });
}

function applyHlineStyle(pl) {
  pl.lwcHandle.applyOptions({
    color: colorWithOpacity(pl.colorHex || '#2962ff', pl.opacity != null ? pl.opacity : 1),
    lineWidth: pl.lineWidth || 1,
    lineStyle: LINE_STYLE_MAP[pl.lineStyle || 'dashed'],
  });
}

// Renders the color/opacity/thickness/line-type panel for whichever
// drawing is selected. Pane-agnostic - `target` carries its own
// series/priceLine handle, and `kind` says which applyXStyle to use.
function renderStylePanel(container, x, y, target, kind, onVisibilityChange, onFullRefresh) {
  const panel = document.createElement('div');
  panel.className = 'drawing-settings-panel';
  panel.style.left = x + 'px';
  panel.style.top = y + 'px';
  panel.addEventListener('mousedown', (e) => e.stopPropagation());
  panel.addEventListener('click', (e) => e.stopPropagation());

  const dragHandle = document.createElement('div');
  dragHandle.className = 'panel-drag-handle';
  dragHandle.textContent = 'Style';
  panel.appendChild(dragHandle);
  makeDraggable(panel, dragHandle);

  const currentHex = kind === 'hline' ? (target.colorHex || '#2962ff') : (target.color || '#2962ff');
  const currentOpacity = target.opacity != null ? target.opacity : 1;
  const currentWidth = target.lineWidth || (kind === 'hline' ? 1 : 2);
  const currentStyle = target.lineStyle || (kind === 'hline' ? 'dashed' : 'solid');

  function applyChange() {
    if (kind === 'hline') applyHlineStyle(target);
    else applyShapeStyle(target);
    updateOutputBox();
  }

  function addRow(labelText, inputEl) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = labelText;
    row.appendChild(label);
    row.appendChild(inputEl);
    panel.appendChild(row);
  }

  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.value = currentHex;
  colorInput.addEventListener('input', () => {
    setDrawingColor(colorInput.value);
    syncSwatchSelection();
  });
  addRow('Color', colorInput);

  // 12 easily-distinguishable preset colors, chosen from the same set
  // COLOR_NAMES already recognizes - so picking one of these (unlike a
  // fully custom color) always gets a proper name in the Chart State
  // text output, not just the "blue" fallback.
  const SWATCH_PALETTE = [
    '#000000', '#2962ff', '#26a69a', '#ef5350', '#ff9800', '#8e24aa',
    '#e91e63', '#6d4c41', '#00acc1', '#f9a825', '#455a64', '#3949ab',
  ];
  const swatchEls = [];
  function syncSwatchSelection() {
    const cur = colorInput.value.toLowerCase();
    swatchEls.forEach(el => el.classList.toggle('selected', el.dataset.color.toLowerCase() === cur));
  }
  function setDrawingColor(hex) {
    if (kind === 'hline') {
      target.colorHex = hex;
      target.color = rgbToColorName(hexToRgbString(hex)) || 'blue';
    } else {
      target.color = hex;
    }
    applyChange();
  }
  const swatchGrid = document.createElement('div');
  swatchGrid.className = 'color-swatch-grid';
  SWATCH_PALETTE.forEach((hex) => {
    const sw = document.createElement('button');
    sw.className = 'color-swatch';
    sw.style.background = hex;
    sw.dataset.color = hex;
    sw.title = hex;
    sw.addEventListener('mousedown', (e) => e.stopPropagation());
    sw.addEventListener('click', (e) => {
      e.stopPropagation();
      colorInput.value = hex;
      setDrawingColor(hex);
      syncSwatchSelection();
    });
    swatchEls.push(sw);
    swatchGrid.appendChild(sw);
  });
  addRow('', swatchGrid);
  syncSwatchSelection();

  const opInput = document.createElement('input');
  opInput.type = 'range';
  opInput.min = '10'; opInput.max = '100'; opInput.step = '5';
  opInput.value = String(Math.round(currentOpacity * 100));
  opInput.addEventListener('input', () => {
    target.opacity = parseInt(opInput.value, 10) / 100;
    applyChange();
  });
  addRow('Opacity', opInput);

  const wSelect = document.createElement('select');
  [1, 2, 3, 4].forEach((v) => {
    const opt = document.createElement('option');
    opt.value = String(v);
    opt.textContent = v + 'px';
    if (v === currentWidth) opt.selected = true;
    wSelect.appendChild(opt);
  });
  wSelect.addEventListener('change', () => {
    target.lineWidth = parseInt(wSelect.value, 10);
    applyChange();
  });
  addRow('Thickness', wSelect);

  const sSelect = document.createElement('select');
  [['solid', 'Solid'], ['dashed', 'Dashed'], ['dotted', 'Dotted']].forEach(([v, label]) => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = label;
    if (v === currentStyle) opt.selected = true;
    sSelect.appendChild(opt);
  });
  sSelect.addEventListener('change', () => {
    target.lineStyle = sSelect.value;
    applyChange();
  });
  addRow('Line', sSelect);

  // "Set as Default" saves THIS drawing's current style (color/
  // opacity/thickness/line-type) as the default for every future
  // drawing of this same tool type - separate per tool (Trend Line,
  // Ray, etc. each remember their own), separate from the Timeframe
  // panel's own default below. "Restore Default" does the reverse:
  // resets this drawing back to whatever that saved (or factory,
  // if nothing's been saved) default currently is.
  const toolType = kind === 'hline' ? 'hline' : target.type;
  const actionsRow = document.createElement('div');
  actionsRow.className = 'panel-actions-row';

  const setDefaultBtn = document.createElement('button');
  setDefaultBtn.textContent = 'Set as Default';
  setDefaultBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  setDefaultBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const styleToSave = kind === 'hline'
      ? { color: target.color, colorHex: target.colorHex, opacity: target.opacity, lineWidth: target.lineWidth, lineStyle: target.lineStyle }
      : { color: target.color, opacity: target.opacity, lineWidth: target.lineWidth, lineStyle: target.lineStyle };
    setToolStyleDefault(toolType, styleToSave);
    setStatus('Saved as the default style for this tool.', false);
  });
  actionsRow.appendChild(setDefaultBtn);

  const restoreDefaultBtn = document.createElement('button');
  restoreDefaultBtn.textContent = 'Restore Default';
  restoreDefaultBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  restoreDefaultBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const style = getEffectiveStyleDefault(toolType);
    if (kind === 'hline') { target.color = style.color; target.colorHex = style.colorHex; }
    else target.color = style.color;
    target.opacity = style.opacity;
    target.lineWidth = style.lineWidth;
    target.lineStyle = style.lineStyle;
    applyChange();
    // Multiple fields just changed at once (color, opacity, thickness,
    // line type) - re-render the whole panel so the color swatch/
    // slider/dropdowns all reflect the restored values, rather than
    // trying to update each input individually.
    if (onFullRefresh) onFullRefresh();
  });
  actionsRow.appendChild(restoreDefaultBtn);
  panel.appendChild(actionsRow);

  container.appendChild(panel);
}

// Separate small panel just for "which timeframes does this drawing
// show on" - split out from the Style panel so it's its own menu.
// Two columns, combined with AND (both must allow a timeframe for the
// drawing to show there):
//   - Absolute: one checkbox per real timeframe (5m/15m/1H/D/W/M/Q).
//   - Relative to home: an offset from the timeframe this drawing was
//     CREATED on (its "home" - fixed forever, doesn't change if you
//     later view it elsewhere) - 3/2/1 higher, current (home) only,
//     1/2/3 lower. "Current only" is mutually exclusive with the six
//     higher/lower boxes; those six can combine freely with each
//     other.
// Each column also has its own "On" master switch - this does NOT
// touch the individual checkboxes' values at all. While a column is
// off, it's simply bypassed (treated as fully permissive) regardless
// of what its individual boxes say, and those boxes are shown disabled
// so it's clear they're not currently in effect. Flip the column back
// on and whatever was checked before is exactly what applies again -
// nothing to remember or restore, since nothing was ever changed.
// `onVisibilityChange` re-applies the drawing's visible/lineVisible
// state for whichever timeframe is currently active, since toggling a
// box for a DIFFERENT timeframe shouldn't change what's shown right
// now.
function renderTimeframePanel(container, x, y, target, kind, onVisibilityChange, onFullRefresh) {
  const panel = document.createElement('div');
  panel.className = 'drawing-settings-panel tf-panel';
  panel.style.left = x + 'px';
  panel.style.top = y + 'px';
  panel.addEventListener('mousedown', (e) => e.stopPropagation());
  panel.addEventListener('click', (e) => e.stopPropagation());

  const dragHandle = document.createElement('div');
  dragHandle.className = 'panel-drag-handle';
  dragHandle.textContent = 'Timeframe';
  panel.appendChild(dragHandle);
  makeDraggable(panel, dragHandle);

  // Drawings made before this feature existed won't have these fields;
  // treat that as "no restriction, column on" rather than invisible.
  if (!target.timeframes) target.timeframes = defaultTimeframes();
  if (target.timeframesColumnEnabled === undefined) target.timeframesColumnEnabled = true;
  if (!target.relativeTF) target.relativeTF = defaultRelativeTF();
  if (target.relativeTFColumnEnabled === undefined) target.relativeTFColumnEnabled = true;

  function commitChange() {
    if (onVisibilityChange) onVisibilityChange();
    updateOutputBox();
  }

  const cols = document.createElement('div');
  cols.className = 'tf-two-col';

  // --- Column 1: absolute timeframes ---
  const col1 = document.createElement('div');
  col1.className = 'tf-col';
  const absKeys = Object.keys(TIMEFRAME_META);
  const absCheckboxes = [];

  const master1 = document.createElement('label');
  master1.className = 'tf-checkbox tf-master';
  const master1Cb = document.createElement('input');
  master1Cb.type = 'checkbox';
  master1Cb.checked = target.timeframesColumnEnabled !== false;
  master1Cb.addEventListener('mousedown', (e) => e.stopPropagation());
  master1Cb.addEventListener('change', () => {
    target.timeframesColumnEnabled = master1Cb.checked;
    absCheckboxes.forEach(({ cb }) => { cb.disabled = !master1Cb.checked; });
    commitChange();
  });
  master1.appendChild(master1Cb);
  master1.appendChild(document.createTextNode('On'));
  col1.appendChild(master1);

  absKeys.forEach((tfKey) => {
    const label = document.createElement('label');
    label.className = 'tf-checkbox';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = target.timeframes[tfKey] !== false;
    cb.disabled = !master1Cb.checked;
    cb.addEventListener('mousedown', (e) => e.stopPropagation());
    cb.addEventListener('change', () => {
      target.timeframes[tfKey] = cb.checked;
      commitChange();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(TIMEFRAME_META[tfKey].short));
    col1.appendChild(label);
    absCheckboxes.push({ cb, key: tfKey });
  });
  cols.appendChild(col1);

  // --- Column 2: relative to home timeframe ---
  const col2 = document.createElement('div');
  col2.className = 'tf-col';
  const relKeys = ['higher3', 'higher2', 'higher1', 'current', 'lower1', 'lower2', 'lower3'];
  const relLabels = { higher3: '+3', higher2: '+2', higher1: '+1', current: '=', lower1: '-1', lower2: '-2', lower3: '-3' };
  const relCheckboxes = [];

  const master2 = document.createElement('label');
  master2.className = 'tf-checkbox tf-master';
  const master2Cb = document.createElement('input');
  master2Cb.type = 'checkbox';
  master2Cb.checked = target.relativeTFColumnEnabled !== false;
  master2Cb.addEventListener('mousedown', (e) => e.stopPropagation());
  master2Cb.addEventListener('change', () => {
    target.relativeTFColumnEnabled = master2Cb.checked;
    relCheckboxes.forEach(({ cb }) => { cb.disabled = !master2Cb.checked; });
    commitChange();
  });
  master2.appendChild(master2Cb);
  master2.appendChild(document.createTextNode('On'));
  col2.appendChild(master2);

  relKeys.forEach((relKey) => {
    const label = document.createElement('label');
    label.className = 'tf-checkbox';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = target.relativeTF[relKey] !== false;
    cb.disabled = !master2Cb.checked;
    cb.addEventListener('mousedown', (e) => e.stopPropagation());
    cb.addEventListener('change', () => {
      if (relKey === 'current') {
        // "current" (home) is mutually exclusive with the six higher/
        // lower boxes - checking it clears both sides entirely.
        target.relativeTF.current = cb.checked;
        if (cb.checked) relKeys.forEach((k) => { if (k !== 'current') target.relativeTF[k] = false; });
      } else {
        const side = relKey.startsWith('higher') ? 'higher' : 'lower';
        if (cb.checked) {
          // "N higher/lower" still MEANS a cumulative range ("up to N"
          // - matchesRelativeTF takes the highest checked value on
          // this side), but only the one box actually picked shows
          // ticked - picking 2 unticks 3 (or 1), so exactly one box per
          // side is ever visibly checked, like a radio button.
          target.relativeTF.current = false;
          [1, 2, 3].forEach((n) => { target.relativeTF[side + n] = (side + n === relKey); });
        } else {
          // Unticking the current selection just clears this side
          // entirely (no higher/lower restriction from this side).
          target.relativeTF[relKey] = false;
        }
      }
      relCheckboxes.forEach(({ cb: otherCb, key }) => { otherCb.checked = target.relativeTF[key] !== false; });
      commitChange();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(relLabels[relKey]));
    col2.appendChild(label);
    relCheckboxes.push({ cb, key: relKey });
  });
  cols.appendChild(col2);

  panel.appendChild(cols);

  // Same "Set as Default" / "Restore Default" pattern as the Style
  // panel, but for the timeframe checkboxes - completely separate
  // saved default, per tool type, from the style one above.
  const toolType = kind === 'hline' ? 'hline' : target.type;
  const actionsRow = document.createElement('div');
  actionsRow.className = 'panel-actions-row';

  const setDefaultBtn = document.createElement('button');
  setDefaultBtn.textContent = 'Set as Default';
  setDefaultBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  setDefaultBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setToolTimeframeDefault(toolType, {
      timeframes: Object.assign({}, target.timeframes),
      timeframesColumnEnabled: target.timeframesColumnEnabled,
      relativeTF: Object.assign({}, target.relativeTF),
      relativeTFColumnEnabled: target.relativeTFColumnEnabled,
    });
  });
  actionsRow.appendChild(setDefaultBtn);

  const restoreDefaultBtn = document.createElement('button');
  restoreDefaultBtn.textContent = 'Restore Default';
  restoreDefaultBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  restoreDefaultBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const tf = getEffectiveTimeframeDefault(toolType);
    target.timeframes = tf.timeframes;
    target.timeframesColumnEnabled = tf.timeframesColumnEnabled;
    target.relativeTF = tf.relativeTF;
    target.relativeTFColumnEnabled = tf.relativeTFColumnEnabled;
    commitChange();
    // Every checkbox in both columns just changed at once - re-render
    // the whole panel rather than updating 14 checkboxes individually.
    if (onFullRefresh) onFullRefresh();
  });
  actionsRow.appendChild(restoreDefaultBtn);
  panel.appendChild(actionsRow);

  container.appendChild(panel);
}


// Full drawing-tools controller for one chart pane. cfg:
//   getChart()        - returns the pane's current chart instance
//   getSeries()        - returns the pane's own price series
//   getContainerEl()   - returns the pane's own container div (for
//                        getBoundingClientRect/clientWidth/clientHeight)
//   getBars()          - returns the pane's own current bars array
//   getCurrentTFKey()  - returns this pane's current timeframe key
//                        (one of TIMEFRAME_META's keys) - used to check
//                        a drawing's own per-timeframe visibility
//                        checkboxes against whatever's actually showing
//   overlayId          - id of this pane's selection-overlay <div>
//   paneId             - a short unique string ('main', 'rsi', ...)
//                        identifying this pane, used for the
//                        cross-pane draw lock in cfg.shared below
//   shared             - the ONE sharedToolState object (see below,
//                        near where mainPane/rsiPane are created) that
//                        every pane's factory instance reads/writes -
//                        there's a single toolbar now, not one per
//                        pane, so which tool is armed has to live
//                        outside any single pane's own closure
//   isLog              - whether this pane's price scale is logarithmic
//                        (main chart: rightPriceScale.mode is
//                        PriceScaleMode.Logarithmic, so isLog: true;
//                        RSI: a plain 0-100 linear scale, isLog: false)
//
// isLog is NOT auto-detected from the chart's own options - it's a
// hardcoded assumption baked into each createDrawingPane({...}) call
// below. If a pane's price-scale mode is EVER changed (e.g. the main
// chart's rightPriceScale.mode gets switched from Logarithmic to
// Normal/linear, or vice versa for RSI), its isLog value here must be
// updated to match, or two things will be visibly wrong: Ray's
// extrapolated edge won't be genuinely colinear with the real click
// points (extrapolatePrice), and dragging a shape via its midpoint
// move-handle will distort its slope/angle (startTranslateDrag) - both
// are the same category of bug that was hunted down and fixed earlier
// in this file's history (see extrapolatePrice's own comment).
// Every chart-instance reference goes through the getters above rather
// than being captured once, so a pane whose chart gets destroyed and
// recreated (like RSI, toggled on/off) keeps working correctly after
// attach() is called again on the new instance.
function createDrawingPane(cfg) {
  let pendingDrawPoint = null;
  let previewSeries = null;
  let previewRafId = null;
  let previewRafData = null;
  let overlayRafId = null;
  let selectedDrawing = null;
  let settingsPanelOpen = false;
  let timeframePanelOpen = false;
  const userDrawings = [];
  const priceLines = [];

  function screenToChartXY(evt) {
    const rect = cfg.getContainerEl().getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function findBarIndex(t) {
    const tn = timeToNumeric(t);
    return cfg.getBars().findIndex(b => timeToNumeric(b.time) === tn);
  }

  // Whether `d` (a shape or an hline) should be visible on THIS pane's
  // currently active timeframe. Both the absolute "Show on" column
  // (per-timeframe checkboxes, default all-true) AND the "Relative to
  // home" column (offset from the timeframe it was created on, default
  // all-true) must allow it - either one restricting is enough to hide
  // it, matching the AND behavior requested for these two columns.
  // Each column has its own on/off switch (timeframesColumnEnabled /
  // relativeTFColumnEnabled) that's independent of the individual
  // checkboxes - turning a column off just means it's ignored
  // (bypassed, as if fully permissive) while it's off; the individual
  // checkboxes underneath are never touched, so whatever was set stays
  // there and takes effect again the moment the column's switched back on.
  function isVisibleForCurrentTF(d) {
    const tfKey = cfg.getCurrentTFKey();
    const absoluteOk = d.timeframesColumnEnabled === false || !d.timeframes || d.timeframes[tfKey] !== false;
    const relativeOk = d.relativeTFColumnEnabled === false || matchesRelativeTF(d, tfKey);
    return absoluteOk && relativeOk;
  }

  // Re-applies a drawing's visibility for whichever timeframe is
  // currently active - called right after a timeframe checkbox changes
  // in the Style panel, and after switching timeframes (refreshForTF).
  function applyVisibility(target, kind) {
    const visible = isVisibleForCurrentTF(target);
    if (kind === 'hline') {
      target.lwcHandle.applyOptions({ lineVisible: visible, axisLabelVisible: visible });
    } else if (target.series) {
      target.series.applyOptions({ visible });
    }
  }

  function renderDrawing(drawing) {
    const points = getShapePoints(drawing, cfg.getBars(), cfg.isLog);
    if (!points) {
      // Not representable on this pane's current timeframe (its dates
      // fall entirely outside the loaded bars - see resolveDrawingTime)
      // - don't create a series with corrupted data, just skip it.
      drawing.series = null;
      return;
    }
    const lineSeries = cfg.getChart().addLineSeries({
      color: colorWithOpacity(drawing.color, drawing.opacity != null ? drawing.opacity : 1),
      lineWidth: drawing.lineWidth || 2,
      lineStyle: LINE_STYLE_MAP[drawing.lineStyle || 'solid'],
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      visible: isVisibleForCurrentTF(drawing),
      // Excludes this series from the price scale's auto-fit
      // computation - repeatedly recomputing autoscale on every
      // setData() call is a documented trigger for this library's
      // "Maximum call stack size exceeded" crash.
      autoscaleInfoProvider: () => null,
    });
    lineSeries.setData(points);
    drawing.series = lineSeries;
  }

  function addUserDrawing(type, time1, price1, time2, price2, color, source) {
    const style = getEffectiveStyleDefault(type);
    const tf = getEffectiveTimeframeDefault(type);
    const drawing = {
      type, time1, price1, time2, price2, source,
      // Pasted Claude commands keep whatever color they explicitly
      // specified; a user-drawn shape uses this tool's saved (or
      // factory) default color instead of always being blue.
      color: source === 'claude' ? color : style.color,
      opacity: style.opacity,
      lineWidth: style.lineWidth,
      lineStyle: style.lineStyle,
      timeframes: tf.timeframes,
      timeframesColumnEnabled: tf.timeframesColumnEnabled,
      relativeTF: tf.relativeTF,
      relativeTFColumnEnabled: tf.relativeTFColumnEnabled,
      homeTF: cfg.getCurrentTFKey(),
    };
    renderDrawing(drawing);
    userDrawings.push(drawing);
    updateOutputBox();
    return drawing;
  }

  function addHline(price, colorName, label, source, lineWidth, lineStyle) {
    let finalColorName, colorHex, finalLineWidth, finalLineStyle, opacity;
    if (source === 'claude') {
      // Pasted LINE commands keep their own explicit color/style
      // (dashed/1px by convention - see handleHlineCommand).
      finalColorName = colorName || 'blue';
      colorHex = colorMap[finalColorName] || '#2962ff';
      finalLineWidth = lineWidth || 2;
      finalLineStyle = lineStyle || 'solid';
      opacity = 1;
    } else {
      const style = getEffectiveStyleDefault('hline');
      finalColorName = style.color;
      colorHex = style.colorHex;
      finalLineWidth = style.lineWidth;
      finalLineStyle = style.lineStyle;
      opacity = style.opacity;
    }
    const tf = getEffectiveTimeframeDefault('hline');
    const homeTF = cfg.getCurrentTFKey();
    const visible = isVisibleForCurrentTF({
      timeframes: tf.timeframes, timeframesColumnEnabled: tf.timeframesColumnEnabled,
      relativeTF: tf.relativeTF, relativeTFColumnEnabled: tf.relativeTFColumnEnabled, homeTF,
    });
    const handle = cfg.getSeries().createPriceLine({
      price, color: colorHex, lineWidth: finalLineWidth, lineStyle: LINE_STYLE_MAP[finalLineStyle],
      axisLabelVisible: visible, lineVisible: visible, title: label || '',
    });
    const pl = {
      price, color: finalColorName, colorHex, opacity, lineWidth: finalLineWidth, lineStyle: finalLineStyle,
      timeframes: tf.timeframes, timeframesColumnEnabled: tf.timeframesColumnEnabled,
      relativeTF: tf.relativeTF, relativeTFColumnEnabled: tf.relativeTFColumnEnabled, homeTF,
      label: label || '', lwcHandle: handle, source,
    };
    priceLines.push(pl);
    updateOutputBox();
    return pl;
  }

  function cancelPendingDraw() {
    if (previewRafId !== null) { cancelAnimationFrame(previewRafId); previewRafId = null; }
    previewRafData = null;
    if (previewSeries) { cfg.getChart().removeSeries(previewSeries); previewSeries = null; }
    pendingDrawPoint = null;
    // Release the cross-pane draw lock (see cfg.shared below) if this
    // pane was the one holding it.
    if (cfg.shared.lockedPane === cfg.paneId) cfg.shared.lockedPane = null;
  }

  // Called whenever the (now shared, single) toolbar's selected tool
  // changes - cancels anything this pane had in progress and clears
  // its own selection, regardless of which pane the tool change
  // actually originated from.
  function cancelAndDeselect() {
    cancelPendingDraw();
    selectDrawing(null);
  }

  function selectDrawing(sel) {
    selectedDrawing = sel;
    settingsPanelOpen = false;
    timeframePanelOpen = false;
    renderSelectionOverlay();
  }

  function redrawShape(drawing) {
    if (drawing.series) cfg.getChart().removeSeries(drawing.series);
    renderDrawing(drawing);
  }

  // Drag-to-move for the midpoint handle: translates every point of the
  // shape by the same bar-offset (snapped to real bars) and price
  // ratio (not a raw additive delta - see the isLog comment on
  // extrapolatePrice above for why a ratio is needed to keep the
  // visual angle constant on a logarithmic pane).
  function startTranslateDrag(d, evt) {
    evt.preventDefault();
    evt.stopPropagation();
    const series = cfg.getSeries();
    const startXY = screenToChartXY(evt);
    const startTime = cfg.getChart().timeScale().coordinateToTime(startXY.x);
    const startPrice = series.coordinateToPrice(startXY.y);
    if (startTime === null || startPrice === null || (cfg.isLog && startPrice <= 0)) return;
    const startBarIdx = findBarIndex(startTime);
    if (startBarIdx === -1) return;

    const origPrice1 = d.price1, origBarIdx1 = findBarIndex(resolveDrawingTime(d.time1, cfg.getBars()));
    const origPrice2 = d.price2;
    const origBarIdx2 = d.type !== 'hray' && d.time2 != null ? findBarIndex(resolveDrawingTime(d.time2, cfg.getBars())) : null;

    const onMove = (ev) => {
      const bars = cfg.getBars();
      const { x, y } = screenToChartXY(ev);
      const t = cfg.getChart().timeScale().coordinateToTime(x);
      const p = series.coordinateToPrice(y);
      if (t === null || p === null || (cfg.isLog && p <= 0)) return;
      const curBarIdx = findBarIndex(t);
      if (curBarIdx === -1) return;
      let barDelta = curBarIdx - startBarIdx;
      // Clamp the shift so BOTH points stay within the loaded bars
      // range together. Without this, whichever point hits the edge
      // first silently freezes there while the other keeps moving -
      // which looks like the whole line pivoting around the frozen
      // point instead of translating as a rigid unit.
      for (const idx of [origBarIdx1, origBarIdx2]) {
        if (idx === null || idx === -1) continue;
        barDelta = Math.max(-idx, Math.min(bars.length - 1 - idx, barDelta));
      }
      const priceDelta = p - startPrice;
      const priceRatio = cfg.isLog ? p / startPrice : null;

      if (origBarIdx1 !== -1 && bars[origBarIdx1 + barDelta]) {
        d.time1 = bars[origBarIdx1 + barDelta].time;
        d.price1 = cfg.isLog ? origPrice1 * priceRatio : origPrice1 + priceDelta;
      }
      if (origBarIdx2 !== null && origBarIdx2 !== -1 && bars[origBarIdx2 + barDelta]) {
        d.time2 = bars[origBarIdx2 + barDelta].time;
        d.price2 = cfg.isLog ? origPrice2 * priceRatio : origPrice2 + priceDelta;
      }
      redrawShape(d);
      renderSelectionOverlay();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      updateOutputBox();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function deleteSelectedDrawing() {
    if (!selectedDrawing) return;
    const chart = cfg.getChart(), series = cfg.getSeries();
    if (selectedDrawing.kind === 'shape') {
      const idx = userDrawings.indexOf(selectedDrawing.ref);
      if (idx !== -1) {
        if (selectedDrawing.ref.series) chart.removeSeries(selectedDrawing.ref.series);
        userDrawings.splice(idx, 1);
      }
    } else if (selectedDrawing.kind === 'hline') {
      const idx = priceLines.indexOf(selectedDrawing.ref);
      if (idx !== -1) {
        series.removePriceLine(selectedDrawing.ref.lwcHandle);
        priceLines.splice(idx, 1);
      }
    }
    selectedDrawing = null;
    settingsPanelOpen = false;
    timeframePanelOpen = false;
    const el = document.getElementById(cfg.overlayId);
    if (el) el.innerHTML = '';
    updateOutputBox();
    setStatus('Drawing deleted.', false);
  }

  function findDrawingAt(x, y) {
    const chart = cfg.getChart(), series = cfg.getSeries(), bars = cfg.getBars();
    const HIT = 6;
    for (const d of userDrawings) {
      const pts = getShapePoints(d, bars, cfg.isLog);
      if (!pts) continue;
      const [p1, p2] = pts;
      const x1 = chart.timeScale().timeToCoordinate(p1.time);
      const y1 = series.priceToCoordinate(p1.value);
      const x2 = chart.timeScale().timeToCoordinate(p2.time);
      const y2 = series.priceToCoordinate(p2.value);
      if (x1 === null || y1 === null || x2 === null || y2 === null) continue;
      if (distToSegment(x, y, x1, y1, x2, y2) <= HIT) return { kind: 'shape', ref: d };
    }
    for (const pl of priceLines) {
      const y1 = series.priceToCoordinate(pl.price);
      if (y1 === null) continue;
      if (Math.abs(y - y1) <= HIT) return { kind: 'hline', ref: pl };
    }
    return null;
  }

  // Renders the small floating toolbar (⚙ Style, 🗑 Delete) for the
  // current selection, and the style panel underneath it if open.
  function renderActionBar(container, x, y, target, kind) {
    const bar = document.createElement('div');
    bar.className = 'drawing-toolbar-float';
    bar.style.left = x + 'px';
    bar.style.top = y + 'px';

    const settingsBtn = document.createElement('button');
    settingsBtn.textContent = '⚙ Style';
    settingsBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsPanelOpen = !settingsPanelOpen;
      if (settingsPanelOpen) timeframePanelOpen = false;
      renderSelectionOverlay();
    });
    bar.appendChild(settingsBtn);

    const tfBtn = document.createElement('button');
    tfBtn.textContent = '🕐 Timeframe';
    tfBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    tfBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      timeframePanelOpen = !timeframePanelOpen;
      if (timeframePanelOpen) settingsPanelOpen = false;
      renderSelectionOverlay();
    });
    bar.appendChild(tfBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑 Delete';
    delBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteSelectedDrawing(); });
    bar.appendChild(delBtn);

    container.appendChild(bar);

    if (settingsPanelOpen) renderStylePanel(container, x, y + 34, target, kind, () => applyVisibility(target, kind), renderSelectionOverlay);
    if (timeframePanelOpen) renderTimeframePanel(container, x, y + 34, target, kind, () => applyVisibility(target, kind), renderSelectionOverlay);
  }

  // Renders the selection handles (draggable circles at each editable
  // point) and the floating Style/Delete toolbar for whichever drawing
  // is currently selected. Plain HTML positioned via the chart's own
  // time/price-to-coordinate conversion - called on selection change,
  // on drag, and whenever the visible range changes (pan/zoom/resize)
  // so handles track the chart.
  function renderSelectionOverlay() {
    const container = document.getElementById(cfg.overlayId);
    if (!container) return;
    container.innerHTML = '';
    if (!selectedDrawing) return;

    const chart = cfg.getChart(), series = cfg.getSeries(), containerEl = cfg.getContainerEl();
    if (!chart || !series || !containerEl) return;
    const bars = cfg.getBars();

    // The overlay uses overflow:visible (so the style panel isn't
    // clipped), but that means anything positioned outside the actual
    // pane - a point scrolled off-screen, or a Ray's far edge - just
    // renders wherever those coordinates land on the page (into the
    // watchlist, the header row, a neighboring pane, etc), since
    // nothing was clipping it. Every handle/button below is gated on
    // this check instead of being trusted to land inside the pane.
    const priceScaleWidth = chart.priceScale('right').width();
    const maxX = containerEl.clientWidth - priceScaleWidth;
    const maxY = containerEl.clientHeight;
    function inBounds(x, y) {
      return x !== null && y !== null && x >= 0 && x <= maxX && y >= 0 && y <= maxY;
    }

    function makeHandle(x, y, onMove, extraClass) {
      if (!inBounds(x, y)) return;
      const h = document.createElement('div');
      h.className = 'drawing-handle' + (extraClass ? ' ' + extraClass : '');
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.addEventListener('mousedown', (evt) => {
        evt.preventDefault();
        evt.stopPropagation();
        const move = (ev) => onMove(ev);
        const up = () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          updateOutputBox();
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
      container.appendChild(h);
    }

    if (selectedDrawing.kind === 'shape') {
      const d = selectedDrawing.ref;
      const resolvedTime1 = resolveDrawingTime(d.time1, bars);
      const x1 = resolvedTime1 === null ? null : chart.timeScale().timeToCoordinate(resolvedTime1);
      const y1 = series.priceToCoordinate(d.price1);
      makeHandle(x1, y1, (ev) => {
        const { x, y } = screenToChartXY(ev);
        const t = chart.timeScale().coordinateToTime(x);
        const p = series.coordinateToPrice(y);
        if (t === null || p === null) return;
        // Same same-bar crash risk as the live preview below - refuse
        // a drag position that would land on the other point's bar.
        if (d.type === 'hray') {
          const edgeTime = bars.length ? bars[bars.length - 1].time : null;
          if (edgeTime !== null && timeToNumeric(t) === timeToNumeric(edgeTime)) return;
        } else if (timeToNumeric(t) === timeToNumeric(resolveDrawingTime(d.time2, bars))) {
          return;
        }
        d.time1 = t; d.price1 = p;
        redrawShape(d);
        renderSelectionOverlay();
      });

      if (d.type === 'trendline' || d.type === 'ray') {
        const resolvedTime2 = resolveDrawingTime(d.time2, bars);
        const x2 = resolvedTime2 === null ? null : chart.timeScale().timeToCoordinate(resolvedTime2);
        const y2 = series.priceToCoordinate(d.price2);
        makeHandle(x2, y2, (ev) => {
          const { x, y } = screenToChartXY(ev);
          const t = chart.timeScale().coordinateToTime(x);
          const p = series.coordinateToPrice(y);
          if (t === null || p === null) return;
          if (timeToNumeric(t) === timeToNumeric(resolveDrawingTime(d.time1, bars))) return;
          d.time2 = t; d.price2 = p;
          redrawShape(d);
          renderSelectionOverlay();
        });
      }

      const anchorPts = getAnchorPoints(d, bars);
      if (anchorPts) {
        const [rp1, rp2] = anchorPts;
        const mx1 = chart.timeScale().timeToCoordinate(rp1.time);
        const my1 = series.priceToCoordinate(rp1.value);
        const mx2 = chart.timeScale().timeToCoordinate(rp2.time);
        const my2 = series.priceToCoordinate(rp2.value);
        if (mx1 !== null && my1 !== null && mx2 !== null && my2 !== null) {
          const midX = (mx1 + mx2) / 2, midY = (my1 + my2) / 2;
          if (inBounds(midX, midY)) {
            // Horizontal Ray only has one real point, so its own anchor
            // handle above already does this job - skip the redundant
            // overlapping handle here.
            if (d.type !== 'hray') {
              const moveHandle = document.createElement('div');
              moveHandle.className = 'drawing-handle drawing-handle-move';
              moveHandle.style.left = midX + 'px';
              moveHandle.style.top = midY + 'px';
              moveHandle.addEventListener('mousedown', (evt) => startTranslateDrag(d, evt));
              container.appendChild(moveHandle);
            }

            const barY = Math.min(my1, my2) - 4;
            if (inBounds(midX, barY)) renderActionBar(container, midX, barY, d, 'shape');
          }
        }
      }
    } else if (selectedDrawing.kind === 'hline') {
      const pl = selectedDrawing.ref;
      const y = series.priceToCoordinate(pl.price);
      const midX = maxX / 2;
      makeHandle(midX, y, (ev) => {
        const { y: ny } = screenToChartXY(ev);
        const p = series.coordinateToPrice(ny);
        if (p === null) return;
        pl.price = p;
        pl.lwcHandle.applyOptions({ price: p });
        renderSelectionOverlay();
      });
      if (inBounds(midX, y - 4)) renderActionBar(container, midX, y - 4, pl, 'hline');
    }
  }

  // Schedules one extra renderSelectionOverlay() pass one frame from
  // now, coalesced (same pattern as previewRafId above) so rapid-fire
  // callers - a continuous mouse-wheel zoom fires many
  // subscribeVisibleLogicalRangeChange events in quick succession -
  // don't queue up a growing backlog of redundant frames. Exists
  // because renderSelectionOverlay's own timeToCoordinate/
  // priceToCoordinate reads can lag one frame behind a just-applied
  // timeScale range change (see the callers below), landing a selected
  // shape's handles - most visibly the midpoint - off the
  // correctly-rendered line for that one frame.
  function scheduleOverlaySync() {
    if (overlayRafId !== null) return;
    overlayRafId = requestAnimationFrame(() => {
      overlayRafId = null;
      renderSelectionOverlay();
    });
  }

  function flushPreview() {
    previewRafId = null;
    if (!previewSeries || !pendingDrawPoint || !previewRafData) return;
    const pts = [
      { time: pendingDrawPoint.time, value: pendingDrawPoint.price },
      { time: previewRafData.time, value: previewRafData.price },
    ].sort((a, b) => timeToNumeric(a.time) - timeToNumeric(b.time));
    previewSeries.setData(pts);
  }

  // Escape cancels an in-progress draw or clears a selection. Delete/
  // Backspace removes the selected drawing - guarded against firing
  // while focus is in a text field. Returns true if it handled the key,
  // so the shared listener can stop after whichever pane actually owns
  // the current selection/in-progress draw.
  function handleKeydown(e) {
    if (e.key === 'Escape') {
      if (cfg.shared.tool !== 'none') { cfg.shared.setTool('none'); return true; }
      if (selectedDrawing) { selectDrawing(null); return true; }
      return false;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawing) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return false;
      e.preventDefault();
      deleteSelectedDrawing();
      return true;
    }
    return false;
  }

  // Wires this pane's chart-event subscriptions to whatever chart/
  // series cfg.getChart()/getSeries() currently point to. Call this
  // once for a pane that never changes (the main chart), and again
  // every time a pane's chart is destroyed and recreated (RSI, toggled
  // on/off). The toolbar itself is shared/external now (see
  // sharedToolState below) - this only wires the chart, not any
  // buttons.
  function attach() {
    const chart = cfg.getChart(), series = cfg.getSeries();

    // Throttles preview-line updates to once per animation frame.
    // Calling setData() synchronously on every single crosshairMove
    // event turned out to be its own trigger for the library's
    // stack-overflow bug (separate from the same-bar issue below) -
    // deferring the actual update via requestAnimationFrame breaks
    // that re-entrant chain, since it always runs in a fresh task
    // rather than nested inside the event that triggered it.
    chart.subscribeCrosshairMove((param) => {
      if (!pendingDrawPoint || !previewSeries) return;
      if (!param.point || !param.time) return;
      // Two points on the SAME bar crash this charting library outright
      // (infinite recursion inside its own auto-scale code). Since the
      // mouse always passes back over the anchor's own bar right after
      // the first click, just skip that frame and keep showing the
      // last valid preview.
      if (timeToNumeric(param.time) === timeToNumeric(pendingDrawPoint.time)) return;
      const price = series.coordinateToPrice(param.point.y);
      if (price === null) return;
      previewRafData = { time: param.time, price };
      if (previewRafId === null) previewRafId = requestAnimationFrame(flushPreview);
    });

    chart.subscribeClick((param) => {
      // Cursor tool: click near an existing drawing to select it (shows
      // drag handles + a Delete button); click empty space to deselect.
      // Selection stays per-pane even though the tool itself is shared.
      if (cfg.shared.tool === 'none') {
        if (!param.point) return;
        selectDrawing(findDrawingAt(param.point.x, param.point.y));
        return;
      }

      // A single shared toolbar can arm a tool that then gets used in
      // EITHER pane - but once the first click of a 2-click draw has
      // happened in one pane, clicks in the other pane must be ignored
      // until that draw finishes or is cancelled, or the second click
      // would try to finish a shape using data from the wrong chart.
      if (cfg.shared.lockedPane && cfg.shared.lockedPane !== cfg.paneId) return;

      if (!param.time || !param.point) return;
      const price = series.coordinateToPrice(param.point.y);
      if (price === null) return;

      if (cfg.shared.tool === 'hline') {
        addHline(price, 'blue', '', 'user');
        cfg.shared.setTool('none');
        return;
      }
      if (cfg.shared.tool === 'hray') {
        addUserDrawing('hray', param.time, price, null, null, '#2962ff', 'user');
        cfg.shared.setTool('none');
        return;
      }
      // trendline / ray - two clicks needed. First click drops a
      // preview line (with a marker dot at the anchor) that then
      // follows the mouse via subscribeCrosshairMove above until the
      // second click.
      if (!pendingDrawPoint) {
        cfg.shared.lockedPane = cfg.paneId;
        pendingDrawPoint = { time: param.time, price };
        previewSeries = chart.addLineSeries({
          color: '#2962ff', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
          pointMarkersVisible: true, autoscaleInfoProvider: () => null,
        });
        previewSeries.setData([{ time: pendingDrawPoint.time, value: pendingDrawPoint.price }]);
        setStatus('Click a second point to finish the line.', false);
        return;
      }
      if (timeToNumeric(param.time) === timeToNumeric(pendingDrawPoint.time)) {
        setStatus('Second point needs to be on a different bar - click again.', true);
        return;
      }
      const anchor = pendingDrawPoint;
      const tool = cfg.shared.tool;
      cancelPendingDraw();
      addUserDrawing(tool, anchor.time, anchor.price, param.time, price, '#2962ff', 'user');
      cfg.shared.setTool('none');
    });

    chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
      renderSelectionOverlay();
      scheduleOverlaySync();
    });
  }

  // Called when this pane's chart is being torn down (RSI toggled off)
  // so its state doesn't reference series/handles that no longer exist.
  // The chart's own .remove() already destroys every series drawn on
  // it, so this just clears our bookkeeping and the overlay DOM.
  function reset() {
    cancelPendingDraw();
    selectedDrawing = null;
    settingsPanelOpen = false;
    timeframePanelOpen = false;
    userDrawings.length = 0;
    priceLines.length = 0;
    const el = document.getElementById(cfg.overlayId);
    if (el) el.innerHTML = '';
  }

  function clearAllDrawings() {
    const chart = cfg.getChart(), series = cfg.getSeries();
    for (const pl of priceLines) series.removePriceLine(pl.lwcHandle);
    priceLines.length = 0;
    for (const d of userDrawings) if (d.series) chart.removeSeries(d.series);
    userDrawings.length = 0;
    selectedDrawing = null;
    const el = document.getElementById(cfg.overlayId);
    if (el) el.innerHTML = '';
  }

  // Called after this pane's timeframe changes (loadTimeframe/
  // loadRsiData) - drawings are no longer wiped on a timeframe switch,
  // so instead every existing one needs its points re-resolved against
  // the new bars (redrawShape, via resolveDrawingTime inside
  // getShapePoints) and its visibility re-checked against the new
  // timeframe's checkbox state.
  function refreshForTimeframe() {
    for (const d of userDrawings) redrawShape(d);
    for (const pl of priceLines) applyVisibility(pl, 'hline');
    renderSelectionOverlay();
    // Same one-frame-lag risk as scheduleOverlaySync's callers below -
    // this runs in the same synchronous tick as loadTimeframe's own
    // chart.timeScale().setVisibleLogicalRange() call, made just before
    // refreshForTimeframe() to default the new timeframe's view to
    // real+future bars.
    scheduleOverlaySync();
  }

  return {
    attach, reset, refreshOverlay: renderSelectionOverlay, handleKeydown, clearAllDrawings,
    addUserDrawing, addHline, cancelAndDeselect, refreshForTimeframe,
    userDrawings, priceLines,
  };
}

// Tool selection is shared across both panes now - one toolbar, and
// whichever pane you click into (main chart or RSI) receives the draw.
// `lockedPane` prevents a click in the OTHER pane from hijacking a
// draw that's already mid-sequence (e.g. the first of Trend Line's two
// clicks) in this one - see the comment in createDrawingPane's
// attach() for how it's used.
const sharedToolState = {
  tool: 'none',
  lockedPane: null,
  setTool(tool) {
    this.tool = tool;
    document.querySelectorAll('#draw-toolbar .draw-tool-btn').forEach((b) => b.classList.toggle('active', b.dataset.tool === tool));
    mainPane.cancelAndDeselect();
    rsiPane.cancelAndDeselect();
  },
};

// The main chart's own drawing tools - same behavior as before this was
// generalized, just now going through the shared factory.
const mainPane = createDrawingPane({
  getChart: () => chart,
  getSeries: () => series,
  getContainerEl: () => chartEl,
  getBars: () => barsData,
  getCurrentTFKey: () => currentTF,
  overlayId: 'drawing-overlay',
  paneId: 'main',
  shared: sharedToolState,
  isLog: true,
});
mainPane.attach();

// RSI's own drawing tools - shares the same toolbar and tool-selection
// state as mainPane (see sharedToolState above) but keeps its own
// selection/drawings, since those genuinely belong to different chart
// instances. RSI's chart instance is destroyed and recreated whenever
// RSI is toggled off/on (see setRsiEnabled above, which calls
// rsiPane.attach()/reset() around each re-creation/teardown) - so
// unlike mainPane, a single attach() at startup isn't enough on its
// own. RSI is on by default (rsiEnabled starts true) and
// createRsiChart() already ran once, synchronously, near the top of
// this script - well before this const exists - so that first
// rsiChart/rsiSeries instance still needs its own explicit attach()
// call below. RSI's price scale is a fixed 0-100 linear range, not
// logarithmic, hence isLog: false.
let rsiBarsData = [];
const rsiPane = createDrawingPane({
  getChart: () => rsiChart,
  getSeries: () => rsiSeries,
  getContainerEl: () => rsiChartEl,
  getBars: () => rsiBarsData,
  getCurrentTFKey: () => rsiTF,
  overlayId: 'rsi-drawing-overlay',
  paneId: 'rsi',
  shared: sharedToolState,
  isLog: false,
});
if (rsiChart) rsiPane.attach();

// The one shared toolbar's buttons - clicking one arms that tool for
// whichever pane gets clicked next (see sharedToolState/attach()).
document.querySelectorAll('#draw-toolbar .draw-tool-btn').forEach((btn) => {
  btn.onclick = () => sharedToolState.setTool(btn.dataset.tool);
});

// Keyboard shortcuts (Escape / Delete) apply to whichever pane actually
// owns the current selection (Escape for an in-progress draw goes
// through the shared tool state instead, since that's shared too) -
// each pane's handleKeydown() is a no-op and returns false if it has
// nothing to do, so trying both here is safe.
document.addEventListener('keydown', (e) => {
  if (mainPane.handleKeydown(e)) return;
  rsiPane.handleKeydown(e);
});

const shapeMap = { arrowUp: 'arrowUp', arrowDown: 'arrowDown', circle: 'circle' };
const colorMap = { green: '#26a69a', red: '#ef5350', blue: '#2962ff' };

// Shared handlers for LINE/TRENDLINE/RAY/HRAY-shaped commands, used by
// both the main-chart and RSI_-prefixed variants below - `pane` is
// whichever createDrawingPane() controller (mainPane or rsiPane) the
// command should land on.
function handleHlineCommand(pane, attrs, line, errors) {
  if (!attrs.price) { errors.push(`LINE missing price: "${line}"`); return false; }
  // Kept dashed/1px here (distinct from the solid/2px default a
  // hand-drawn horizontal line gets) as a visual cue that this
  // particular line came from a pasted Claude command.
  pane.addHline(parseFloat(attrs.price), attrs.color || 'blue', attrs.label || '', 'claude', 1, 'dashed');
  return true;
}

function handleTrendRayCommand(pane, cmd, attrs, line, errors) {
  if (!attrs.time1 || !attrs.price1 || !attrs.time2 || !attrs.price2) {
    errors.push(`${cmd} missing time1/price1/time2/price2: "${line}"`);
    return false;
  }
  if (timeToNumeric(attrs.time1) === timeToNumeric(attrs.time2)) {
    // time1/time2 on the same bar crashes the charting library outright
    // (see the comment above chart.subscribeCrosshairMove in
    // createDrawingPane) - reject rather than let it through.
    errors.push(`${cmd} time1 and time2 must be different dates: "${line}"`);
    return false;
  }
  pane.addUserDrawing(
    cmd.endsWith('TRENDLINE') ? 'trendline' : 'ray',
    attrs.time1, parseFloat(attrs.price1), attrs.time2, parseFloat(attrs.price2),
    colorMap[attrs.color] || '#2962ff', 'claude'
  );
  return true;
}

function handleHrayCommand(pane, attrs, line, errors) {
  if (!attrs.time || !attrs.price) { errors.push(`HRAY missing time/price: "${line}"`); return false; }
  pane.addUserDrawing('hray', attrs.time, parseFloat(attrs.price), null, null, colorMap[attrs.color] || '#2962ff', 'claude');
  return true;
}

function renderCommands() {
  const raw = document.getElementById('input-box').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) {
    setStatus('Nothing to draw — paste some commands first.', true);
    return;
  }

  let addedMarkers = 0, addedLines = 0, errors = [];

  for (const line of lines) {
    const [cmd, ...restParts] = line.split(/\s+(.*)/s);
    const rest = restParts.join(' ');
    const attrs = parseAttrs(rest || '');

    if (cmd === 'MARKER') {
      if (!attrs.date) { errors.push(`MARKER missing date: "${line}"`); continue; }
      markers.push({
        time: attrs.date,
        position: attrs.pos === 'below' ? 'belowBar' : 'aboveBar',
        shape: shapeMap[attrs.shape] || 'circle',
        color: colorMap[attrs.color] || '#2962ff',
        text: attrs.text || '',
        source: 'claude',
      });
      addedMarkers++;
    } else if (cmd === 'LINE') {
      if (handleHlineCommand(mainPane, attrs, line, errors)) addedLines++;
    } else if (cmd === 'RSI_LINE') {
      if (handleHlineCommand(rsiPane, attrs, line, errors)) addedLines++;
    } else if (cmd === 'TRENDLINE' || cmd === 'RAY') {
      if (handleTrendRayCommand(mainPane, cmd, attrs, line, errors)) addedLines++;
    } else if (cmd === 'RSI_TRENDLINE' || cmd === 'RSI_RAY') {
      if (handleTrendRayCommand(rsiPane, cmd, attrs, line, errors)) addedLines++;
    } else if (cmd === 'HRAY') {
      if (handleHrayCommand(mainPane, attrs, line, errors)) addedLines++;
    } else if (cmd === 'RSI_HRAY') {
      if (handleHrayCommand(rsiPane, attrs, line, errors)) addedLines++;
    } else {
      errors.push(`Unknown command: "${line}"`);
    }
  }

  refreshMarkers();

  if (errors.length) {
    setStatus(`Drew ${addedMarkers} marker(s), ${addedLines} line(s). ${errors.length} line(s) had issues: ${errors.join(' | ')}`, true);
  } else {
    setStatus(`Drew ${addedMarkers} marker(s) and ${addedLines} line(s) successfully.`, false);
  }
  updateOutputBox();
}

function clearAll() {
  markers = [];
  refreshMarkers();
  mainPane.clearAllDrawings();
  rsiPane.clearAllDrawings();
  document.getElementById('input-box').value = '';
  setStatus('Chart cleared.', false);
  updateOutputBox();
}

const COLOR_NAMES = {
  '0,0,0': 'black', '41,98,255': 'blue', '38,166,154': 'green', '239,83,80': 'red',
  '255,152,0': 'orange', '233,30,99': 'pink', '251,140,0': 'amber', '142,36,170': 'purple',
  '57,73,171': 'indigo', '109,76,65': 'brown', '0,172,193': 'cyan', '124,179,66': 'light green',
  '249,168,37': 'gold', '69,90,100': 'slate', '91,143,249': 'light blue', '19,23,34': 'black',
  '0,137,123': 'teal',
};

function rgbToColorName(rgbString) {
  const match = rgbString.match(/(\d+),\s*(\d+),\s*(\d+)/);
  if (!match) return null;
  return COLOR_NAMES[`${match[1]},${match[2]},${match[3]}`] || null;
}

// Builds LINE/TRENDLINE/RAY/HRAY protocol lines for one pane's
// drawings - `prefix` is '' for the main chart or 'RSI_' for the RSI
// pane, so the same command shapes serve both without ambiguity about
// which pane a pasted command targets.
function buildDrawingCommandLines(priceLines, userDrawings, prefix) {
  const out = [];
  for (const pl of priceLines) {
    const tag = pl.source === 'user' ? ' [added by user on chart]' : '';
    out.push(`${prefix}LINE price=${pl.price} color=${pl.color} label="${pl.label}"${tag}`);
  }
  for (const d of userDrawings) {
    const colorName = Object.keys(colorMap).find(k => colorMap[k] === d.color) || 'blue';
    const tag = d.source === 'user' ? ' [added by user on chart]' : '';
    if (d.type === 'trendline') {
      out.push(`${prefix}TRENDLINE time1=${d.time1} price1=${d.price1} time2=${d.time2} price2=${d.price2} color=${colorName}${tag}`);
    } else if (d.type === 'ray') {
      out.push(`${prefix}RAY time1=${d.time1} price1=${d.price1} time2=${d.time2} price2=${d.price2} color=${colorName}${tag}`);
    } else if (d.type === 'hray') {
      out.push(`${prefix}HRAY time=${d.time1} price=${d.price1} color=${colorName}${tag}`);
    }
  }
  return out;
}

function updateOutputBox() {
  const lines = [];

  lines.push('--- Chart Context ---');
  lines.push(`Ticker: ${currentTicker}`);
  lines.push(`Main chart timeframe: ${TIMEFRAME_META[currentTF].label}`);
  lines.push(rsiChart ? `RSI timeframe: ${TIMEFRAME_META[rsiTF].label}${rsiTF !== currentTF ? ' (different from main chart)' : ''}` : 'RSI: off');

  lines.push('');
  lines.push('--- Indicators ---');
  document.querySelectorAll('.ind-col').forEach(col => {
    const title = col.querySelector('.ind-col-title').textContent.trim();
    const states = [...col.querySelectorAll('.ind-row')]
      // RSI, Earnings, and the Volume bars are all visually obvious
      // directly from the chart/image itself (each either appears or
      // doesn't) - no need to also spell that out in text. Volume EMA 20
      // stays listed since it's a specific colored line worth naming.
      .filter(row => !['rsi', 'earnings', 'turnover'].includes(row.dataset.series))
      .map(row => {
        const cb = row.querySelector('input[type="checkbox"]');
        const label = row.textContent.trim();
        const swatch = row.querySelector('.swatch');
        let colorName = null;
        if (swatch) {
          const style = getComputedStyle(swatch);
          colorName = rgbToColorName(style.backgroundColor) || rgbToColorName(style.borderTopColor);
        }
        const colorSuffix = colorName ? ` (${colorName})` : '';
        return `${label}${colorSuffix}: ${cb.checked ? 'ON' : 'OFF'}`;
      });
    if (states.length) lines.push(`${title} - ${states.join(', ')}`);
  });

  lines.push('');
  lines.push('--- Drawings ---');
  const drawingLines = [];
  for (const m of markers) {
    const pos = m.position === 'belowBar' ? 'below' : 'above';
    const colorName = Object.keys(colorMap).find(k => colorMap[k] === m.color) || 'blue';
    const shapeName = Object.keys(shapeMap).find(k => shapeMap[k] === m.shape) || 'circle';
    const tag = m.source === 'user' ? ' [added by user on chart]' : '';
    drawingLines.push(`MARKER date=${m.time} pos=${pos} shape=${shapeName} color=${colorName} text="${m.text}"${tag}`);
  }
  drawingLines.push(...buildDrawingCommandLines(mainPane.priceLines, mainPane.userDrawings, ''));
  lines.push(drawingLines.length ? drawingLines.join('\n') : '(none)');

  // RSI drawings use an RSI_ prefix on the same LINE/TRENDLINE/RAY/HRAY
  // command shapes, kept in their own section so it's unambiguous which
  // pane a pasted command targets.
  const rsiDrawingLines = buildDrawingCommandLines(rsiPane.priceLines, rsiPane.userDrawings, 'RSI_');
  if (rsiDrawingLines.length) {
    lines.push('');
    lines.push('--- RSI Drawings ---');
    lines.push(rsiDrawingLines.join('\n'));
  }

  document.getElementById('output-box').value = lines.join('\n');
}

// Updates the LT/AT(3)/AT(20) box to whichever bar the crosshair is
// currently over, falling back to the latest bar when the cursor
// leaves the chart entirely.
chart.subscribeCrosshairMove(param => {
  if (!param.time) {
    updateHeadlineStats(lastRealBarIndex(barsData));
    updateTurnoverBox(lastRealBarIndex(barsData));
    return;
  }
  const index = barsData.findIndex(b => b.time === param.time);
  if (index !== -1) {
    updateHeadlineStats(index);
    updateTurnoverBox(index);
  }
});

// Captures just the chart canvas(es) - not the watchlist, not the
// sidebar - since Lightweight Charts' own takeScreenshot() only
// captures what it actually draws (candles, EMA/volume/RSI lines,
// markers), the HTML-overlay elements (earnings badges, the info
// boxes) are NOT included, since those are separate DOM elements
// layered on top rather than part of the chart's own canvas. A legend
// of currently-active indicators is drawn onto the image afterward,
// in the top-right corner, to compensate for the collapsible on-screen
// Captures the full chart area as actually rendered on screen -
// candles/EMA/volume/RSI lines AND the HTML-overlay elements
// (earnings badges, the info boxes, the indicator legend if it's
// currently expanded) that a plain canvas screenshot would miss, since
// those are separate DOM elements layered on top rather than part of
// the chart library's own canvas. Deliberately scoped to
// #main-chart-area and #rsi-chart-container only - never the
// watchlist or either sidebar panel.
async function captureChartArea() {
  const mainAreaCanvas = await html2canvas(document.getElementById('main-chart-area'), { backgroundColor: '#ffffff' });
  let combined = mainAreaCanvas;

  if (rsiChart && rsiEnabled) {
    const rsiAreaCanvas = await html2canvas(document.getElementById('rsi-chart-container'), { backgroundColor: '#ffffff' });
    combined = document.createElement('canvas');
    combined.width = Math.max(mainAreaCanvas.width, rsiAreaCanvas.width);
    combined.height = mainAreaCanvas.height + rsiAreaCanvas.height;
    const ctx = combined.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, combined.width, combined.height);
    ctx.drawImage(mainAreaCanvas, 0, 0);
    ctx.drawImage(rsiAreaCanvas, 0, mainAreaCanvas.height);
  }

  return combined;
}

// Appends the full Chart State text as actual rendered (readable) text
// below the image, ONLY for the "for Claude" capture - since Claude can
// read text directly out of an image, this lets one paste deliver both
// the visual chart and its full context in a single action, instead of
// needing separate text-copy and image-copy steps.
function appendTextBlock(canvas, text) {
  const lines = text.split('\n');
  const padding = 12, lineHeight = 13;
  const extraHeight = padding * 2 + lineHeight * lines.length;
  const result = document.createElement('canvas');
  result.width = canvas.width;
  result.height = canvas.height + extraHeight;
  const ctx = result.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, result.width, result.height);
  ctx.drawImage(canvas, 0, 0);
  ctx.fillStyle = '#131722';
  ctx.font = '11px monospace';
  lines.forEach((line, i) => {
    ctx.fillText(line, padding, canvas.height + padding + lineHeight * i + 10);
  });
  return result;
}

document.getElementById('copy-image-btn').addEventListener('click', async () => {
  (await captureChartArea()).toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(() => setStatus('Chart image copied to clipboard.', false))
      .catch(() => setStatus('Could not copy image - your browser may not support this.', true));
  });
});

document.getElementById('save-image-btn').addEventListener('click', async () => {
  (await captureChartArea()).toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${currentTicker}_${currentTF}_chart.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus('Chart image saved.', false);
  });
});

  withText.toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(() => setStatus('Image with Chart State text copied to clipboard.', false))

  });
});

window.addEventListener('resize', () => {
  chart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
  if (rsiEnabled && rsiChart) {
    rsiChart.applyOptions({ width: rsiChartEl.clientWidth, height: rsiChartEl.clientHeight });
  }
  renderEarningsOverlay();
  mainPane.refreshOverlay();
  rsiPane.refreshOverlay();
  positionDailyBox();
});

// Earnings triangles (and the main chart's drawing-selection handles)
// are plain HTML, not native chart elements, so they need to be
// manually repositioned whenever the visible time range changes
// (panning, zooming, scrolling). RSI's own pan/zoom is handled by its
// own subscribeVisibleLogicalRangeChange, set up inside rsiPane.attach().
chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
  renderEarningsOverlay();
  mainPane.refreshOverlay();
});

// Keeps the top-right "Current daily" box clear of the price axis labels
// on the right - the axis width varies by ticker (e.g. "$379.13" is
// wider than "$11.37"), so this is measured directly rather than
// guessed as a fixed pixel value.
function positionDailyBox() {
  const priceScaleWidth = chart.priceScale('right').width();
  document.getElementById('turnover-box-daily').style.right = priceScaleWidth + 'px';
}
positionDailyBox();

loadTimeframe('daily');
loadDailySnapshot(currentTicker);
